<head>

<style>
:root {
  --bg: #f3f4f1; --card: #ffffff; --ink: #1d2320; --muted: #66706a; --line: #dfe2dc;
  --accent: #1f6f54; --accent-ink: #ffffff; --ok: #1f8a5b; --ok-bg: #e4f4ec;
  --bad: #c8452f; --bad-bg: #fbe9e5; --todo: #e4e6e0; --sel: #e6f0ec; --mark: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a18; --card: #202522; --ink: #e9ece8; --muted: #9aa49e; --line: #333a36;
    --accent: #4bb88f; --accent-ink: #0d1512; --ok: #4bb88f; --ok-bg: #1c3229;
    --bad: #ea7a65; --bad-bg: #3a2320; --todo: #333a36; --sel: #243029; --mark: #0d1512;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a18; --card: #202522; --ink: #e9ece8; --muted: #9aa49e; --line: #333a36;
  --accent: #4bb88f; --accent-ink: #0d1512; --ok: #4bb88f; --ok-bg: #1c3229;
  --bad: #ea7a65; --bad-bg: #3a2320; --todo: #333a36; --sel: #243029; --mark: #0d1512;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sync { font-size: 13px; color: var(--muted); margin-top: 18px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { font-size: 26px; margin: 0 0 4px; }
h2 { font-size: 20px; margin: 0; line-height: 1.3; }
.muted { color: var(--muted); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 16px; }
@media (hover: hover) { .btn:hover { border-color: var(--accent); } }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.link { background: none; border: 0; padding: 0; color: var(--muted); font-size: 14px; text-decoration: underline; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--todo); }
.bar i { display: block; height: 100%; }
.bar .o { background: var(--ok); } .bar .b { background: var(--bad); }
.total { margin: 16px 0 20px; }
.total .nums { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.total b { font-size: 20px; }
.ch { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
@media (hover: hover) { .ch:hover { border-color: var(--accent); } }
.ch .row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; align-items: baseline; }
.ch .t { font-weight: 600; }
.ch .c { white-space: nowrap; font-variant-numeric: tabular-nums; }
.ch .num { color: var(--muted); font-weight: 400; margin-right: 6px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.modes { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; }
.map button { border: 1px solid transparent; background: var(--todo); border-radius: 5px; height: 32px; font-size: 13px; padding: 0; font-variant-numeric: tabular-nums; }
.map button.o { background: var(--ok-bg); color: var(--ok); }
.map button.b { background: var(--bad-bg); color: var(--bad); }
.map button.cur { border-color: var(--ink); font-weight: 700; }
.q { font-size: 18px; font-weight: 600; line-height: 1.4; margin: 6px 0 12px; }
.sign { display: block; max-width: min(100%, 340px); max-height: 220px; margin: 0 0 14px; border-radius: 6px; background: #fff; }
.opt { display: flex; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 7px; line-height: 1.4; }
@media (hover: hover) { .opt:hover:not(:disabled) { border-color: var(--accent); } }
.opt:disabled { cursor: default; color: inherit; }
.opt .k { flex: none; width: 22px; height: 22px; border: 1px solid var(--muted); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); border-radius: 50%; margin-top: 1px; }
.parts { margin: 0; padding-left: 18px; }
.parts li + li { margin-top: 4px; }
.opt.sel { border-color: var(--accent); background: var(--sel); }
.opt.sel .k { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .k { background: var(--ok); border-color: var(--ok); color: var(--mark); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: var(--mark); }
.opt.missed { border-color: var(--ok); background: var(--ok-bg); }
.opt.missed .k { background: var(--ok); border-color: var(--ok); color: var(--mark); }
.res { margin: 10px 0 12px; font-weight: 600; }
.res.o { color: var(--ok); } .res.b { color: var(--bad); }
.ref { font-size: 13.5px; color: var(--muted); margin-bottom: 14px; }
.actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.hint { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.done { text-align: center; padding: 28px 16px; }
.save-err { color: var(--bad); font-size: 14px; margin-top: 10px; }
@media (max-width: 560px) { .wrap { padding-block-start: 16px; } .opt { padding: 12px; } h1 { font-size: 22px; } .q { font-size: 17px; } }
</style>
</head>

<script>window.QUESTIONS = {"chapters": [{"id": 1, "title": "Общие вопросы по охране труда", "legend": {"Л70": "Закон Республики Беларусь от 23.06.2008 № 356-З \"Об охране труда\" (в ред. Закона Республики Беларусь от 17.07.2023 № 300-З)", "Л1": "Инструкция о порядке обучения, стажировки, инструктажа и проверки знаний работающих по вопросам охраны труда (утв. пост. Минтруда и соцзащиты РБ от 28.11.2008 № 175 в ред. пост. Минтруда и соцзащиты РБ от 02.09.2024 № 73)", "Л19": "Положение о порядке создания и деятельности комиссии организации для проверки знаний, работающих по вопросам охраны труда (утв. пост. Минтруда и соцзащиты РБ от 30.12.2008 №210, в ред. пост. Минтруда и соцзащиты РБ от 29.05.2020 № 55)", "Л18": "Инструкция о порядке планирования и разработки мероприятий по охране труда (утв. пост. Минтруда и соцзащиты РБ от 28.11.2013 №111 с изм. утв. пост. Минтруда и соцзащиты РБ от 30.04.2020 № 43)", "Л5": "Инструкция о порядке осуществления контроля за соблюдением работниками требований по охране труда в организации и структурных подразделениях (утв. пост. Минтруда и соцзащиты РБ от 15.05.2020 №51 в ред. пост. Минтруда и соцзащиты РБ от 02.09.2024 № 72)", "Л11": "Типовое положение о службе охраны труда организации (утв. пост. Минтруда и соцзащиты РБ от 30.09.2013 № 98 с изм. утв. пост. Минтруда и соцзащиты РБ от 30.04.2020 № 42)", "Л7": "Инструкция о порядке обеспечения работников средствами индивидуальной защиты (утв. пост. Минтруда и соцзащиты РБ от 30.12.2008 № 209 в ред. пост. Минтруда и соцзащиты РБ от 24.04.2024 № 23)", "Л42": "Положение о порядке проведения аттестации рабочих мест по условиям труда (утв. пост. Совета Министров РБ от 22.02.2008 № 253 в ред. пост. Совета Министров РБ от 03.03 2021 № 125)", "Л43": "Инструкция по оценке условий труда при аттестации рабочих мест по условиям труда. (Утв. пост. Минтруда и соцзащиты РБ от 22.02.2008 № 35, в ред. пост. Минтруда и соцзащиты РБ от 08.05.2026 № 41)", "Л44": "Инструкция о порядке применения списков производств, работ, профессий, должностей и показателей, дающих право на пенсию по возрасту за работу с особыми условиями труда, утв. пост. Совета Министров РБ от 25.05.2005 № 536 (утв. пост. Минтруда и соцзащиты РБ от 14.07.2005 № 86, в ред. пост. Минтруда и соцзащиты РБ от 26.12.2016 № 76)", "Л47": "Инструкция о порядке проведения обязательных и внеочередных медицинских осмотров работающих (утв. пост. Минздрава РБ от 29.07.2019 № 74, в ред. пост. Минздрава РБ от 20.03.2026 № 21)", "Л15": "Инструкция о порядке проведения предсменного (перед началом работы, смены) медицинского осмотра работников (утв. пост. Минтруда и соцзащиты РБ и Минздрава РБ от 02.12.2013 №116/119, изм. от 30.04.2020 № 45/47)", "Л16": "Инструкция о порядке проведения освидетельствования на предмет нахождения в состоянии алкогольного, наркотического или токсического опьянения работников (утв. пост. Минтруда и соцзащиты РБ и Минздрава РБ от 02.12.2013 №116/119, изм. от 30.04.2020 № 45/47)", "Л46": "ГОСТ 12.0.003 ССБТ \"Опасные и вредные производственные факторы. Классификация\" (введен в действие пост. Госстандарта СССР от 18 ноября 1974 г. № 2551, Изменением № 1, утвержденным в октябре 1978 г)", "Л10": "Инструкция о порядке разработки и принятия работодателями локальных правовых актов, содержащих требования по охране труда, в виде инструкций по охране труда для профессий рабочих и (или) отдельных видов работ (услуг) (утв. пост. Минтруда и соцзащиты РБ 28.11.2008 № 176, с изм. утв. пост. Минтруда и соцзащиты РБ от 30.04.2020 № 44)", "Л72": "О перечне типовых документов (пост. Министерства юстиции РБ от 24.05.2012 № 140 в ред. пост. от 11.01.2023 № 1)", "Л23": "Кодекс Республики Беларусь об административных правонарушениях от 06.01.2021 № 91-З (в ред. Закона РБ от 15.04.2026 № 138-З)", "Л14": "Правила по охране труда (утв. пост. Минтруда и соцзащиты РБ от 01.07.2021 № 53, в ред. пост. Минтруда и соцзащиты РБ от 08.08.2025 № 75)", "Л71": "Положение о непрерывном профессиональном образовании руководящих работников и специалистов (утв. пост. Совета Министров РБ от 01.09.2022 № 574 в ред. пост. от 26.03.2025 № 178)", "Л85": "Гигиенический норматив «Показатели безопасности и безвредности факторов производственной среды и трудового процесса при работе с видеодисплейными терминалами и электронно-вычислительными машинами» (утв. пост. Совета Министров РБ от 25.01.2021 № 37 в ред. пост. от 05.12.2024 № 904)"}, "qs": [{"n": 1, "q": "Что понимается под термином \"охрана труда\" в Законе Республики Беларусь \"Об охране труда\"?", "ref": "Л70 Ст.1", "a": ["Система обеспечения безопасности жизни и здоровья работающих в процессе трудовой деятельности, включающая правовые, социально-экономические, организационные, технические, психофизиологические, санитарно-противоэпидемические, лечебно-профилактические, реабилитационные и иные мероприятия и средства"], "w": ["Система организационных и технических мероприятий, направленных исключительно на предотвращение несчастных случаев на производстве и контроль за соблюдением работающими правил внутреннего трудового распорядка и трудовой дисциплины в организации", "Совокупность правовых норм, регулирующих отношения между нанимателем и работником по поводу оплаты труда, рабочего времени, времени отдыха и предоставления социальных гарантий работающим в процессе их трудовой деятельности", "Система обеспечения безопасности оборудования и зданий в процессе их эксплуатации, включающая технические, противопожарные, санитарно-гигиенические и иные мероприятия и средства, проводимые службой охраны труда организации"]}, {"n": 2, "q": "На кого распространяется действие Закона Республики Беларусь \"Об охране труда\"?", "ref": "Л70 Ст.3", "a": ["На всех работодателей и работающих граждан Республики Беларусь, иностранных граждан и лиц без гражданства"], "w": ["Только на работодателей государственной формы собственности и их работников, являющихся гражданами Республики Беларусь", "На всех работодателей и работающих граждан Республики Беларусь, за исключением иностранных граждан и лиц без гражданства", "Только на работающих по трудовому договору в организациях с численностью свыше 100 человек"]}, {"n": 3, "q": "Что должен предпринять работодатель при отсутствии в нормативных правовых актах, в том числе технических нормативных правовых актах, технических регламентах Таможенного союза и Евразийского экономического союза, требований по охране труда?", "ref": "Л70 Ст.4", "a": ["Принять необходимые меры, обеспечивающие сохранение жизни, здоровья и работоспособности работающих в процессе трудовой деятельности"], "w": ["Приостановить деятельность организации до принятия соответствующих нормативных правовых актов и уведомить об этом органы Департамента государственной инспекции труда", "Запросить письменные разъяснения в Министерстве труда и социальной защиты и до их получения продолжать работы в соответствии с инструкциями изготовителя оборудования", "Руководствоваться локальными актами вышестоящей организации, а при их отсутствии - перевести работающих на другую работу до появления обязательных требований"]}, {"n": 4, "q": "Какие органы проводят государственную экспертизу условий труда на рабочих местах и оценку качества проведения аттестации рабочих мест по условиям труда?", "ref": "Л70 Ст. 10-1", "a": ["Органы государственной экспертизы условий труда"], "w": ["Органы Департамента государственной инспекции труда", "Органы государственного санитарного надзора", "Аккредитованные лаборатории организаций"]}, {"n": 5, "q": "Имеет ли работающий право на получение от работодателя достоверной информации о состоянии условий и охраны труда на рабочем месте, а также о средствах защиты от воздействия вредных и (или) опасных производственных факторов?", "ref": "Л70 Ст.11", "a": ["Имеет в любом случае"], "w": ["Имеет только при заключении трудового договора", "Имеет только с разрешения руководителя организации", "Имеет только на работах с вредными условиями"]}, {"n": 6, "q": "На что из указанного в вариантах ответа имеет право работающий?", "ref": "Л70 Ст.11", "a": ["На обучение безопасным методам и приемам работы, проведение инструктажа по вопросам охраны труда", "На рабочее место, соответствующее требованиям по охране труда", "На обеспечение необходимыми средствами индивидуальной защиты, средствами коллективной защиты, санитарно-бытовыми помещениями, оснащенными необходимыми устройствами и средствами"], "w": ["На ежегодную внеочередную оплату работодателем санаторно-курортного лечения независимо от условий труда", "На самостоятельный выбор режима рабочего времени без согласования с работодателем", "На получение от работодателя средств индивидуальной защиты в собственность с правом их продажи после окончания срока носки"]}, {"n": 7, "q": "В каком из указанных ниже случаев работающий имеет право отказаться от выполнения порученной работы?", "ref": "Л70 Ст.11", "a": ["В случае возникновения непосредственной опасности для жизни и здоровья его и окружающих до устранения этой опасности"], "w": ["В случае несогласия работающего с размером установленной ему заработной платы до её пересмотра", "В случае поручения работы, связанной с вредными условиями труда, при наличии доплаты за такие условия", "В случае отсутствия непосредственного руководителя на рабочем месте в течение рабочей смены"]}, {"n": 8, "q": "Работник отказался от выполнения порученной работы по причине непредоставления ему средств индивидуальной защиты, непосредственно обеспечивающих безопасность труда, о чем сообщил письменно нанимателю. Каковы должны быть дальнейшие действия работника?", "ref": "Л70 Ст.11", "a": ["До устранения нарушений подчиняться правилам внутреннего трудового распорядка, за исключением выполнения вышеуказанной работы"], "w": ["Покинуть территорию организации до устранения нарушений, поскольку на время отказа от работы правила внутреннего трудового распорядка на него не распространяются", "Приступить к работе, не дожидаясь устранения нарушений, поскольку письменное уведомление освобождает работника от ответственности за последствия", "До устранения нарушений обратиться в органы Департамента государственной инспекции труда, находясь на этот период в неоплачиваемом отпуске по собственному заявлению"]}, {"n": 9, "q": "Работодатель предоставляет место для выполнения работ лицу, с которым заключен гражданско-правовой договор на выполнение работ. Обязан ли работодатель обеспечить, чтобы это место соответствовало требованиям по охране труда?", "ref": "Л70 Ст.17", "a": ["Да, обязан"], "w": ["Нет, не обязан", "Обязан только при численности работающих более 100 человек", "Обязан только при работах с повышенной опасностью"]}, {"n": 10, "q": "Обязан ли работодатель не допускать к работе, отстранять от работы в соответствующий день (смену) работающего, появившегося на работе в состоянии, связанном с болезнью, препятствующем выполнению работ (оказанию услуг)?", "ref": "Л70 Ст.17", "a": ["Обязан"], "w": ["Не обязан, работающий сам принимает решение", "Обязан только при наличии справки организации здравоохранения", "Не обязан, если работа не относится к работам с повышенной опасностью"]}, {"n": 11, "q": "В каких случаях, предусмотренных законодательством, из указанных в вариантах ответа, наниматель обязан не допустить к работе, отстранить от работы в соответствующий день (смену) работника?", "ref": "Л70 Ст.17", "a": ["Если он не прошел инструктаж, стажировку и проверку знаний по вопросам охраны труда", "Если он не использует средства индивидуальной защиты", "Если он не прошел медицинский осмотр"], "w": ["Если он отказался от прохождения обучения за счёт собственных средств", "Если он опоздал на начало смены не более чем на 30 минут", "Если он отказался от участия в собрании трудового коллектива по вопросам охраны труда"]}, {"n": 12, "q": "Обязан ли работодатель включать в гражданско-правовой договор предусмотренные законодательством обязательства сторон по обеспечению безопасных условий труда?", "ref": "Л70 Ст.17", "a": ["Да, обязан"], "w": ["Нет, не обязан", "Обязан только при договоре на срок более одного года", "Обязан только по требованию исполнителя работ"]}, {"n": 13, "q": "В каком из вариантов ответа правильно изложены обязанности работающего в области охраны труда?", "ref": "Л70 Ст.19", "a": ["Заботиться о личной безопасности и личном здоровье, а также о безопасности окружающих в процессе выполнения работ либо во время нахождения на территории организации"], "w": ["Заботиться о безопасности только в процессе выполнения своих работ, а безопасность окружающих и территории организации обеспечивается службой охраны труда и нанимателем", "Осуществлять контроль за соблюдением другими работниками требований по охране труда и выдавать им предписания об устранении выявленных нарушений в организации", "Самостоятельно проводить ремонт неисправного оборудования и средств защиты, а также устранять выявленные на территории организации нарушения требований охраны труда"]}, {"n": 14, "q": "Кого работник обязан немедленно известить о неисправности оборудования, инструмента, приспособлений, транспортных средств, средств защиты?", "ref": "Л70 Ст.19", "a": ["Своего непосредственного руководителя или иное уполномоченное должностное лицо нанимателя"], "w": ["Специалиста по охране труда организации и представителя профсоюза", "Только специалиста по охране труда либо дежурного службы главного механика", "Только руководителя организации письменным заявлением на следующий рабочий день"]}, {"n": 15, "q": "Кого работник обязан немедленно известить об ухудшении состояния своего здоровья?", "ref": "Л70 Ст.19", "a": ["Своего непосредственного руководителя или иное уполномоченное должностное лицо нанимателя"], "w": ["Специалиста по охране труда организации и своего лечащего врача", "Только отдел кадров организации письменным заявлением", "Только организацию здравоохранения, в которой он наблюдается"]}, {"n": 16, "q": "Кому работающий обязан немедленно сообщить о любой ситуации, угрожающей жизни или здоровью работающих и окружающих, несчастном случае, произошедшем на производстве?", "ref": "Л70 Ст.19", "a": ["Работодателю"], "w": ["Страховщику", "Профсоюзу", "В Департамент государственной инспекции труда"]}, {"n": 17, "q": "Что из перечисленного ниже относится к обязанностям работающих в области охраны труда?", "ref": "Л70 Ст.19", "a": ["Соблюдать требования по охране труда, а также правила поведения на территории организации, в производственных, вспомогательных и бытовых помещениях", "Проходить в установленном законодательством порядке медицинские осмотры, обучение, стажировку, инструктаж и проверку знаний по вопросам охраны труда", "Использовать и правильно применять средства индивидуальной защиты и средства коллективной защиты"], "w": ["Самостоятельно определять перечень необходимых средств индивидуальной защиты и нормы их выдачи", "Проводить за свой счёт периодические медицинские осмотры и проверку знаний", "Выдавать другим работникам обязательные для исполнения предписания об устранении нарушений требований по охране труда"]}, {"n": 18, "q": "Должности специалистов по охране труда в организациях сферы производства вводятся при численности работников свыше ...", "ref": "Л70 Ст.20", "a": ["... 100 человек"], "w": ["... 50 человек", "... 150 человек", "... 200 человек"]}, {"n": 19, "q": "На кого наниматель может возложить обязанности по охране труда при численности работающих в организации менее 100 человек?", "ref": "Л70 Ст.20", "a": ["На специалиста по охране труда", "На уполномоченное им должностное лицо, имеющее необходимую подготовку", "На юридическое лицо (индивидуального предпринимателя), аккредитованное на оказание услуг в области охраны труда в соответствии с законодательством"], "w": ["На любого работника организации без необходимой подготовки по его письменному согласию", "На представителя профсоюза организации, не имеющего необходимой подготовки", "На врача организации здравоохранения, обслуживающей работников организации, без оформления договора"]}, {"n": 20, "q": "Как организовать проверку знаний работающих по вопросам охраны труда при невозможности создания комиссии организации для проверки знаний работающих по вопросам охраны труда?", "ref": "Л70 Ст.25", "a": ["Проверку знаний проводить в комиссиях местных исполнительных и распорядительных органов или комиссиях организаций соответствующего профиля деятельности"], "w": ["Проверку знаний не проводить до момента создания комиссии организации, а работающих допускать к работе на основании пройденного инструктажа и стажировки", "Проверку знаний проводить единолично специалистом по охране труда или руководителем организации с оформлением результатов записью в журнале инструктажа", "Проверку знаний проводить только в комиссиях органов Департамента государственной инспекции труда по письменному заявлению каждого работающего"]}, {"n": 21, "q": "Кто должен нести расходы по проведению медицинских осмотров работников?", "ref": "Л70 Ст.27", "a": ["Наниматель"], "w": ["Работник с последующей компенсацией при положительном результате", "Организация здравоохранения за счёт средств бюджета", "Наниматель и работник в равных долях"]}, {"n": 22, "q": "Обязан ли работодатель требовать документы, подтверждающие прохождение медицинского осмотра работающими по гражданско-правовым договорам?", "ref": "Л70 Ст.27", "a": ["Обязан, если это необходимо для выполнения соответствующих видов работ (оказания услуг)"], "w": ["Обязан во всех случаях независимо от видов работ (оказания услуг)", "Не обязан, поскольку такие лица не являются работниками организации", "Обязан только при договоре на срок более шести месяцев"]}, {"n": 23, "q": "Как часто должны проводиться общие плановые технические осмотры капитальных строений (зданий, сооружений), изолированных помещений?", "ref": "Л70 Ст.34", "a": ["Два раза в год - весной и осенью"], "w": ["Один раз в год - весной", "Один раз в три года - осенью", "Четыре раза в год - по окончании каждого квартала"]}, {"n": 24, "q": "Должностные лица Департамента, являющиеся государственными инспекторами труда, имеют право запрашивать копии документов, ведение которых предусмотрено законодательством о труде и об охране труда, если ...", "ref": "Л70 Ст.40", "a": ["... на это отсутствуют установленные законодательством ограничения"], "w": ["... на это получено письменное согласие руководителя проверяемой организации", "... имеется решение суда или прокуратуры о предоставлении этих документов", "... запрос согласован с вышестоящей организацией проверяемого нанимателя"]}, {"n": 25, "q": "Как часто руководителю организации необходимо направлять специалистов по охране труда для повышения квалификации в организации, осуществляющие образовательную деятельность?", "ref": "Л71 п.38", "a": ["По мере необходимости, но не реже 1 раза в 3 года"], "w": ["По мере необходимости, но не реже 1 раза в 5 лет", "Ежегодно независимо от необходимости", "По мере необходимости, но не реже 1 раза в 2 года"]}, {"n": 26, "q": "Как должны допускаться к работе работники, совмещающие несколько должностей служащих (профессий рабочих)?", "ref": "Л1 п.4", "a": ["После обучения, инструктажа, стажировки и проверки знаний по вопросам охраны труда по совмещаемым должностям служащих (профессиям рабочих) в случаях, если это требуется по совмещаемым должностям служащих (профессиям рабочих)"], "w": ["После обучения, инструктажа и проверки знаний только по основной профессии рабочего, поскольку требования по совмещаемым должностям служащих (профессиям рабочих) охватываются подготовкой по основной должности (профессии)", "После обучения и стажировки по основной должности и прохождения вводного инструктажа по совмещаемым должностям служащих (профессиям рабочих) независимо от требований законодательства по таким должностям (профессиям)", "После письменного заявления работника и приказа нанимателя о совмещении, без какой-либо дополнительной подготовки по совмещаемым должностям служащих (профессиям рабочих), если работник имеет стаж более трёх лет"]}, {"n": 27, "q": "Какой бывает инструктаж по охране труда по характеру и времени проведения?", "ref": "Л1 п.15, Л70 ст.25", "a": ["Вводный", "Первичный на рабочем месте", "Повторный", "Внеплановый", "Целевой"], "w": ["Ежемесячный контрольный", "Заключительный при увольнении", "Предсменный"]}, {"n": 28, "q": "Требуется ли проводить вводный инструктаж по охране труда с командированными работниками?", "ref": "Л1 п.16", "a": ["Да, требуется при участии командированных работников в производственном процессе или выполнении работ на территории организации"], "w": ["Нет, не требуется, инструктаж проводит только организация, направившая работников в командировку", "Требуется только при сроке командировки более одного месяца, независимо от участия в производственном процессе", "Требуется только при выполнении ими работ с повышенной опасностью на территории организации"]}, {"n": 29, "q": "Требуется ли проводить вводный инструктаж по охране труда с работниками, при временном переводе их к другому нанимателю?", "ref": "Л1 п.16", "a": ["Да, требуется"], "w": ["Нет, не требуется", "Требуется только при переводе на срок более месяца", "Требуется только при работах с повышенной опасностью"]}, {"n": 30, "q": "Кто проводит вводный инструктаж по охране труда?", "ref": "Л1 п.19", "a": ["Специалист по охране труда или уполномоченное должностное лицо нанимателя, на которого возложены обязанности специалиста по охране труда. В организациях с численностью работников до 15 человек включительно может проводить руководитель организации"], "w": ["Непосредственный руководитель работ (мастер, прораб, начальник участка) или уполномоченное им должностное лицо из числа специалистов. В организациях с численностью работников до 50 человек включительно может проводить руководитель организации", "Только специалист по охране труда. В организациях, где отсутствует такой специалист, вводный инструктаж проводит представитель организации, аккредитованной на оказание услуг в области охраны труда, по договору с нанимателем", "Специалист по кадрам при оформлении на работу либо председатель комиссии для проверки знаний. В организациях с численностью работников до 100 человек включительно может проводить главный инженер"]}, {"n": 31, "q": "Работник переведен из одного структурного подразделения организации в другое. Требуется ли проводить с ним первичный инструктаж на новом рабочем месте?", "ref": "Л1 п.22", "a": ["Да, требуется"], "w": ["Нет, достаточно внепланового инструктажа", "Требуется только при изменении профессии работника", "Нет, если оборудование подразделений однотипное"]}, {"n": 32, "q": "Допускается ли проводить первичный инструктаж на рабочем месте по охране труда одновременно с группой лиц?", "ref": "Л1 п.23", "a": ["Допускается, если данная группа лиц обслуживает однотипное оборудование в пределах общего рабочего места"], "w": ["Не допускается ни при каких условиях", "Допускается для группы не более 10 человек независимо от выполняемой работы", "Допускается при любых видах работ и оборудования, если группа прошла вводный инструктаж"]}, {"n": 33, "q": "С какой периодичностью (в общих случаях) необходимо проводить с работающими повторный инструктаж по охране труда?", "ref": "Л1 п.25", "a": ["Не реже 1 раза в 6 месяцев"], "w": ["Не реже 1 раза в 3 месяца", "Не реже 1 раза в 12 месяцев", "Не реже 1 раза в 3 года"]}, {"n": 34, "q": "Какой вид инструктажа по охране труда проводится при принятии новых нормативных правовых актов, в том числе технических нормативных правовых актов, локальных правовых актов или внесении изменений к ним?", "ref": "Л1 п.27", "a": ["Внеплановый"], "w": ["Повторный", "Целевой", "Первичный на рабочем месте"]}, {"n": 35, "q": "Какой вид инструктажа по охране труда проводится при изменении технологического процесса, замене или модернизации оборудования, приборов и инструмента, сырья, материалов и других факторов, влияющих на безопасность труда?", "ref": "Л1 п.27", "a": ["Внеплановый"], "w": ["Повторный", "Целевой", "Вводный"]}, {"n": 36, "q": "Какой вид инструктажа проводится при выполнении разовых работ, не связанных с прямыми обязанностями по профессии рабочего либо должности служащего?", "ref": "Л1 п.29", "a": ["Целевой"], "w": ["Внеплановый", "Первичный на рабочем месте", "Повторный"]}, {"n": 37, "q": "Какой вид инструктажа проводится при производстве работ, на которые оформляется наряд-допуск?", "ref": "Л1 п.29", "a": ["Целевой"], "w": ["Внеплановый", "Первичный на рабочем месте", "Повторный"]}, {"n": 38, "q": "Какие виды инструктажа проводит непосредственный руководитель работ (начальник производства, цеха, участка, мастер, прораб,инструктор и другие уполномоченные должностные лица)?", "ref": "Л1 п.30", "a": ["Целевой", "Первичный на рабочем месте, повторный", "Внеплановый"], "w": ["Вводный", "Инструктаж для командированных работников перед допуском на территорию организации", "Инструктаж при получении удостоверения по охране труда"]}, {"n": 39, "q": "Какие требования предъявляются к журналам регистрации инструктажа по охране труда, оформленных на бумажном носителе?", "ref": "Л1 п.34", "a": ["Журналы должны быть пронумерованы, прошнурованы и заверены подписью руководителя организации либо уполномоченного должностного лица нанимателя. При этом указывается количество страниц в журнале (цифрами и прописью)"], "w": ["Журналы должны иметь отметку органа Департамента государственной инспекции труда на титульном листе. При этом указывается срок хранения журнала и фамилия лица, ответственного за его ведение", "Журналы должны быть заверены только подписью специалиста по охране труда и прошнурованы по окончании ведения. При этом количество страниц в журнале не указывается", "Журналы должны быть пронумерованы и заверены печатью профсоюзного комитета организации. При этом указывается только дата начала ведения журнала (цифрами)"]}, {"n": 40, "q": "Работающие по профессии рабочих, принятые или переведенные на работы с повышенной опасностью, опасные производственные объекты и (или) потенциально опасные объекты либо имеющие перерыв в выполнении указанных работ более одного года, к самостоятельной работе допускаются только после:", "ref": "Л1 п.36", "a": ["Прохождения стажировки по вопросам охраны труда и последующей первичной проверки знаний по вопросам охраны труда"], "w": ["Прохождения только первичного инструктажа на рабочем месте без стажировки и проверки знаний, с записью в журнале регистрации инструктажа", "Прохождения первичной проверки знаний по вопросам охраны труда и последующей стажировки под руководством непосредственного руководителя", "Прохождения медицинского осмотра и вводного инструктажа без стажировки при наличии стажа работы более одного года"]}, {"n": 41, "q": "Кто может быть назначен руководителем стажировки рабочих?", "ref": "Л1 п.37", "a": ["Лица, уполномоченные работодателем, из числа руководителей соответствующих подразделений (специалистов) либо другие высококвалифицированные работники, имеющие стаж практической работы по данной профессии или виду работ не менее трех лет"], "w": ["Только специалист по охране труда организации либо работник, имеющий высшее техническое образование и стаж работы в организации по любой профессии или виду работ не менее пяти лет", "Лица, уполномоченные работодателем, из числа руководителей соответствующих подразделений либо другие работники, имеющие стаж практической работы по данной профессии или виду работ не менее одного года", "Любой работник бригады, в которой работает стажёр, по решению бригадира, имеющий стаж практической работы в организации не менее шести месяцев, независимо от квалификации по данной профессии"]}, {"n": 42, "q": "Сколько рабочих может быть закреплено за руководителем стажировки?", "ref": "Л1 п.37", "a": ["Не более двух рабочих"], "w": ["Не более трёх рабочих", "Не более одного рабочего", "Не более пяти рабочих"]}, {"n": 43, "q": "Сколько минимально рабочих дней (смен) (в общих случаях) отводится на стажировку работников?", "ref": "Л1 п.39", "a": ["Не менее двух рабочих дней (смен)"], "w": ["Не менее трёх рабочих дней (смен)", "Не менее одного рабочего дня (смены)", "Не менее пяти рабочих дней (смен)"]}, {"n": 44, "q": "В какой срок должен пройти первичную проверку знаний по охране труда назначенный на должность руководитель или специалист?", "ref": "Л1 п.42", "a": ["Не позднее 1 месяца со дня назначения на должность"], "w": ["Не позднее 15 календарных дней со дня назначения на должность", "Не позднее 3 месяцев со дня назначения на должность", "Не позднее 6 месяцев со дня назначения на должность"]}, {"n": 45, "q": "Руководители и специалисты проходят периодическую проверку знаний по вопросам охраны труда в соответствующих комиссиях для проверки знаний по вопросам охраны труда не реже одного раза в …", "ref": "Л1 п.42", "a": ["... три года"], "w": ["... год", "... два года", "... пять лет"]}, {"n": 46, "q": "Не позднее какого срока работники должны быть уведомлены о дате, времени и месте проведения периодической проверки знаний по вопросам охраны?", "ref": "Л1 п.47", "a": ["15 календарных дней"], "w": ["5 календарных дней", "10 календарных дней", "30 календарных дней"]}, {"n": 47, "q": "Кому в организации в обязательном порядке должны выдаваться удостоверения по охране труда?", "ref": "Л1 п.49", "a": ["Работающим, прошедшим первичную проверку знаний по вопросам охраны труда"], "w": ["Всем работающим организации независимо от прохождения проверки знаний по вопросам охраны труда", "Только работающим на работах с повышенной опасностью, прошедшим инструктаж", "Только руководителям и специалистам, прошедшим периодическую проверку знаний"]}, {"n": 48, "q": "Как осуществляется допуск работающих к самостоятельной работе после прохождения первичной проверки знаний по вопросам охраны труда?", "ref": "Л1 п.50", "a": ["Руководителем организации (структурного подразделения) и оформляется приказом (распоряжением)"], "w": ["Непосредственным руководителем работ и оформляется записью в журнале регистрации инструктажа", "Специалистом по охране труда и оформляется записью в удостоверении по охране труда", "Председателем комиссии для проверки знаний и оформляется только протоколом"]}, {"n": 49, "q": "В какие сроки проходят периодическую проверку знаний по вопросам охраны труда рабочие, занятые на работах с повышенной опасностью, а также на опасных производственных объектах и (или) потенциально опасных объектах?", "ref": "Л1 п.51", "a": ["Не реже одного раза в 12 месяцев"], "w": ["Не реже одного раза в 6 месяцев", "Не реже одного раза в 3 года", "Не реже одного раза в 24 месяца"]}, {"n": 50, "q": "Кто в организации утверждает Перечень профессий рабочих, которые должны проходить проверку знаний по вопросам охраны труда?", "ref": "Л1 п.52, Л70 Ст. 25", "a": ["Руководитель организации"], "w": ["Специалист по охране труда организации", "Председатель профсоюзного комитета", "Главный инженер организации"]}, {"n": 51, "q": "Какие требования предъявляются к срокам проведения периодической проверки знаний работающих по вопросам охраны труда?", "ref": "Л1 п.53", "a": ["Периодическая проверка знаний проводится до истечения действия результатов первичной либо предыдущей периодической проверки знаний по вопросам охраны труда"], "w": ["Периодическая проверка знаний проводится в течение трёх месяцев после истечения действия результатов первичной либо предыдущей периодической проверки знаний по вопросам охраны труда", "Периодическая проверка знаний проводится в любое время по решению председателя комиссии, независимо от срока действия результатов предыдущей проверки знаний по вопросам охраны труда", "Периодическая проверка знаний проводится не позднее одного месяца после истечения действия результатов первичной либо предыдущей периодической проверки знаний по вопросам охраны труда"]}, {"n": 52, "q": "В какой срок работающие, не прошедшие первичную или периодическую проверку знаний по вопросам охраны труда в соответствующих комиссиях (показавшие неудовлетворительные знания, не явившиеся на проверку знаний без уважительной причины), должны пройти названные виды проверки знаний по вопросам охраны труда повторно?", "ref": "Л1 п.54", "a": ["Не позднее одного месяца"], "w": ["Не позднее двух недель", "Не позднее трёх месяцев", "Не позднее шести месяцев"]}, {"n": 53, "q": "Допускается ли работающий к выполнению работ (оказанию услуг), если он не прошел проверку знаний по охране труда повторно?", "ref": "Л1 п.54", "a": ["Не допускается"], "w": ["Допускается под контролем непосредственного руководителя", "Допускается на срок до одного месяца", "Допускается к работам без повышенной опасности"]}, {"n": 54, "q": "Работник не прошел в установленный срок проверку знаний по вопросам охраны труда по уважительной причине (болезнь, отпуск и др.). В течение какого максимального срока со дня выхода на работу он должен пройти проверку знаний?", "ref": "Л1 п.55", "a": ["1 месяца"], "w": ["2 недель", "3 месяцев", "6 месяцев"]}, {"n": 55, "q": "При принятии нормативных правовых актов, технических нормативных правовых актов, локальных правовых актов, содержащих требования по охране труда, соблюдение которых входит в должностные обязанности руководителей и специалистов и влечет изменение подходов к реализации этих обязанностей проводится внеочередная проверка знаний по вопросам охраны труда. В течение какого времени проводится проверка знаний данных актов законодательства?", "ref": "Л1 п.57", "a": ["В течение месяца со дня вступления в силу актов законодательства"], "w": ["В течение трёх месяцев со дня вступления в силу актов законодательства", "В течение месяца со дня официального опубликования проекта актов законодательства", "В течение шести месяцев со дня вступления в силу актов законодательства"]}, {"n": 56, "q": "В каких случаях проводится внеочередная проверка знаний руководителей и специалистов по вопросам охраны труда?", "ref": "Л1 п.57", "a": ["При переводе на другое место или назначении на должность, где требуются дополнительные знания по охране труда", "При принятии НПА, ТНПА, ЛПА, содержащих требования по охране труда, соблюдение которых входит в их должностные обязанности", "При перерыве в работе в данной должности более одного года - в течение месяца после выхода на работу", "По требованию контролирующих (надзорных) органов при выявлении нарушений требований нормативных правовых актов"], "w": ["При уходе работника в ежегодный трудовой отпуск продолжительностью более 30 календарных дней", "При смене руководителя организации независимо от изменения обязанностей работника", "При истечении срока действия удостоверения по охране труда у подчинённых работников"]}, {"n": 57, "q": "Кто из указанных ниже лиц, проходит проверку знаний по вопросам охраны труда в комиссии организации?", "ref": "Л19 п.2", "a": ["Работающие организации и члены комиссий структурных подразделений организации для проверки знаний по вопросам охраны труда работников"], "w": ["Только руководитель организации и его заместители, а также председатели комиссий организаций соответствующего профиля деятельности", "Работающие любых организаций независимо от профиля деятельности и члены комиссий местных исполнительных и распорядительных органов", "Только члены комиссии организации, а все остальные работающие проходят проверку знаний в органах Департамента государственной инспекции труда"]}, {"n": 58, "q": "При каком минимальном количественном составе комиссия организации для проверки знаний по вопросам охраны труда правомочна принимать решения?", "ref": "Л19 п.12", "a": ["При участии в ее работе не менее половины состава комиссии, но не менее трех человек"], "w": ["При участии в ее работе не менее двух третей состава комиссии, но не менее пяти человек", "При участии в ее работе не менее половины состава комиссии, но не менее двух человек", "При участии в ее работе всех членов комиссии без исключения независимо от численного состава"]}, {"n": 59, "q": "Правомочна ли комиссия организации принимать решения по результатам проверки знаний по вопросам охраны труда, если в ее работе не участвуют председатель комиссии и его заместитель?", "ref": "Л19 п.12", "a": ["Не правомочна"], "w": ["Правомочна при наличии кворума", "Правомочна при участии секретаря комиссии", "Правомочна по письменному согласованию с председателем"]}, {"n": 60, "q": "В процессе голосования членов комиссии для проверки знаний по вопросам охраны труда количество проголосовавших \"За\" и \"Против\" оказалось равным. Как в данном случае принимается окончательное решение?", "ref": "Л19 п.13", "a": ["Окончательное решение принимается председателем комиссии"], "w": ["Голосование проводится повторно не позднее следующего дня", "Решение считается принятым в пользу проверяемого работника", "Окончательное решение принимается руководителем организации"]}, {"n": 61, "q": "Имеет ли право комиссия организации для проверки знаний по вопросам охраны труда проводить проверку знаний по вопросам охраны труда у работающих иных организаций?", "ref": "Л19 п.17, Л70 ст. 25", "a": ["Имеет, только у работающих организаций соответствующего профиля деятельности, в которых невозможно создание комиссии организации"], "w": ["Имеет у работающих любых организаций на договорной основе, независимо от профиля их деятельности и наличия в них комиссии", "Не имеет, такую проверку проводят только комиссии местных исполнительных и распорядительных органов", "Имеет только у работающих вышестоящей организации по письменному распоряжению её руководителя"]}, {"n": 62, "q": "На какие группы подразделяются опасные и вредные производственные факторы по природе действия?", "ref": "Л46", "a": ["Физические, химические, биологические, психофизиологические"], "w": ["Механические, электрические, термические, психологические", "Физические, химические, бактериологические, социальные", "Опасные, вредные, травмирующие, аварийные"]}, {"n": 63, "q": "На какой период осуществляется планирование мероприятий по охране труда?", "ref": "Л18 п.5", "a": ["На год"], "w": ["На квартал", "На месяц", "На 3 года"]}, {"n": 64, "q": "Решение каких задач предусматривается при планировании и разработке мероприятий по охране труда?", "ref": "Л18 п.7", "a": ["Устранение (снижение) профессиональных рисков, улучшение условий и охраны труда, профилактика производственного травматизма и профессиональной заболеваемости", "Обеспечение в соответствии с установленными нормами санитарно-бытовыми помещениями, оснащенными необходимыми средствами и устройствами", "Обучение по вопросам охраны труда, информационное обеспечение деятельности по охране труда"], "w": ["Определение размера заработной платы работников службы охраны труда и порядка премирования работников за отсутствие несчастных случаев", "Снижение налоговых отчислений организации и обеспечение работников льготными путёвками в организации здравоохранения независимо от условий труда", "Сокращение численности работников службы охраны труда и передача их функций руководителям структурных подразделений"]}, {"n": 65, "q": "Кем осуществляется контроль за соблюдением требований по охране труда в организации и структурных подразделениях?", "ref": "Л5 п.5", "a": ["Руководителем организации или уполномоченным в соответствии с СУОТ его заместителем", "Должностными лицами, ответственными за организацию охраны труда и осуществление контроля за соблюдением требований по охране труда, а также при выполнении отдельных видов работ, назначенными из числа работников, в непосредственном подчинении которых находятся другие работники, руководителей структурных подразделений", "Работниками службы охраны труда (специалистом по охране труда ли уполномоченным должностным лицом нанимателя, на которого возложены обязанности специалиста по охране труда)"], "w": ["Исключительно представителями страховщика и органов здравоохранения при проведении ими ежемесячных проверок", "Работниками отдела кадров и бухгалтерии в рамках проведения ими проверок соблюдения правил внутреннего трудового распорядка", "Представителями организаций - изготовителей оборудования при проведении ими гарантийного обслуживания оборудования"]}, {"n": 66, "q": "Кем проводится на рабочих местах работников ежедневный контроль за соблюдением требований по охране труда?", "ref": "Л5 п.8", "a": ["Непосредственным руководителем работника"], "w": ["Специалистом по охране труда", "Руководителем организации", "Председателем профсоюзного комитета"]}, {"n": 67, "q": "Что, из указанного ниже, устанавливается при осуществлении ежедневного контроля за соблюдением требований по охране труда?", "ref": "Л5 п.9", "a": ["Соответствие содержания территории, проходов, проездов, прилегающих к рабочему месту, состоянию, обеспечивающему беспрепятственное и безопасное движение транспортных средств и работников"], "w": ["Соответствие размеров заработной платы работников установленным тарифным ставкам (тарифным окладам) и своевременность начисления им надбавок за работу в опасных зонах территории", "Соответствие стоимости выполненных работ утверждённой смете, состояние расчётов с заказчиками и поставщиками, а также своевременность выплаты работникам вознаграждения", "Соответствие результатов аттестации рабочих мест по условиям труда требованиям законодательства, а также сроков её проведения срокам действия предыдущей аттестации"]}, {"n": 68, "q": "Что, из перечисленного ниже, устанавливается при осуществлении ежедневного контроля за соблюдением требований по охране труда?", "ref": "Л5 п.9", "a": ["Соответствие оснащения и организации рабочих мест, оборудования, инструмента, приспособлений, транспортных средств требованиям по охране труда", "Наличие (исправность) освещения, отопления, вентиляции", "Применение работниками безопасных способов хранения и транспортирования материалов, готовой продукции", "Наличие, использование и правильное применение работниками СИЗ и средств коллективной защиты, их исправное состояние"], "w": ["Соответствие численности работников штатному расписанию организации", "Своевременность выплаты заработной платы и начисления надбавок работникам", "Соответствие фактически выполненного объёма работ установленному на смену плану"]}, {"n": 69, "q": "Имеют ли право работники службы охраны труда (специалист по охране труда) требовать письменные объяснения от должностных лиц и других работников, допустивших нарушения требований по охране труда?", "ref": "Л5 п.14, Л70 Ст.21", "a": ["Имеют"], "w": ["Не имеют", "Имеют только с разрешения руководителя организации", "Имеют только от работников, но не от должностных лиц"]}, {"n": 70, "q": "Являются ли обязательными для исполнения предписания, выдаваемые работниками службы охраны труда (специалистом по охране труда) об устранении нарушений требований по охране труда?", "ref": "Л5 п.14, Л70 Ст.21", "a": ["Являются"], "w": ["Являются только при наличии подписи руководителя организации", "Не являются, носят рекомендательный характер", "Являются только для рабочих, но не для должностных лиц"]}, {"n": 71, "q": "Кто имеет право полностью или частично отменить предписание об устранении нарушений требований по охране труда, выданное работником службы охраны труда (специалистом по охране труда)?", "ref": "Л5 п.16, Л70 Ст.21", "a": ["Руководитель организации (уполномоченный в соответствии с системой управления охраной труда заместитель руководителя)", "Руководитель службы охраны труда"], "w": ["Непосредственный руководитель работника, допустившего нарушение требований", "Председатель профсоюзного комитета организации", "Председатель комиссии для проверки знаний по вопросам охраны труда"]}, {"n": 72, "q": "Как оформляются результаты ежедневного и ежемесячного контроля за соблюдением требований по охране труда?", "ref": "Л5 п.18", "a": ["Записью в журналы контроля за соблюдением требований по охране труда"], "w": ["Приказом руководителя организации с указанием выявленных нарушений и виновных лиц", "Актом произвольной формы, составляемым по окончании каждой проверки", "Записью в журналы регистрации инструктажа по охране труда"]}, {"n": 73, "q": "С какой периодичностью в организации должны рассматриваться результаты осуществления контроля за соблюдением требований по охране труда с участием руководителя организации или его заместителя, руководителей структурных подразделений, непосредственных руководителей, работников службы охраны труда (специалиста по охране труда или уполномоченного должностного лица, на которого возложены обязанности специалиста по охране труда), членов комиссии по охране труда (при ее создании)?", "ref": "Л5 п.20", "a": ["По мере необходимости, но не реже одного раза в шесть месяцев"], "w": ["По мере необходимости, но не реже одного раза в месяц", "По мере необходимости, но не реже одного раза в год", "По мере необходимости, но не реже одного раза в три месяца"]}, {"n": 74, "q": "Имеет ли право работник службы охраны труда принимать меры по приостановлению эксплуатации оборудования, инструментов, приспособлений, транспортных средств, используемых в организации, выполнения работ (оказания услуг)?", "ref": "Л11 п.13.4", "a": ["Имеет, при выявлении нарушений, создающих угрозу жизни или здоровью работающих и окружающих, до их устранения"], "w": ["Не имеет, это исключительное право руководителя организации, а работник службы охраны труда может только выдать предписание", "Имеет только после письменного согласования с руководителем организации, при наличии нарушений, выявленных органами госнадзора", "Имеет при выявлении любых нарушений, даже если они не создают угрозу жизни или здоровью работающих и окружающих"]}, {"n": 75, "q": "На что из перечисленного в вариантах ответа имеют право работники службы охраны труда?", "ref": "Л11 п.13", "a": ["Проводить обследование состояния условий труда, осуществлять анализ соблюдения требований по охране труда, знакомиться с документами по вопросам охраны труда в организации", "Запрашивать и получать необходимую информацию по вопросам охраны труда, организовывать и проводить информационно-разъяснительную работу с работниками по вопросам охраны труда", "Вносить предложения нанимателю по улучшению условий и охраны труда работников, предупреждению производственного травматизма и профессиональных заболеваний"], "w": ["Самостоятельно налагать на работников дисциплинарные взыскания и издавать приказы об увольнении за нарушение требований по охране труда", "Самостоятельно устанавливать работникам размер доплат за работу с вредными и (или) опасными условиями труда и утверждать результаты аттестации рабочих мест", "Самостоятельно заключать от имени нанимателя договоры на поставку средств индивидуальной защиты и оборудования"]}, {"n": 76, "q": "Для предотвращения или уменьшения воздействия вредных и (или) опасных производственных факторов, а также для защиты от загрязнения наниматель предоставляет работникам...", "ref": "Л7 п.5", "a": ["... средства индивидуальной защиты в объеме не менее установленных типовыми нормами (кроме отдельных случаев, оговоренных в НПА)"], "w": ["... средства индивидуальной защиты только за счёт работника с последующей компенсацией стоимости при условии, что они предусмотрены типовыми нормами", "... средства индивидуальной защиты, размер и перечень которых определяет работник, в объёме не более установленных типовыми нормами", "... денежную компенсацию вместо средств индивидуальной защиты в размере не менее установленного типовыми нормами"]}, {"n": 77, "q": "Имеет ли право наниматель помимо предусмотренных типовыми нормами средств индивидуальной защиты выдавать работникам не включенные в типовые нормы средства индивидуальной защиты?", "ref": "Л7 п.10", "a": ["Имеет"], "w": ["Не имеет", "Имеет только с разрешения Минтруда и соцзащиты", "Имеет только по согласованию с органами госнадзора"]}, {"n": 78, "q": "При отсутствии профессии рабочего (должности служащего) в типовых нормах наниматель самостоятельно определяет средства индивидуальной защиты (СИЗ), необходимые для обеспечения безопасных условий труда работника, а также для защиты от загрязнения, и устанавливает нормы их выдачи. Что необходимо учитывать при выборе СИЗ в этом случае?", "ref": "Л7 п.13", "a": ["Результаты оценки рисков от воздействия вредных и (или) опасных производственных факторов на рабочем месте работника", "Результаты аттестации рабочего места по условиям сения записи в трудовую книжку работника, независимо от дня, определённого сторонами для начала работы"]}, {"n": 7, "q": "Каким локальным правовым актом оформляется прием работника на работу?", "ref": "Л2 ст.25", "a": ["Приказом (распоряжением) нанимателя"], "w": ["Записью в трудовой книжке работника", "Записью в журнале учёта работников", "Протоколом собеседования с кандидатом"]}, {"n": 8, "q": "Имеет ли право наниматель при приеме на работу запрашивать характеристику работника с предыдущих мест его работы?", "ref": "Л2 ст.26", "a": ["Имеет"], "w": ["Не имеет", "Имеет только с письменного согласия работника", "Имеет только при приёме на руководящую должность"]}, {"n": 9, "q": "Нанимателю при приеме на работу предоставлено право запрашивать характеристику с предыдущих мест работы принимаемого на работу лица. Сколько дней отводится на выдачу такой характеристики со дня получения соответствующего запроса?", "ref": "Л48 п.11, Л2 ст.26", "a": ["Семь календарных дней"], "w": ["Три рабочих дня", "Десять календарных дней", "Один календарный месяц"]}, {"n": 10, "q": "Каким может быть максимальный срок предварительного испытания при приеме на работу по трудовому договору, не считая периода временной нетрудоспособности и других периодов, когда работник отсутствовал на работе?", "ref": "Л2 ст.28", "a": ["3 месяца"], "w": ["1 месяц", "2 месяца", "6 месяцев"]}, {"n": 11, "q": "Что является основанием для перевода работника по состоянию здоровья на другую имеющуюся работу?", "ref": "Л2 ст.30", "a": ["Заключение врачебно-консультационной комиссии или медико-реабилитационной экспертной комиссии и письменное согласие работника"], "w": ["Заявление работника и справка лечащего врача без заключения комиссии и письменного согласия нанимателя", "Заключение врачебно-консультационной комиссии или медико-реабилитационной экспертной комиссии без согласия работника", "Решение специалиста по охране труда и приказ нанимателя при наличии устного согласия работника"]}, {"n": 12, "q": "Что признается изменением существенных условий труда?", "ref": "Л2 ст.32", "a": ["Изменение системы оплаты труда, режима рабочего времени, включая установление или отмену неполного рабочего времени, изменение гарантий, уменьшение размеров оплаты труда, предложение о заключении контракта с работником, работающим по трудовому договору, заключенному на неопределенный срок, установление или отмена дистанционной работы, а также других условий, устанавливаемых в соответствии с Трудовым кодексом"], "w": ["Перевод работника на другую работу у того же нанимателя, поручение работы, не обусловленной трудовым договором, перемещение его на другое рабочее место в той же местности без изменения оплаты и режима труда, а также любые изменения локальных правовых актов, принятых нанимателем в соответствии с Трудовым кодексом", "Изменение наименования организации, смена собственника имущества, реорганизация структурных подразделений, изменение штатного расписания без изменения оплаты труда и режима рабочего времени, а также временная замена отсутствующего работника в соответствии с Трудовым кодексом", "Изменение графика отпусков, замена средств индивидуальной защиты, изменение перечня выдаваемой спецодежды и порядка её хранения, изменение места расположения рабочего места в пределах организации, а также других условий, устанавливаемых в соответствии с Трудовым кодексом"]}, {"n": 13, "q": "В течение какого времени наниматель обязан письменно предупредить работника об изменении существенных условий труда (кроме случаев, когда обоснованной причиной таких изменений является неблагоприятное воздействие эпидемиологической ситуации на деятельность нанимателя)?", "ref": "Л2 ст.32, Л99 п.14", "a": ["Не позднее, чем за один месяц"], "w": ["Не позднее, чем за две недели", "Не позднее, чем за семь календарных дней", "Не позднее, чем за два месяца"]}, {"n": 14, "q": "За какой период времени до расторжения трудового договора, заключенного на неограниченный срок, работник обязан письменно предупредить об этом нанимателя?", "ref": "Л2 ст.40", "a": ["За 1 месяц"], "w": ["За 2 недели", "За 3 дня", "За 2 месяца"]}, {"n": 15, "q": "В каких случаях предусмотрено расторжение срочного трудового договора по требованию работника?", "ref": "Л2 ст.41", "a": ["В случае его болезни или инвалидности, поступления на военную службу по контракту и иных уважительных причин, препятствующих выполнению работы по трудовому договору, а также в случае нарушения нанимателем законодательства о труде, коллективного договора, трудового договора"], "w": ["Только при переезде работника на новое место жительства или поступлении в учреждение образования, а также в случае изменения наименования организации и смены собственника её имущества, если при этом работник не согласен с такими изменениями", "Только в случае выплаты нанимателем заработной платы с задержкой более одного календарного месяца при условии, что работник предупредил об этом нанимателя в письменной форме не менее чем за два месяца до даты расторжения договора", "В любое время без указания причин при условии письменного предупреждения нанимателя за один месяц, если трудовой договор заключён на срок не более одного года и работник отработал не менее половины этого срока"]}, {"n": 16, "q": "Кем может устанавливаться факт нарушения нанимателем законодательства о труде, коллективного договора, трудового договора, служащий основанием для расторжения срочного трудового договора по требованию работника?", "ref": "Л2 ст.41", "a": ["Уполномоченным органом надзора за соблюдением законодательства о труде", "Профсоюзом", "Судом", "Нанимателем самостоятельно"], "w": ["Территориальной организацией здравоохранения", "Страховщиком по обязательному страхованию", "Специалистом по охране труда организации"]}, {"n": 17, "q": "В каком из указанных ниже случаев возможно расторжение трудового договора по инициативе нанимателя?", "ref": "Л2 ст.42", "a": ["В случае ликвидации организации (прекращения деятельности представительства иностранной организации, филиала иностранного юридического лица), прекращения деятельности филиала, представительства или иного обособленного подразделения организации, расположенных в другой местности, сокращения численности или штата работников", "В случае несоответствия работника занимаемой должности служащего (профессии рабочего) или выполняемой работе вследствие состояния здоровья, препятствующего продолжению данной работы", "В случае несоответствия работника занимаемой должности служащего (профессии рабочего) или выполняемой работе вследствие недостаточной квалификации, препятствующей продолжению данной работы"], "w": ["В случае отказа работника от предложенного ему повышения в должности с увеличением оплаты труда", "В случае однократного опоздания работника на работу менее чем на один час при наличии уважительных причин", "В случае подачи работником жалобы на действия нанимателя в органы государственной инспекции труда"]}, {"n": 18, "q": "В каком из указанных ниже случаев возможно расторжение трудового договора по инициативе нанимателя?", "ref": "Л2 ст.42", "a": ["В случае прогула (в том числе отсутствия на работе более трех часов в течение рабочего дня) без уважительных причин", "В случае нарушения требований по охране труда, повлекшего увечье или смерть других работников", "При появлении на работе в состоянии алкогольного, наркотического или токсического опьянения, а также распития спиртных напитков, употребления наркотических средств или токсических веществ в рабочее время или по месту работы"], "w": ["В случае отсутствия на работе менее двух часов в течение рабочего дня по уважительной причине", "При отказе работника от сверхурочной работы, не предусмотренной законодательством", "При участии работника в собрании профсоюза в нерабочее время"]}, {"n": 19, "q": "При каком условии возможно расторжение трудового договора по инициативе нанимателя за неисполнение работником трудовых обязанностей?", "ref": "Л2 ст. 42 п.6, Л48 п.6.1", "a": ["При неисполнении без уважительных причин трудовых обязанностей работником, имеющим неснятое (непогашенное) дисциплинарное взыскание"], "w": ["При первом случае неисполнения работником трудовых обязанностей без уважительных причин, независимо от наличия у него дисциплинарных взысканий", "При неисполнении трудовых обязанностей работником, у которого дисциплинарное взыскание снято досрочно, по письменному решению нанимателя", "При неисполнении работником трудовых обязанностей по уважительным причинам, подтверждённым документом организации здравоохранения"]}, {"n": 20, "q": "В каком из указанных ниже случаев однократного грубого нарушения работником трудовых обязанностей допускается расторжение трудового договора по инициативе нанимателя (по дискредитирующим обстоятельствам)?", "ref": "Л2 ст. 42 п.7, Л48 п.6.2", "a": ["Работник появился на работе в состоянии алкогольного, наркотического или токсического опьянения", "Работник распивал спиртные напитки, употреблял наркотические средства или токсических вещества в рабочее время, не по месту работы", "Работник распивал спиртные напитки, употреблял наркотические средства или психотропные вещества, на рабочем месте во внерабочее время"], "w": ["Работник опоздал на работу менее чем на один час в течение рабочего дня без уважительной причины", "Работник находился на работе в состоянии усталости и был отправлен на отдых по решению руководителя", "Работник отказался от работы при непосредственной опасности для жизни и здоровья"]}, {"n": 21, "q": "Допускается ли увольнение работника за прогул (в том числе отсутствие на работе более трех часов в течение рабочего дня) без уважительных причин?", "ref": "Л2 ст. 42 п.7, Л48 п.6.2", "a": ["Допускается"], "w": ["Не допускается, если нет иных дисциплинарных взысканий", "Допускается только при отсутствии на работе в течение всей смены", "Допускается только по решению суда"]}, {"n": 22, "q": "Допускается ли нанимателю увольнение работника за хищение по месту работы имущества нанимателя (по дискредитирующим обстоятельствам), если факт хищения не установлен вступившим в силу приговором суда или постановлением органа, в компетенцию которого входит наложение административного взыскания?", "ref": "Л2 ст. 42 п.7, Л48 п.6.2", "a": ["Не допускается"], "w": ["Допускается при наличии докладной записки непосредственного руководителя работника", "Допускается на основании акта внутренней проверки, составленного нанимателем", "Допускается при наличии объяснения работника, в котором он не отрицает факт хищения"]}, {"n": 23, "q": "Допускается ли увольнение работника (по дискредитирующим обстоятельствам) за однократное нарушение требований по охране труда?", "ref": "Л2 ст. 42 п.7, Л48 п.6.2", "a": ["Допускается, если это нарушение требований по охране труда, повлекло увечье или смерть других работников"], "w": ["Допускается за любое нарушение требований по охране труда, если об этом составлен акт специалистом по охране труда", "Не допускается, поскольку такое нарушение влечёт только применение дисциплинарного взыскания", "Допускается, если это нарушение не повлекло увечье или смерть других работников, но было повторено в течение года"]}, {"n": 24, "q": "В каких случаях наниматель может после однократного грубого нарушения работником трудовых обязанностей, признаваемого таковым в соответствии с законодательными актами, расторгнуть с работником трудовой договор по своей инициативе?", "ref": "Л2 ст.42 п.7", "a": ["В случае принуждения работников к участию в забастовке", "В случае создания другим работникам препятствий для выполнения их трудовых обязанностей", "В случае призыва работников к прекращению выполнения трудовых обязанностей без уважительных причин"], "w": ["В случае письменного обращения работника в профсоюз с жалобой на действия нанимателя", "В случае отказа работника от перевода на нижеоплачиваемую работу, не вызванного производственной необходимостью", "В случае отказа работника от участия в корпоративном мероприятии в нерабочее время"]}, {"n": 25, "q": "Может ли наниматель расторгнуть с работником трудовой договор по своей инициативе в случае участия работника в незаконной забастовке, а также при иных формах отказа работника от выполнения трудовых обязанностей (полностью или частично) без уважительных причин?", "ref": "Л2 ст.42 п.7", "a": ["Может"], "w": ["Не может", "Может только при наличии неснятого взыскания", "Может только по решению суда"]}, {"n": 26, "q": "Считается ли основанием для увольнения руководителя организации по дискредитирующим обстоятельствам сокрытие им фактов нарушения работниками трудовых обязанностей либо непривлечение без уважительных причин виновных лиц к установленной законодательством ответственности за такие нарушения?", "ref": "Л2 ст.47, Л48 п.6.2", "a": ["Да, считается"], "w": ["Нет, не считается", "Да, но только при неоднократном сокрытии таких фактов в течение года", "Да, но только при нарушениях, повлёкших смерть других работников"]}, {"n": 27, "q": "Может ли быть уволен работник, непосредственно обслуживающий материальные или денежные ценности, если его действия явились основанием для утраты доверия к нему со стороны нанимателя?", "ref": "Л2 ст. 47, п.2, Л48 п.6.4", "a": ["Может"], "w": ["Не может", "Может только при наличии приговора суда", "Может только с согласия профсоюза"]}, {"n": 28, "q": "В каких из указанных ниже случаев работник не должен быть допущен нанимателем к работе (отстранен от работы)?", "ref": "Л2 ст.49.", "a": ["Если работник появился на работе в состоянии алкогольного, наркотического или токсического опьянения, а также в состоянии, связанном с болезнью, препятствующем выполнению работы", "Если работник не прошел инструктаж, стажировку, проверку знаний по вопросам охраны труда", "Если работник не использует требуемые средства индивидуальной защиты, непосредственно обеспечивающие безопасность труда", "Если работник не прошел медицинский осмотр в случаях и порядке, предусмотренных законодательством"], "w": ["Если работник отказался от выполнения работы, не обусловленной трудовым договором", "Если работник заявил о своём несогласии с действиями нанимателя", "Если работник подал заявление о предоставлении ему отпуска"]}, {"n": 29, "q": "Что предусматривается законодательством при отстранении работника от работы, в случае, когда он не прошел инструктаж, стажировку и проверку знаний по вопросам охраны труда не по своей вине?", "ref": "Л2 ст.49", "a": ["Работнику производится оплата за все время отстранения от работы в размере не ниже двух третей установленной ему тарифной ставки (тарифного оклада), оклада"], "w": ["Работнику заработная плата за время отстранения не выплачивается, если он не прошёл инструктаж, стажировку и проверку знаний", "Работнику производится оплата за все время отстранения от работы в размере 50 % установленной ему тарифной ставки (тарифного оклада), оклада", "Работнику производится оплата за все время отстранения от работы в размере полной средней заработной платы с учётом надбавок и премий"]}, {"n": 30, "q": "Каким документом осуществляется отстранение от работы работника, появившегося на работе в состоянии алкогольного, наркотического или токсического опьянения?", "ref": "Л2 ст. 49", "a": ["Приказом (распоряжением) нанимателя либо уполномоченного им должностного лица, с указанием причины отстранения от работы"], "w": ["Актом о появлении работника в таком состоянии, составленным непосредственным руководителем, без издания приказа нанимателя", "Служебной запиской руководителя подразделения с указанием причины отстранения, адресованной нанимателю и специалисту по охране труда", "Записью в журнале регистрации вводного инструктажа с указанием причины отстранения от работы и подписью работника"]}, {"n": 31, "q": "Что обязательно указывается в приказе (распоряжении) нанимателя об отстранении работника от работы при выявлении допущенных им нарушений?", "ref": "Л2 ст. 49", "a": ["Причина отстранения от работы"], "w": ["Размер материальной ответственности работника", "Срок применения дисциплинарного взыскания", "Фамилии свидетелей допущенного нарушения"]}, {"n": 32, "q": "Работник был отстранен нанимателем от работы из-за выявленных нарушений. В какой срок приказ (распоряжение) об отстранении от работы объявляется работнику под роспись?", "ref": "Л2 ст. 49", "a": ["Не позднее следующего дня, являющегося для работника рабочим"], "w": ["В течение трёх рабочих дней со дня отстранения", "Не позднее двух недель со дня издания приказа", "В течение одного месяца со дня обнаружения нарушения"]}, {"n": 33, "q": "Что необходимо предпринять при отказе работника от ознакомления с приказом об отстранении его от работы?", "ref": "Л2 ст. 49", "a": ["Оформить акт с указанием присутствовавших при этом свидетелей"], "w": ["Отправить копию приказа работнику заказным письмом без составления дополнительных документов", "Считать работника уволенным по приказу со дня такого отказа от ознакомления", "Передать вопрос на рассмотрение комиссии по трудовым спорам"]}, {"n": 34, "q": "Работник был отстранен нанимателем от работы из-за выявленных нарушений. Что требуется для его допуска к работе после устранения нарушений?", "ref": "Л2 ст. 49", "a": ["Приказ (распоряжение) нанимателя либо уполномоченного им должностного лица о допуске к работе"], "w": ["Заявление работника об устранении нарушений и устное разрешение его непосредственного руководителя", "Письменное заключение специалиста по охране труда и запись в журнале регистрации инструктажа", "Решение комиссии по трудовым спорам, принятое на основании заявления работника о допуске"]}, {"n": 35, "q": "Наниматель имеет право отстранять работника от работы при выявлении допущенных им нарушений производственно-технологической, исполнительской или трудовой дисциплины, повлекших или способных повлечь причинение организации ущерба, а также в случае, если работник призывает других работников к прекращению выполнения трудовых обязанностей без уважительных причин. . В какой срок необходимо отстранить работника от работы?", "ref": "Л2 ст. 49, Л48 п.3.4", "a": ["Незамедлительно"], "w": ["В течение трёх рабочих дней", "Не позднее следующего рабочего дня", "В течение месяца со дня обнаружения"]}, {"n": 36, "q": "В каких случаях наниматель имеет право незамедлительно отстранить работника от работы?", "ref": "Л2 ст.49", "a": ["При выявлении допущенных им нарушений производственно-технологической, исполнительской или трудовой дисциплины, повлекших или способных повлечь причинение организации ущерба, до устранения нарушений", "В случае, если работник призывает других работников к прекращению выполнения трудовых обязанностей без уважительных причин", "Если работник совершил хищение имущества нанимателя (до вступления в законную силу приговора суда или постановления органа, в компетенцию которого входит наложение административного взыскания)"], "w": ["При наличии заявления работника о предоставлении ему отпуска без сохранения заработной платы в связи с семейными обстоятельствами", "При получении работником неудовлетворительной оценки при проведении аттестации, независимо от допущенных им нарушений трудовой дисциплины", "При обращении работника с письменной жалобой на условия труда в профсоюз или органы надзора"]}, {"n": 37, "q": "Что из указанного в вариантах ответа обязан исполнить наниматель при приеме на работу?", "ref": "Л2 ст. 54, п.2,3,4", "a": ["Ознакомить работника под роспись с порученной работой, условиями и оплатой труда и разъяснить его права и обязанности", "Ознакомить работника под роспись с коллективным договором, соглашением и документами, регламентирующими внутренний трудовой распорядок", "Провести вводный инструктаж по охране труда"], "w": ["Провести первичный инструктаж на рабочем месте в присутствии всех работников бригады и получить от них письменное согласие на приём работника", "Заключить договор страхования жизни работника и ознакомить его с размером страховых выплат нанимателя на весь срок договора", "Выдать работнику в собственность весь закреплённый за его рабочим местом инструмент под роспись"]}, {"n": 38, "q": "На кого возлагаются обязанности по обеспечению на каждом рабочем месте условий труда, соответствующих требованиям по охране труда?", "ref": "Л2 ст.55 ч.5", "a": ["На нанимателя"], "w": ["На специалиста по охране труда", "На непосредственного руководителя работника", "На профсоюз организации"]}, {"n": 39, "q": "Как наниматель обязан знакомить работника с изменениями в его трудовых обязанностях, а также объявлять приказ об изменении условий трудового договора?", "ref": "Л2 ст.55 ч.10 и ч.14", "a": ["Под роспись"], "w": ["Устно на собрании трудового коллектива", "Заказным письмом по месту жительства", "Размещением приказа на информационном стенде"]}, {"n": 40, "q": "Что такое рабочее время?", "ref": "Л2 ст.110.", "a": ["Время, течение которого работник в соответствии с Трудовым кодексом, иными актами законодательства о труде, локальными правовыми актами и условиями трудового договора обязан находиться на рабочем месте или в ином установленном по согласованию с нанимателем месте и исполнять трудовые обязанности"], "w": ["Время, в течение которого работник согласно графику работ находится на территории нанимателя, включая перерывы для отдыха и питания и время следования от места жительства к месту работы и обратно, независимо от выполнения трудовых обязанностей", "Время, в течение которого работник согласно трудовому договору выполняет работу только на постоянном рабочем месте, за исключением периодов подготовки к работе, приведения в порядок рабочего места и иного времени, не связанного с изготовлением продукции", "Время, установленное коллективным договором для нахождения работника на территории организации и не зависящее от положений Трудового кодекса, иных актов законодательства о труде и условий трудового договора о порядке исполнения трудовых обязанностей"]}, {"n": 41, "q": "Какова полная норма продолжительности рабочего времени в неделю?", "ref": "Л2 ст.112", "a": ["Не более 40 часов в неделю"], "w": ["Не более 42 часов в неделю", "Не более 36 часов в неделю", "Не более 48 часов в неделю"]}, {"n": 42, "q": "В каком из вариантов ответа правильно указаны категории работниц, которых запрещается привлекать к сверхурочным работам?", "ref": "Л2 ст.120", "a": ["Беременные женщины"], "w": ["Женщины, имеющие детей в возрасте до 14 лет", "Женщины старше 50 лет", "Женщины, работающие неполное рабочее время"]}, {"n": 43, "q": "Можно ли привлекать работников моложе 18 лет к сверхурочным работам?", "ref": "Л2 ст.120, ст. 276", "a": ["Нельзя"], "w": ["Можно с их письменного согласия", "Можно с письменного согласия родителей", "Можно не более 2 часов в день"]}, {"n": 44, "q": "Какой продолжительности должны быть перерывы в работе для отдыха и питания в течение рабочего дня (смены)?", "ref": "Л2 ст.134", "a": ["Не менее 20 минут и не более двух часов"], "w": ["Не менее 30 минут и не более одного часа", "Не менее 15 минут и не более одного часа", "Не менее 30 минут и не более двух часов"]}, {"n": 45, "q": "Какова продолжительность еженедельного непрерывного отдыха?", "ref": "Л2 ст.138", "a": ["Не менее 42 часов"], "w": ["Не менее 48 часов", "Не менее 36 часов", "Не менее 24 часов"]}, {"n": 46, "q": "Работа в выходные дни по предложению нанимателя (за исключением работ по предотвращения катастрофы, аварии, несчастных случаев и в иных исключительных случаях) проводятся только при условии ...", "ref": "Л2 ст.142", "a": ["... письменного согласия каждого из привлекаемых работников"], "w": ["... издания приказа нанимателя без получения согласия работников", "... согласования с профсоюзом без получения согласия работников", "... устного согласия большинства работников структурного подразделения"]}, {"n": 47, "q": "Какой нормативный правовой акт Республики Беларусь определяет основания для предоставления работникам права на трудовые и социальные отпуска?", "ref": "Л2 ст.149", "a": ["Трудовой кодекс Республики Беларусь"], "w": ["Декрет Президента Республики Беларусь № 5", "Закон Республики Беларусь «Об охране труда»", "Коллективный договор организации"]}, {"n": 48, "q": "На основании чего работникам,
