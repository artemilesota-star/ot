 занятым на работах с вредными и (или) опасными условиями труда, предоставляется дополнительный отпуск?", "ref": "Л2 ст.157.", "a": ["Аттестации рабочих мест по условиям труда"], "w": ["Заключения врачебно-консультационной комиссии", "Заявления работника и приказа нанимателя", "Предложения специалиста по охране труда"]}, {"n": 49, "q": "Что в первую очередь должен сделать наниматель до применения дисциплинарного взыскания на работника?", "ref": "Л2 ст.199", "a": ["Обязан затребовать письменное объяснение работника"], "w": ["Обязан получить согласие профсоюза на применение взыскания", "Обязан провести собрание трудового коллектива", "Обязан письменно предупредить работника за один месяц"]}, {"n": 50, "q": "Является ли отказ работника от дачи письменного объяснения, невозможность получения от работника объяснения по поводу совершенного дисциплинарного проступка препятствием для применения к нему дисциплинарного взыскания?", "ref": "Л2 ст.199", "a": ["Не является"], "w": ["Является", "Является, если работник находится в отпуске", "Не является только при наличии заключения профсоюза"]}, {"n": 51, "q": "В течение какого срока со дня обнаружения проступка может применяться дисциплинарное взыскание (не считая времени болезни или ухода за больным членом семьи, пребывания работника в отпуске, нахождения на военных или специальных сборах)?", "ref": "Л2 ст.200", "a": ["Не позднее 1-го месяца"], "w": ["Не позднее 2-х недель", "Не позднее 3-х месяцев", "Не позднее 6-ти месяцев"]}, {"n": 52, "q": "Как должно осуществляется заключение трудового договора с работником, выполняющим дистанционную работу?", "ref": "Л2 ст.307-2", "a": ["При личном присутствии такого работника по месту нахождения нанимателя"], "w": ["Путём обмена электронными документами без личного присутствия такого работника", "Путём направления работнику подписанного договора заказным письмом", "При личном присутствии представителя нанимателя по месту жительства такого работника"]}, {"n": 53, "q": "Что из указанного ниже должны обеспечить под свою персональную ответственность руководители организаций в соответствии с Декретом Президента Республики Беларусь от 15 декабря 2014 г. № 5 «Об усилении требований к руководящим кадрам и работникам организаций»?", "ref": "Л48 п.4.1", "a": ["Производственно-технологическую, исполнительскую и трудовую дисциплину", "Содержание производственных зданий (помещений), оборудования и приспособлений в соответствии с установленными требованиями; надлежащие условия труда работников", "Закрепление в должностных (рабочих) инструкциях работников с учетом специфики их трудовых функций обязанности по соблюдению технологических регламентов и нормативов при производстве продукции (выполнении работ, оказании услуг), требований производственного процесса, технологии изготовления продукции (работ, услуг), а также по поддержанию чистоты и порядка на территории организации и непосредственно на рабочем месте работника"], "w": ["Выплату работникам заработной платы в размере не ниже среднего уровня по соответствующей отрасли экономики и ежегодную индексацию всех выплат работникам независимо от результатов финансово-хозяйственной деятельности организации", "Согласование в вышестоящей организации каждого приказа о приёме работника и увольнении, а также заключение со всеми работниками только трудовых договоров на неопределённый срок", "Прохождение каждым работником организации ежегодного повышения квалификации за счёт средств организации независимо от его должности служащего (профессии рабочего)"]}]}, {"id": 3, "title": "Расследование несчастных случаев", "legend": {"Л3": "Правила расследования и учета несчастных случаев на производстве и профессиональных заболеваний\" (Утв. пост. Совета Министров РБ 15.01.2004 № 30, в ред. пост. Совета Министров РБ от 21.11.2025 № 660)", "Л23": "Кодекс Республики Беларусь об административных правонарушениях от 06.01.2021 № 91-З (в ред. Закона РБ от 20.10.2025 № 101-З)", "Л4": "Положение об обязательном страховании (утв. Указом Президента Республики Беларусь от 18.03.2025 № 108 в ред. Указа Президента Республики Беларусь от 10.09.2025 № 329)"}, "qs": [{"n": 1, "q": "Потерпевший нарушил (не соблюдал) обязательные для соблюдения требования нормативных правовых актов. Он предвидел возможность наступления вредных для себя последствий, но легкомысленно надеялся, что они не наступят. В каком из указанных ниже случаев такое нарушение (несоблюдение) требований нормативных правовых актов не признается грубой неосторожностью потерпевшего в соответствии с \"Правилами расследования и учета несчастных случаев на производстве и профессиональных заболеваний\"?", "ref": "Л3 п. 2", "a": ["Несчастный случай произошел с потерпевшим в период стажировки по вопросам охраны труда", "Несчастный случай произошел с потерпевшим до прохождения им первичной проверки знаний по вопросам охраны труда, когда проведение такой проверки требуется в соответствии с законодательством", "У потерпевшего не оформлен в установленном порядке допуск к самостоятельной работе"], "w": ["Несчастный случай произошёл с потерпевшим, прошедшим все виды инструктажа и допущенным к самостоятельной работе, при отключении им блокировки", "Несчастный случай произошёл с потерпевшим в период самостоятельной работы по занимаемой должности после проверки знаний", "Несчастный случай произошёл с потерпевшим после завершения стажировки и оформления допуска к самостоятельной работе"]}, {"n": 2, "q": "В соответствии с \"Правилами расследования и учета несчастных случаев на производстве и профессиональных заболеваний\" грубая неосторожность - это ...", "ref": "Л3 п. 2", "a": ["... неосторожность, при которой с учетом конкретной обстановки застрахованный мог предвидеть наступление вредных для себя последствий, но легкомысленно надеялся, что они не наступят"], "w": ["... неосторожность, при которой застрахованный не предвидел наступления вредных для себя последствий, хотя в сложившейся обстановке и при должной внимательности должен был их предвидеть", "... умышленное нарушение застрахованным требований по охране труда, при котором он сознательно желал наступления вредных для себя последствий и не предпринимал мер к их предотвращению", "... неосторожность, при которой застрахованный нарушил требования по охране труда не менее двух раз в течение года, что подтверждено приказами о дисциплинарном взыскании"]}, {"n": 3, "q": "В соответствии с \"Правилами расследования и учета несчастных случаев на производстве и профессиональных заболеваний\" состояние алкогольного опьянения - это наличие абсолютного этилового спирта в выдыхаемом воздухе в концентрации:", "ref": "Л3 п. 2", "a": ["0,3 и более промилле"], "w": ["0,5 и более промилле", "0,2 и более промилле", "0,8 и более промилле"]}, {"n": 4, "q": "Какие из указанных ниже несчастных случаев, произошедших с работающими в течение рабочего времени, подлежат расследованию, и учету в соответствии с \"Правилами расследования и учета несчастных случаев на производстве и профессиональных заболеваний\"?", "ref": "Л3 п. 4.1, 4.4, 4.7", "a": ["Несчастные случаи, произошедшие на территории страхователя или в ином месте работы, в том числе в служебной командировке, а также в любом другом месте, где потерпевший находился в связи с выполнением работы, в том числе в периоды, не относящиеся к рабочему времени", "Несчастные случаи, произошедшие при передвижении в рабочее время для исполнения своих трудовых обязанностей между объектами обслуживания либо выполнения задания страхователя (его уполномоченного должностного лица) на личном или ином транспорте либо пешком", "Несчастные случаи, произошедшие при проведении аварийно-спасательных и других неотложных работ при ликвидации чрезвычайных ситуаций природного и техногенного характера и их последствий"], "w": ["Несчастные случаи, произошедшие с работающим в период ежегодного трудового отпуска при выполнении личных дел за пределами территории страхователя", "Несчастные случаи, произошедшие при самовольном использовании работающим в личных целях транспорта страхователя вне служебного задания", "Несчастные случаи, произошедшие во время следования работающего из дома на работу на личном транспорте при отсутствии задания страхователя"]}, {"n": 5, "q": "Подлежат расследованию и учету в соответствии с \"Правилами расследования и учета несчастных случаев на производстве и профессиональных заболеваний\" несчастные случаи, произошедшие с работающими в периоды времени до начала и после окончания работы (выполнения работ) при:", "ref": "Л3 п. 4.2", "a": ["Следовании по территории страхователя к рабочему месту и обратно", "Приведении в порядок оборудования, инструментов, приспособлений и СИЗ", "Выполнении других предусмотренных правилами внутреннего трудового распорядка и иными локальными правовыми актами страхователя действий перед началом и после окончания работы (выполнения работ)"], "w": ["Следовании от места жительства к месту работы на общественном транспорте", "Посещении магазина после окончания работы по личным делам", "Участии в любительских спортивных соревнованиях, не организованных страхователем"]}, {"n": 6, "q": "В каком из указанных ниже случаев подлежат расследованию в соответствии с \"Правилами расследования и учета несчастных случаев на производстве и профессиональных заболеваний\" несчастные случаи, произошедшие с работающими при передвижении в рабочее время для исполнения своих трудовых обязанностей между объектами обслуживания либо выполнения задания страхователя (его уполномоченного должностного лица)?", "ref": "Л3 п. 4.4", "a": ["Работающий передвигался на личном транспорте", "Работающий передвигался на общественном транспорте", "Работающий передвигался пешком"], "w": ["Только если работающий передвигался на служебном транспорте страхователя", "Только если передвижение было согласовано письменным приказом страхователя", "Только если работающий передвигался в сопровождении уполномоченного должностного лица"]}, {"n": 7, "q": "Что необходимо предпринять при несчастном случае на производстве?", "ref": "Л3 п. 10", "a": ["При необходимости немедленно организовать оказание первой помощи потерпевшему (потерпевшим), вызвать медработников на место происшествия или доставить потерпевшего (потерпевших) в организацию здравоохранения", "Немедленно сообщить о несчастном случае руководителю страхователя, организации, на территории которой произошел несчастный случай (лицу, исполняющему его обязанности), о произошедшем несчастном случае", "Обеспечить до начала расследования несчастного случая сохранение обстановки на месте его происшествия, а если это невозможно - фиксировать обстановку путем составления схемы, фотографирования или иным способом", "Принять неотложные меры по предотвращению развития аварийной ситуации и воздействия травмирующих факторов на других лиц"], "w": ["Убрать с места происшествия повреждённое оборудование и восстановить работу участка до прибытия лиц, проводящих расследование", "Опросить очевидцев и подготовить акт формы Н-1 до прибытия специалиста по охране труда и оказания помощи потерпевшему", "Сообщить о несчастном случае только по окончании смены, чтобы не прерывать производственный процесс"]}, {"n": 8, "q": "В течение какого периода времени после происшествия несчастного случая страхователю, организации, на территории которой произошел несчастный случай, необходимо направить сообщение о несчастном случае на производстве страхователю потерпевшего, одному из совершеннолетних членов его семьи, профсоюзу; направить в организацию здравоохранения запрос о тяжести производственной травмы потерпевшего, а также о нахождении потерпевшего в состоянии алкогольного опьянения либо в состоянии, вызванном потреблением наркотических средств, психотропных веществ, их аналогов, токсических и других одурманивающих веществ?", "ref": "Л3 п. 12", "a": ["Не позднее рабочего дня, следующего за днем происшествия несчастного случая"], "w": ["Не позднее трёх рабочих дней со дня происшествия несчастного случая", "Не позднее пяти рабочих дней со дня происшествия несчастного случая", "Не позднее двух часов с момента, когда стало известно о несчастном случае"]}, {"n": 9, "q": "Что из указанного ниже относится к обязанностям страхователя, организации при расследовании производственного несчастного случая?", "ref": "Л3 п. 11, п. 14", "a": ["Создавать лицам, проводящим расследование несчастного случая, профессионального заболевания или участвующим в его проведении, необходимые условия для работы", "Предоставлять помещение, средства связи, транспортные средства, средства индивидуальной защиты", "Направлять сообщение о несчастном случае страховщику не позднее рабочего дня, следующего за днем получения заключения о тяжести производственной травмы потерпевшего, с копией этого заключения"], "w": ["Выплачивать лицам, проводящим расследование, вознаграждение за участие в его проведении", "Направлять акт формы Н-1 на согласование в районный отдел Следственного комитета до его утверждения", "Оплачивать лицам, проводящим расследование, проживание и питание вне места работы за счёт средств потерпевшего"]}, {"n": 10, "q": "В каких случаях определяется и указывается в акте о несчастном случае на производстве степень вины потерпевшего в процентах?", "ref": "Л3 п. 17", "a": ["Если в действиях потерпевшего усматривается грубая неосторожность, которая содействовала возникновению или увеличению вреда, причиненного его здоровью"], "w": ["Во всех случаях нарушения потерпевшим требований по охране труда, независимо от формы неосторожности и её связи с возникновением вреда", "Только если нарушение потерпевшим требований подтверждено приказом о дисциплинарном взыскании в течение года до несчастного случая", "Только при групповых несчастных случаях и несчастных случаях, приведших к тяжёлым производственным травмам"]}, {"n": 11, "q": "В акте о несчастном случае на производстве указывается степень вины потерпевшего, заболевшего в процентах, если в его действиях усматривается неосторожность, которая содействовала возникновению или увеличению вреда, причиненного его здоровью, за исключением случаев:", "ref": "Л3 п. 17", "a": ["Когда установлено, что неосторожность потерпевшего, заболевшего не является грубой неосторожностью", "Когда наступила смерть потерпевшего, заболевшего"], "w": ["Когда потерпевшему установлена утрата профессиональной трудоспособности менее 25 %", "Когда несчастный случай произошёл во время служебной командировки потерпевшего", "Когда несчастный случай произошёл с работающим, имеющим стаж работы менее одного года"]}, {"n": 12, "q": "Какой минимальный размер (в процентах) степени вины потерпевшего, заболевшего устанавливается в случае, если одной из причин несчастного случая или профессионального заболевания явилось нахождение потерпевшего, заболевшего в состоянии алкогольного опьянения либо в состоянии, вызванном потреблением наркотических средств, психотропных веществ, их аналогов, токсических или других одурманивающих веществ, подтвержденном документом, выданным организацией здравоохранения?", "ref": "Л3 п. 17", "a": ["50 %"], "w": ["25 %", "30 %", "100 %"]}, {"n": 13, "q": "Степень вины потерпевшего (заболевшего) в процентах указывается в акте о несчастном случае на производстве или в акте о профессиональном заболевании на основании ...", "ref": "Л3 п. 17", "a": ["... протокола об определении степени вины потерпевшего от несчастного случая на производстве, профессионального заболевания"], "w": ["... приказа руководителя страхователя о привлечении потерпевшего к дисциплинарной ответственности за нарушение требований охраны труда", "... заключения государственного инспектора труда о степени вины потерпевшего от несчастного случая на производстве, профессионального заболевания", "... медицинского заключения организации здравоохранения о тяжести производственной травмы или профессионального заболевания"]}, {"n": 14, "q": "Кем проводится расследование несчастных случаев на производстве (кроме группового, со смертельным исходом или приведшего к тяжелым производственным травмам несчастного случая, а также несчастных случаев, произошедших с работниками страхователей - физических лиц)?", "ref": "Л3 п. 20", "a": ["Уполномоченным должностным лицом страхователя, организации с участием уполномоченных представителей профсоюза, специалиста по охране труда, а также других лиц"], "w": ["Государственным инспектором труда Департамента с участием уполномоченного должностного лица страхователя, специалиста по охране труда, а также представителей страховщика", "Непосредственным руководителем потерпевшего с участием специалиста по охране труда и очевидцев несчастного случая, а также других лиц", "Комиссией из представителей страховщика и Следственного комитета с участием уполномоченного представителя профсоюза, а также других лиц"]}, {"n": 15, "q": "Допускается ли участие в расследовании несчастного случая руководителя, на которого непосредственно возложены организация работы по охране труда и обеспечение безопасности труда потерпевшего (за исключением руководителя страхователя, организации и страхователя - физического лица)?", "ref": "Л3 п. 21", "a": ["Не допускается"], "w": ["Допускается в качестве председателя комиссии", "Допускается по решению руководителя организации", "Допускается с согласия потерпевшего"]}, {"n": 16, "q": "В какие сроки должно быть проведено расследование несчастного случая (кроме группового несчастного случая, несчастного случая со смертельным исходом, несчастного случая, приведшего к тяжелым производственным травмам)?", "ref": "Л3 п. 23", "a": ["Не позднее пяти рабочих дней"], "w": ["Не позднее трёх рабочих дней", "Не позднее десяти рабочих дней", "Не позднее одного месяца"]}, {"n": 17, "q": "На какой срок уполномоченное должностное лицо страхователя, организации, проводящее расследование несчастного случая, может однократно продлить расследование несчастного случая при невозможности проведения в установленный срок опроса потерпевшего, очевидцев (свидетелей), должностных и иных лиц?", "ref": "Л3 п. 23", "a": ["До пяти рабочих дней"], "w": ["До десяти рабочих дней", "До трёх рабочих дней", "До пятнадцати рабочих дней"]}, {"n": 18, "q": "Какое количество экземпляров акта о несчастном случае на производстве формы Н-1 оформляется после завершения расследования несчастного случая в общем случае?", "ref": "Л3 п. 25", "a": ["4 экземпляра"], "w": ["3 экземпляра", "2 экземпляра", "5 экземпляров"]}, {"n": 19, "q": "Какое количество экземпляров акта о несчастном случае на производстве формы НП оформляется после завершения расследования несчастного случая?", "ref": "Л3 п. 26", "a": ["4 экземпляра"], "w": ["2 экземпляра", "3 экземпляра", "5 экземпляров"]}, {"n": 20, "q": "При каком условии оформляется актом о непроизводственном несчастном случае формы НП несчастный случай, при котором повреждение здоровья или смерть потерпевшего произошли при совершении им противоправных деяний?", "ref": "Л3 п. 26.1", "a": ["Если эти противоправные деяния совершены потерпевшим умышленно, что установлено органом уголовного преследования, органом, уполномоченным на ведение административного процесса"], "w": ["Если эти противоправные деяния, по мнению лиц, проводящих расследование, совершены потерпевшим, что подтверждено объяснениями очевидцев несчастного случая", "Если эти противоправные деяния совершены потерпевшим по неосторожности, что установлено уполномоченным должностным лицом страхователя при расследовании", "Если противоправные деяния потерпевшего подтверждены приказом страхователя о дисциплинарном взыскании, независимо от наличия решения уполномоченного органа"]}, {"n": 21, "q": "В каком из указанных ниже случаев несчастный случай оформляется актом о непроизводственном несчастном случае формы НП?", "ref": "Л3 п. 26.1 - 26.3", "a": ["Если повреждение здоровья, смерть потерпевшего произошли вследствие установленного органом уголовного преследования, органом, уполномоченным на ведение административного процесса, противоправного деяния потерпевшего, совершенного умышленно", "Если повреждение здоровья, смерть потерпевшего произошли вследствие умышленного причинения вреда своему здоровью", "Когда единственной причиной повреждения здоровья, смерти потерпевшего явилось его нахождение в состоянии алкогольного опьянения либо состоянии, вызванном потреблением наркотических средств, психотропных веществ, их аналогов, токсических или других одурманивающих веществ, которое подтверждено документом, выданным организацией здравоохранения"], "w": ["Если потерпевший получил травму вследствие грубой неосторожности, что установлено протоколом об определении степени вины потерпевшего", "Если потерпевший получил травму при передвижении пешком в рабочее время между объектами обслуживания по заданию страхователя", "Если потерпевший получил травму на территории страхователя при выполнении работы без средств индивидуальной защиты"]}, {"n": 22, "q": "При каком условии оформляется актом о непроизводственном несчастном случае формы НП несчастный случай, при котором повреждение здоровья или смерть потерпевшего произошли при обстоятельствах, когда единственной причиной повреждения здоровья, смерти потерпевшего явилось его нахождение в состоянии алкогольного опьянения либо состоянии, вызванном потреблением наркотических средств, психотропных веществ, их аналогов, токсических или других одурманивающих веществ?", "ref": "Л3 п. 26.3", "a": ["Если такое состояние потерпевшего подтверждено документом, выданным организацией здравоохранения"], "w": ["Если такое состояние потерпевшего подтверждено объяснениями очевидцев и актом, составленным уполномоченным должностным лицом страхователя", "Если такое состояние потерпевшего установлено специалистом по охране труда при помощи прибора контроля на месте происшествия", "Если потерпевший ранее уже привлекался к дисциплинарной ответственности за появление на работе в таком состоянии"]}, {"n": 23, "q": "Несчастный случай оформляется актом о непроизводственном несчастном случае формы НП, когда повреждение здоровья потерпевшего произошли во время перерыва для отдыха и питания, дополнительных специальных перерывов, если ...", "ref": "Л3 п. 26.6", "a": ["... повреждение здоровья потерпевшего не обусловлено воздействием на него вредного или опасного производственного фактора"], "w": ["... потерпевший находился на территории страхователя и передвигался к месту приёма пищи", "... работающий не успел закончить перерыв и вернулся к работе позже установленного времени", "... перерыв использовался работающим для отдыха в месте, специально отведённом для этих целей страхователем"]}, {"n": 24, "q": "Каким документом оформляются результаты расследования, если в ходе проведения расследования несчастного случая установлено, что этот несчастный случай не подпадает под действие \"Правил расследования и учета несчастных случаев на производстве и профессиональных заболеваний\"?", "ref": "Л3 п. 28", "a": ["Актом служебного расследования произвольной формы"], "w": ["Актом о непроизводственном несчастном случае формы НП", "Актом о несчастном случае на производстве формы Н-1", "Заключением специалиста по охране труда установленной формы"]}, {"n": 25, "q": "В каком документе регистрируют акт формы Н-1 (акт формы Н-1М)?", "ref": "Л3 п. 30.2", "a": ["В журнале регистрации несчастных случаев"], "w": ["В журнале учёта микротравм и выдачи актов", "В журнале регистрации вводного инструктажа", "В журнале учёта работ по охране труда"]}, {"n": 26, "q": "Не позднее какого срока, следующего за днем утверждения акта формы Н-1 (акта формы Н-1Е, акта формы Н-1М), необходимо ознакомить с ним лиц, допустивших нарушения требований законодательства, локальных правовых актов, приведшие к несчастному случаю?", "ref": "Л3 п. 30.4", "a": ["5 рабочих дней"], "w": ["3 рабочих дня", "10 рабочих дней", "1 месяц"]}, {"n": 27, "q": "Обязан ли страхователь, организация ознакомить с актом формы Н-1, Н-1Е, Н-1М, лиц, допустивших нарушения требований законодательства, локальных правовых актов, приведшие к несчастному случаю, если эти лица не являются работающими страхователя, организации?", "ref": "Л3 п. 30.4.", "a": ["Обязан"], "w": ["Не обязан", "Обязан, только если эти лица находились в служебной командировке", "Обязан только по письменному запросу этих лиц"]}, {"n": 28, "q": "Как учитываются микротравмы страхователем, организацией, страхователем - физическим лицом?", "ref": "Л3 п. 34", "a": ["В журнале регистрации несчастных случаев"], "w": ["В журнале учёта микротравм, который ведётся отдельно от других журналов", "Актами формы Н-1 с регистрацией в органах Департамента госинспекции труда", "В журнале регистрации инструктажа на рабочем месте"]}, {"n": 29, "q": "Кто расследует полученные работающими микротравмы?", "ref": "Л3, п. 34", "a": ["Специалист по охране труда, страхователь - физическое лицо"], "w": ["Непосредственный руководитель потерпевшего", "Комиссия с участием представителя профсоюза", "Руководитель организации единолично"]}, {"n": 30, "q": "Кем расследуется несчастный случай с работающим, направленным страхователем для выполнения его задания либо исполнения своих обязанностей в другую организацию?", "ref": "Л3, п. 35", "a": ["Уполномоченным представителем организации, в которой произошел несчастный случай, с участием других лиц"], "w": ["Уполномоченным представителем страхователя, направившего работника, без участия организации, в которой произошёл несчастный случай, и других лиц", "Государственным инспектором труда по месту нахождения организации, в которой произошёл несчастный случай", "Специалистом по охране труда страхователя потерпевшего совместно с представителем страховщика"]}, {"n": 31, "q": "Какой документ оформляется при отказе работника, выполняющего дистанционную работу, предоставить лицам, проводящим расследование несчастного случая, возможность осмотра, принадлежащего ему (арендуемого им) жилого помещения или иных законных владений, где произошел несчастный случай?", "ref": "Л3 п. 45", "a": ["Акт служебного расследования в произвольной форме"], "w": ["Акт о несчастном случае на производстве формы Н-1", "Акт о непроизводственном несчастном случае формы НП", "Протокол об определении степени вины потерпевшего"]}, {"n": 32, "q": "В какой срок страхователь, организация обязаны оповещать о групповом несчастном случае, несчастном случае со смертельным исходом городской, районный в городе отдел Следственного комитета и территориальное подразделение Департамента государственной инспекции труда Министерства труда и социальной защиты?", "ref": "Л3 п. 48", "a": ["Не позднее двух часов с момента, когда стало известно о несчастном случае любому должностному лицу страхователя, организации"], "w": ["Не позднее рабочего дня, следующего за днём происшествия несчастного случая", "Не позднее 24 часов с момента, когда стало известно о несчастном случае руководителю страхователя", "Не позднее одного часа с момента происшествия несчастного случая"]}, {"n": 33, "q": "Если проведение специального расследования несчастного случая не завершено, то по запросу страховщика государственным инспектором труда Департамента составляется предварительное заключение или мотивированный ответ о невозможности его составления. Что необходимо сделать страхователю в течение трех рабочих дней после получения копии предварительного заключения, которое содержит вывод о наличии в действиях потерпевшего грубой неосторожности?", "ref": "Л3 п. 57-1", "a": ["Составить протокол определения степени вины в процентах и направить его страховщику"], "w": ["Дождаться завершения специального расследования и окончательного заключения государственного инспектора труда", "Направить в суд заявление об определении степени вины потерпевшего", "Составить акт формы Н-1 с указанием степени вины 50 % и направить его страховщику"]}, {"n": 34, "q": "Кодексом РБ об административных правонарушениях предусмотрено наложение штрафа на страхователя за нарушение Правил расследования и учета несчастных случаев на производстве и профессиональных заболеваний. Какое из указанных ниже нарушений влечет за собой наложение такого штрафа?", "ref": "Л23 статья 10.14", "a": ["Несообщение о несчастном случае на производстве или профессиональном заболевании в случаях, предусмотренных законодательством", "Несвоевременное сообщение о несчастном случае на производстве или профессиональном заболевании в случаях, предусмотренных законодательством", "Нарушение установленного порядка расследования несчастного случая"], "w": ["Несвоевременное предоставление лицам, проводящим расследование, сведений о размере заработной платы работающего", "Несогласие страхователя с выводами предварительного заключения государственного инспектора труда", "Проведение расследования несчастного случая с участием представителя профсоюза"]}, {"n": 35, "q": "Кто является страховщиком по обязательному страхованию от несчастных случаев на производстве и профессиональных заболеваний?", "ref": "Л4 Глава 6 п. 192.19", "a": ["Белгосстрах"], "w": ["Фонд социальной защиты населения", "Министерство труда и социальной защиты", "Департамент государственной инспекции труда"]}, {"n": 36, "q": "Страховые выплаты по обязательному страхованию от несчастных случаев на производстве и профессиональных заболеваний НЕ производятся, если повреждение здоровья застрахованного лица произошло вследствие противоправного деяния застрахованного, совершенного умышленно и установленного ...", "ref": "Л4 Глава 6 п. 215", "a": ["... судом либо органом уголовного преследования, органом, уполномоченным на ведение административного процесса"], "w": ["... страхователем по результатам расследования, проведённого уполномоченным должностным лицом", "... страховщиком на основании материалов, представленных страхователем", "... государственным инспектором труда при проведении специального расследования"]}, {"n": 37, "q": "Страховые выплаты по обязательному страхованию от несчастных случаев на производстве и профессиональных заболеваний не производятся, если единственной причиной повреждения здоровья явилось нахождение застрахованного лица в состоянии алкогольного опьянения либо в состоянии, вызванном потреблением наркотических средств, психотропных веществ, их аналогов, токсических или других одурманивающих веществ, подтвержденном ...", "ref": "Л4 Глава 6 п. 215", "a": ["... документом, выданным организацией здравоохранения"], "w": ["... актом страхователя, составленным с участием очевидцев", "... показаниями прибора контроля, применённого страхователем", "... заключением специалиста по охране труда"]}, {"n": 38, "q": "Размер рассчитанных застрахованному единовременной и ежемесячных страховых выплат уменьшается страховщиком на 50 процентов, если одной из причин повреждения здоровья явилось нахождение застрахованного в состоянии алкогольного опьянения либо в состоянии, вызванном потреблением наркотических средств, психотропных веществ, их аналогов, токсических или других одурманивающих веществ, подтвержденном ...", "ref": "Л4 Глава 6 п. 234", "a": ["... документом, выданным организацией здравоохранения"], "w": ["... актом страхователя, составленным с участием очевидцев", "... приказом страхователя об отстранении от работы", "... объяснениями очевидцев несчастного случая"]}, {"n": 39, "q": "Если при расследовании несчастного случая на производстве или профессионального заболевания установлено, что грубая неосторожность застрахованного содействовала возникновению или увеличению вреда, причиненного его здоровью, размер рассчитанных застрахованному единовременной и ежемесячных страховых выплат уменьшается страховщиком пропорционально степени вины застрахованного, но не более чем на ...", "ref": "Л4 Глава 6 п. 234", "a": ["... 50 %"], "w": ["... 25 %", "... 75 %", "... 30 %"]}, {"n": 40, "q": "Если установлено, что грубая неосторожность застрахованного содействовала возникновению или увеличению вреда, причиненного его здоровью, то размер ежемесячной страховой выплаты может быть уменьшен страховщиком в зависимости от степени вины застрахованного. Как определяется степень вины застрахованного?", "ref": "Л4 Глава 6 п. 234", "a": ["Она определяется страхователем при расследовании несчастного случая на производстве или профессионального заболевания в процентах и указывается в акте о несчастном случае на производстве либо в акте о профессиональном заболевании"], "w": ["Она определяется страховщиком на основании представленных документов в процентах и указывается в решении о назначении страховой выплаты, которое направляется застрахованному и страхователю", "Она определяется государственным инспектором труда при проведении специального расследования в процентах и указывается в заключении, которое направляется страховщику и страхователю", "Она определяется судом по заявлению страховщика при рассмотрении спора о страховой выплате в процентах и указывается в решении суда, которое направляется страхователю"]}]}, {"id": 4, "title": "Погрузочно-разгрузочные работы", "legend": {"Л50": "Межотраслевые общие правила по охране труда при проведении погрузочно-разгрузочных работ (утв. пост. Минтруда и социальной защиты РБ от 26.01.2018 № 12)", "Л9": "Типовая инструкция по охране труда при проведении погрузочно-разгрузочных и складских работ (утв. пост. Минтруда и социальной защиты РБ от 26.01.2018 № 10)", "Л11": "Межотраслевые правила по охране труда при эксплуатации напольного безрельсового транспорта и грузовых тележек (утв. пост. Минтруда и социальной защиты РБ 30.12.2003 №165, в ред. пост. Минтруда и социальной защиты РБ от 30.12.2010 № 185)", "Л43": "Постановление Министерства здравоохранения РБ от 13.10.2010 №133 \"Об установлении предельных норм подъема и перемещения тяжестей женщинами вручную\""}, "qs": [{"n": 1, "q": "С какой периодичностью лицо, ответственное за своевременный осмотр и ремонт напольного безрельсового транспорта, грузовых тележек, проводит осмотр грузовых тележек с записью в журнале осмотра?", "ref": "Л11 п.14", "a": ["Не реже 1 раза в 3 месяца"], "w": ["Не реже 1 раза в 6 месяцев", "Не реже 1 раза в месяц", "Не реже 1 раза в 12 месяцев"]}, {"n": 2, "q": "Какую группу по электробезопасности должны иметь водители, занятые управлением электропогрузчиками, электроштабелерами, электротележками, электротягачами?", "ref": "Л11 п. 17", "a": ["Не ниже II"], "w": ["Не ниже I", "Не ниже III", "Не ниже IV"]}, {"n": 3, "q": "Какую группу по электробезопасности должны иметь работающие допущенные к обслуживанию аккумуляторных батарей напольного безрельсового транспорта?", "ref": "Л11 п.17", "a": ["Не ниже III"], "w": ["Не ниже II", "Не ниже I", "Не ниже IV"]}, {"n": 4, "q": "Как в организации закрепляется за водителями погрузчиков напольный безрельсовый транспорт?", "ref": "Л11 п.19", "a": ["Приказом (распоряжением) работодателя (уполномоченного им лица)"], "w": ["Записью в путевом листе, выданном на смену", "Записью в журнале осмотра транспорта лицом, ответственным за его исправность", "Устным распоряжением начальника участка с записью в журнале инструктажа"]}, {"n": 5, "q": "Что должно быть указано в табличке (надписи) на грузовой тележке?", "ref": "Л11 п.22", "a": ["Грузоподъемность, инвентарный номер, наименование структурного подразделения организации"], "w": ["Масса тележки, дата следующего осмотра, фамилия ответственного за её исправность", "Грузоподъёмность, дата последнего осмотра, фамилия водителя погрузчика", "Завод-изготовитель, год выпуска, номер приказа о закреплении за подразделением"]}, {"n": 6, "q": "Допускается ли использовать напольный безрельсовый транспорт для подъема, опускания, перевозки работающих и других лиц на сменных грузозахватных приспособлениях?", "ref": "Л11 п.42", "a": ["Не допускается"], "w": ["Допускается на специальной площадке с ограждением высотой не менее 1 м", "Допускается только при выполнении ремонтных работ на высоте до 2 м", "Допускается при скорости движения не более 5 км/ч"]}, {"n": 7, "q": "При обнаружении во время эксплуатации напольного безрельсового транспорта, грузовых тележек неисправностей, угрожающих безопасности работающих, других лиц, водители погрузчика должны, прекратить работу, а также…", "ref": "Л11 п.46", "a": ["Сообщить об этом своему непосредственному руководителю"], "w": ["Самостоятельно устранить неисправность и сделать запись в журнале осмотра", "Сообщить об этом специалисту по охране труда и в службу технического надзора", "Поставить транспорт на место стоянки и сообщить о неисправности по окончании смены"]}, {"n": 8, "q": "Кто допускается к выполнению погрузочно-разгрузочных работ?", "ref": "Л9 п.2,  Л50 п.13", "a": ["Лица, прошедшие в установленном законодательством порядке медицинский осмотр, а также обучение, инструктаж, стажировку и проверку знаний по вопросам охраны труда"], "w": ["Лица не моложе 21 года, имеющие стаж работы на складе не менее одного года и прошедшие вводный инструктаж по охране труда", "Лица, прошедшие только первичный инструктаж на рабочем месте, с записью в журнале учёта работ и личной подписью работника", "Лица, прошедшие обучение по профессии и имеющие группу по электробезопасности не ниже III, независимо от прохождения медицинского осмотра"]}, {"n": 9, "q": "Что входит в обязанности работающего, выполняющего погрузочно-разгрузочные и складские работы?", "ref": "Л9 п. 4", "a": ["Соблюдать правила внутреннего трудового распорядка, требования по охране труда", "Заботиться о личной безопасности, личном здоровье, а также о безопасности окружающих", "Немедленно сообщать работодателю о любой ситуации, угрожающей жизни или здоровью работающих и окружающих"], "w": ["Самостоятельно проводить ремонт подъёмно-транспортного оборудования при его неисправности", "Проводить проверку знаний по вопросам охраны труда у вновь принятых работающих", "Самостоятельно определять массу грузов, перемещаемых вручную, сверх установленных норм"]}, {"n": 10, "q": "Что делать работающему, занятому на погрузочно-разгрузочных работах (перемещении грузов), в случае возникновения непосредственной опасности для его жизни и здоровья?", "ref": "Л9 п.8", "a": ["Отказаться от выполнения погрузочно-разгрузочных и складских работ"], "w": ["Продолжить работу, оповестив об опасности работодателя в конце смены", "Завершить начатую операцию и сообщить об опасности непосредственному руководителю", "Принять меры к устранению опасности самостоятельно и продолжить выполнение работ"]}, {"n": 11, "q": "Что должны делать работающие, занятые на погрузочно-разгрузочных и складских работах?", "ref": "Л9 п.п.11,12,55", "a": ["Знать местонахождение и уметь пользоваться первичными средствами пожаротушения. Не пользоваться на территории складов открытым огнем. Курить только в отведенных местах", "Не загромождать подступы и подходы к противопожарному инвентарю, огнетушителям, гидрантам и запасным выходам из подсобных помещений и складов", "Погрузку и выгрузку баллонов со сжатым и сжиженным газом, емкостей с едкими и ядовитыми веществами производить по возможности механизированным способом и в специальных контейнерах"], "w": ["Хранить обтирочные материалы и упаковку у мест расположения огнетушителей для быстрого использования", "Складировать баллоны со сжатым газом и ёмкости с едкими веществами совместно с другими грузами в едином штабеле", "Курить на территории склада в местах, не отведённых для этого, при наличии рядом огнетушителя"]}, {"n": 12, "q": "Что не допускается при проведении погрузочно-разгрузочных работ?", "ref": "Л9 п.11 Л50 п.17, 31", "a": ["Появление на работе работающих в состоянии алкогольного, наркотического или токсического опьянения, а также распитие спиртных напитков, употребление наркотических средств, психотропных веществ, их аналогов, токсических веществ в рабочее время или по месту работы", "Применять неисправные, не соответствующие по грузоподъемности и характеру груза подъемно-транспортное оборудование, средства механизации, приспособления для грузоподъемных операций, инструмент", "Размещать грузы в проходах и проездах"], "w": ["Применять средства механизации при перемещении грузов массой свыше установленных норм", "Складировать грузы на специально отведённых площадках с соблюдением ширины проходов", "Применять средства индивидуальной защиты, выданные работодателем"]}, {"n": 13, "q": "Что необходимо делать перед выполнением погрузочно-разгрузочных и складских работ?", "ref": "Л9 п.12", "a": ["Осмотреть место проведения погрузочно-разгрузочных работ, при необходимости убрать посторонние предметы и освободить проходы и проезды", "При применении электрической тали проверить исправность действия тормоза и концевого выключателя механизма ограничителя подъема груза", "Убедиться в достаточном освещении рабочего места"], "w": ["Снять ограждения с подъёмно-транспортного оборудования для удобства осмотра механизмов", "Провести статические испытания грузозахватных приспособлений с записью в журнале", "Приступить к работе, не проверяя освещённость рабочего места, если работа выполняется в дневную смену"]}, {"n": 14, "q": "Какие требования предъявляются к погрузочно-разгрузочным площадкам?", "ref": "Л9 п.19 Л50 п.15, 16", "a": ["Они должны иметь твердое основание", "Они должны обеспечивать устойчивость подъемно-транспортного оборудования, складируемых материалов и транспортных средств", "Они должны иметь уклон не более 5 °"], "w": ["Они должны иметь уклон не менее 8 ° для отвода атмосферных осадков", "Они должны размещаться вплотную к стенам зданий и проездам для сокращения пути перемещения грузов", "Они должны иметь покрытие только из деревянного настила независимо от массы грузов"]}, {"n": 15, "q": "На каком минимальном расстоянии от радиуса поворота рабочих органов подъемно-транспортного оборудования допускается находиться работающему при перемещении груза подъемно-транспортным оборудованием?", "ref": "Л9 п.26", "a": ["5 м"], "w": ["3 м", "10 м", "2 м"]}, {"n": 16, "q": "В каком из указанных в вариантах ответа мест запрещается производить погрузочно-разгрузочные работы?", "ref": "Л9 п.27 Л50 п.27", "a": ["На пути движения транспортных средств", "В местах переходов", "В местах переездов"], "w": ["На специально оборудованных площадках с твёрдым покрытием", "На территории склада, отведённой для этих целей технологической картой", "На складских площадках с твёрдым основанием, обеспечивающих устойчивость транспортных средств"]}, {"n": 17, "q": "Где работникам склада и посторонним лицам не допускается находиться при проведении погрузочно-разгрузочных работ ?", "ref": "Л9 п.29", "a": ["В зоне маневрирования транспортных средств", "В зоне, в которой перемещается груз по наклонной плоскости, и перед перекатываемым грузом", "На грузе, перемещаемом подъемно-транспортным оборудованием"], "w": ["В специально отведённых местах для отдыха за пределами зоны работ", "На расстоянии более 5 м от радиуса поворота рабочих органов оборудования", "В бытовых помещениях склада во время перерыва для отдыха и питания"]}, {"n": 18, "q": "В каких случаях, по окончании погрузочно-разгрузочных работ, разрешается оставлять груз в подвешенном состоянии?", "ref": "Л9 п. 29", "a": ["Это не разрешается делать, ни в каких случаях"], "w": ["При перерыве в работе не более чем на 30 минут", "При условии ограждения опасной зоны под грузом", "При наличии на месте работ стропальщика или крановщика"]}, {"n": 19, "q": "На какую высоту разрешается переносить грузы на носилках по лестницам?", "ref": "Л9 п. 29", "a": ["Ни на какую"], "w": ["Не выше одного этажа", "Не выше 3 м при массе груза до 50 кг", "Не выше двух этажей при ширине лестницы более 1 м"]}, {"n": 20, "q": "Что необходимо сделать при аварии в процессе погрузочно-разгрузочных и складских работ?", "ref": "Л9 п.55", "a": ["Принять меры по предотвращению развития аварийной ситуации и воздействия травмирующих факторов на других лиц, вызову аварийно-спасательных служб, подразделения по чрезвычайным ситуациям (при необходимости)"], "w": ["Покинуть место работ, ничего не предпринимая до прибытия специалиста по охране труда и составления им акта о произошедшей аварии", "Продолжить работы на неповреждённых участках и сообщить о произошедшем уполномоченному лицу по завершении смены, оформив запись в журнале", "Самостоятельно разобрать повреждённый груз и оборудование для восстановления проездов, после чего уведомить аварийно-спасательные службы и работодателя"]}, {"n": 21, "q": "Что делать при несчастном случае во время погрузочно-разгрузочных работ?", "ref": "Л9 п. 56", "a": ["Быстро принять меры по предотвращению воздействия на потерпевшего травмирующих факторов. Немедленно сообщить о происшествии работодателю. Оказывать содействие работодателю в принятии мер по оказанию необходимой помощи потерпевшему и доставке его в организацию здравоохранения"], "w": ["Переместить потерпевшего в бытовое помещение и убрать с места происшествия все следы до прибытия комиссии. Сообщить о происшествии специалисту по охране труда по окончании смены и составить объяснительную записку", "Прекратить работы только на рабочем месте потерпевшего. Сообщить о случившемся родственникам потерпевшего и самостоятельно провести расследование с участием очевидцев, оформив результаты протоколом", "Дождаться прибытия специалиста по охране труда, не прикасаясь к потерпевшему. Сообщить о произошедшем в страховую организацию и обеспечить его доставку домой служебным транспортом после оформления акта"]}, {"n": 22, "q": "Кто обеспечивает организацию и безопасность труда при проведении погрузочно-разгрузочных работ?", "ref": "Л50 п.11, п.12", "a": ["Должностное лицо, ответственное за безопасное проведение погрузочно-разгрузочных работ, назначенное приказом"], "w": ["Специалист по охране труда организации, на которого возложен контроль за соблюдением требований законодательства", "Старший из работающих в бригаде, определённый устным распоряжением мастера на текущую смену", "Руководитель службы снабжения, ответственный за приёмку и хранение материальных ценностей на складе"]}, {"n": 23, "q": "Какие требования предъявляются в зимнее время к площадкам для погрузочно-разгрузочных работ и подходам к ним?", "ref": "Л50 п.26", "a": ["Они должны быть очищены от снега и льда и посыпаны песком, шлаком или другими противоскользящими материалами"], "w": ["Они должны быть очищены от снега только в начале каждой рабочей смены, посыпка не требуется", "Они должны быть очищены от снега, а лёд допускается оставлять при наличии предупреждающих знаков", "Они должны быть утрамбованы и политы водой для образования ровной и твёрдой поверхности"]}, {"n": 24, "q": "Начиная с какого расстояния перемещение грузов в технологическом процессе должно быть механизировано?", "ref": "Л50 п.39", "a": ["Более 25 м"], "w": ["Более 10 м", "Более 15 м", "Более 50 м"]}, {"n": 25, "q": "Какие требования необходимо соблюдать при ручной погрузке и разгрузке грузов массой от 80 до 500 кг?", "ref": "Л50 п. 52", "a": ["Работы допускается производить только на площадках под руководством и в присутствии уполномоченного должностного лица работодателя", "Нагрузка на одного работающего не должна превышать 50 кг"], "w": ["Нагрузка на одного работающего не должна превышать 80 кг", "Работы допускается производить только с участием не менее трёх работающих при отсутствии уполномоченного лица", "Работы допускается производить без руководителя при наличии у работающих опыта не менее одного года"]}, {"n": 26, "q": "Каким способом должно быть предотвращено непреднамеренное перемещение автомобиля во время его погрузки (разгрузки)?", "ref": "Л50 п.56", "a": ["При помощи противооткатных устройств"], "w": ["При помощи включённой передачи и работающего двигателя", "При помощи только стояночного тормоза, включённого водителем", "При помощи подложенных под колёса досок, брёвен или камней"]}, {"n": 27, "q": "В какой последовательности должна производиться загрузка-разгрузка кузова автомобиля (прицепа)?", "ref": "Л50 п.57", "a": ["Загрузка от кабины к заднему борту, разгрузка - в обратном порядке"], "w": ["Загрузка от заднего борта к кабине, разгрузка - в обратном порядке", "Загрузка от кабины к заднему борту, разгрузка - в той же последовательности", "Загрузка от боковых бортов к середине кузова, разгрузка - в обратном порядке"]}, {"n": 28, "q": "Груз, какой массы при проведение погрузочно-разгрузочных работ вручную, при соблюдении предельно допустимых норм разового подъема тяжестей, допускается перемещать работающим (мужчинам)?", "ref": "Л50 п.86", "a": ["Не более 50 кг"], "w": ["Не более 80 кг", "Не более 30 кг", "Не более 40 кг"]}, {"n": 29, "q": "Что из перечисленного должно соблюдаться при перемещении тяжеловесных грузов вручную?", "ref": "Л50 п. 92", "a": ["Не находиться на ступенях лестницы за поднимаемым или перед опускаемым при помощи троса тяжеловесным грузом", "При спуске по наклонной плоскости применять меры по исключению возможного скатывания или сползания груза под действием собственной тяжести или его опрокидывания", "Перемещать тяжеловесные грузы по горизонтальной поверхности при помощи катков"], "w": ["Находиться перед поднимаемым грузом для его поддержки на ступенях лестницы", "Удерживать груз при его скатывании по наклонной плоскости руками без применения тормозных приспособлений", "Поддерживать тяжеловесный груз снизу при его опускании по лестнице при помощи троса"]}, {"n": 30, "q": "Что из перечисленного должно соблюдаться при перемещении тяжеловесных грузов вручную по горизонтальной поверхности при помощи катков?", "ref": "Л50 п. 92", "a": ["Путь перемещения должен быть очищен от всех посторонних предметов", "Для подведения катков под груз должны применяться ломы или домкраты", "Во избежание опрокидывания груза следует иметь дополнительные катки, подкладываемые под переднюю часть груза"], "w": ["Подводить катки под груз руками, удерживая их за торцы", "Находиться впереди движущегося груза для поправки катков", "Перекладывать катки под грузом вручную во время его движения"]}, {"n": 31, "q": "Кто должен подавать команду на опускание груза на носилках или на опрокидывание носилок?", "ref": "Л50 п. 95 Л9 п. 30.7", "a": ["Работник, несущий носилки сзади"], "w": ["Работник, несущий носилки спереди", "Мастер или другое уполномоченное должностное лицо", "Любой из работников, несущих носилки"]}, {"n": 32, "q": "Допускается ли загромождать пустой тарой территорию склада?", "ref": "Л50 п.98", "a": ["Не допускается"], "w": ["Допускается на срок не более одной смены", "Допускается при условии складирования в штабели высотой до 2 м", "Допускается вне проходов и проездов при наличии указателей"]}, {"n": 33, "q": "Допускается ли укладка грузов вплотную к стенам зданий, колоннам, оборудованию, столбам, деревьям, штабель к штабелю?", "ref": "Л50 п. 103", "a": ["Не допускается"], "w": ["Допускается при наличии вентиляции и защитных прокладок", "Допускается только для грузов высотой не более 1,5 м", "Допускается только для негорючих грузов"]}, {"n": 34, "q": "Какова предельно допустимая масса груза при подъеме и перемещении тяжестей женщинами вручную?", "ref": "Л43", "a": ["При чередовании с другой работой (до 2 раз в час) - 10 кг; постоянно в течение рабочей смены -7 кг"], "w": ["При чередовании с другой работой (до 2 раз в час) - 15 кг; постоянно в течение рабочей смены - 10 кг", "При чередовании с другой работой (до 2 раз в час) - 20 кг; постоянно в течение рабочей смены - 15 кг", "При чередовании с другой работой (до 2 раз в час) - 7 кг; постоянно в течение рабочей смены - 5 кг"]}]}, {"id": 5, "title": "Электробезопасность", "legend": {"Л1": "ТКП-427-2022 Технический кодекс установившейся практики \"Электроустановки. Правила по обеспечению безопасности при эксплуатации\" (утв. пост. Минэнерго РБ от 09.03.2022 № 10 с изменением № 1, утв. пост. Минэнерго РБ от 30.12.2024 № 47)", "Л2": "ТКП 181-2023 (33240) Правила технической эксплуатации электроустановок потребителей (утв.пост. Министерства энергетики РБ от 27.11.2023 г. № 47)"}, "qs": [{"n": 1, "q": "Как производить при несчастных случаях снятие напряжения для освобождения потерпевшего от воздействия электрического тока?", "ref": "Л1 п. 4.1.3", "a": ["Немедленно без предварительного разрешения"], "w": ["После получения разрешения оперативного персонала, а при его отсутствии — лица, ответственного за электрохозяйство", "После устного согласования с вышестоящим оперативным персоналом и записи в оперативном журнале", "Только силами работников с группой по электробезопасности не ниже III после вызова ответственного за электрохозяйство"]}, {"n": 2, "q": "Разрешается ли допускать лиц, не достигших 18-летнего возраста, к самостоятельным работам в электроустановках?", "ref": "Л1 п. 4.2.3", "a": ["Не разрешается"], "w": ["Разрешается после прохождения стажировки и присвоения группы по электробезопасности не ниже II", "Разрешается только в электроустановках напряжением до 1000 В", "Разрешается под постоянным контролем работника с группой по электробезопасности не ниже IV"]}, {"n": 3, "q": "Что должны иметь лица из электротехнического персонала, обладающие правом проведения работ, к которым предъявляются специальные требования по охране труда?", "ref": "Л1 п. 4.2.7", "a": ["Запись в удостоверении по охране труда на право выполнения специальных работ"], "w": ["Запись в журнале учёта работ по наряду-допуску и распоряжению", "Запись в журнале регистрации инструктажа на рабочем месте о допуске к специальным работам", "Приказ о закреплении за электроустановкой с указанием видов специальных работ"]}, {"n": 4, "q": "Что должны в первую очередь сделать работающие при обнаружении неисправности электроустановки, которая представляет явную опасность для работающих и окружающих лиц?", "ref": "Л1 п. 4.2.9", "a": ["Принять меры для исключения приближения к электроустановке посторонних лиц"], "w": ["Самостоятельно отключить электроустановку и приступить к устранению неисправности", "Сделать запись об обнаруженной неисправности в оперативном журнале и дождаться прибытия ответственного за электрохозяйство", "Сообщить о неисправности в территориальный орган госэнергогазнадзора"]}, {"n": 5, "q": "Упавший на землю провод линии электропередачи может представлять явную опасность для окружающих лиц. Какие действия должны быть выполнены в первую очередь при обнаружении упавшего на землю провода линии электропередачи?", "ref": "Л1 п. 4.2.9", "a": ["Принять меры для исключения приближения к упавшему проводу посторонних лиц"], "w": ["Сообщить об упавшем проводе в организацию, эксплуатирующую линию электропередачи, и дождаться прибытия её персонала", "Отвести провод в сторону от прохода сухой палкой или другим изолирующим предметом", "Вызвать спасательную службу и зафиксировать место падения провода путём фотографирования"]}, {"n": 6, "q": "У потребителей, электрохозяйство которых включает в себя только вводное (вводно-распределительное) устройство, осветительные установки, электрооборудование номинальным напряжением не выше 400 В, с разрешенной к использованию мощностью до 30 кВт, ответственный за электрохозяйство может не назначаться. На кого в этом случае возлагается ответственность за безопасную эксплуатацию электроустановок?", "ref": "Л2 п. 4.1.9", "a": ["На руководителя потребителя"], "w": ["На специалиста по охране труда", "На работника, которому присвоена группа по электробезопасности не ниже III", "На главного инженера или лицо, исполняющего его обязанности"]}, {"n": 7, "q": "Что необходимо сделать потребителям, электрохозяйство которых включает в себя только вводное (вводно-распределительное) устройство, осветительные установки, электрооборудование номинальным напряжением не выше 400 В, с разрешенной к использованию мощностью до 30 кВт, возложивших на себя обязанности за безопасную эксплуатацию электроустановок?", "ref": "Л2 п. 4.1.9", "a": ["Пройти инструктаж и оформить соответствующее обязательство в территориальном органе госэнергогазнадзора"], "w": ["Назначить приказом лицо, ответственное за электрохозяйство, и направить копию приказа в органы госэнергогазнадзора", "Пройти проверку знаний с присвоением группы по электробезопасности IV в комиссии органа госэнергогазнадзора", "Заключить договор на обслуживание электроустановок и уведомить об этом территориальный орган Департамента госинспекции труда"]}, {"n": 8, "q": "Работник, обнаруживший нарушения Правил технической эксплуатации электроустановок, а также заметивший неисправности электроустановки или средств защиты, должен немедленно сообщить об этом ...", "ref": "Л2 п. 4.1.13", "a": ["... своему непосредственному руководителю, а в его отсутствие - вышестоящему руководителю"], "w": ["... лицу, ответственному за электрохозяйство, а в его отсутствие — специалисту по охране труда", "... специалисту по охране труда, а в его отсутствие — руководителю организации", "... в территориальный орган госэнергогазнадзора, а затем своему непосредственному руководителю"]}, {"n": 9, "q": "Персонал, выполняющий работу, при которой может возникнуть опасность поражения электрическим током, при приеме на работу должен ...", "ref": "Л2 п. 4.2.4", "a": ["... пройти вводный инструктаж по охране труда, с учетом требований к персоналу с группой по электробезопасности I"], "w": ["... пройти обучение и проверку знаний с присвоением группы по электробезопасности II", "... пройти первичный инструктаж на рабочем месте и получить группу по электробезопасности II в комиссии организации", "... пройти стажировку продолжительностью не менее двух смен с присвоением группы по электробезопасности I"]}, {"n": 10, "q": "Персонал, выполняющий работу, при которой может возникнуть опасность поражения электрическим током, при приеме на работу проходит вводный инструктаж по охране труда, с учетом требований к персоналу с группой по электробезопасности I. Какие из указанных ниже требований предъявляются к персоналу с группой по электробезопасности I согласно ТКП-427-2022?", "ref": "Л2 п. 4.2.4, п. 4.2.20,  Л1 Приложение В", "a": ["Должен иметь представление об опасности электрического тока, опасности приближения к токоведущим частям", "Должен обладать практическими навыками оказания первой помощи потрепевшим"], "w": ["Должен знать устройство электроустановки и уметь производить в ней оперативные переключения", "Должен иметь элементарные технические знания об электроустановках и их оборудовании", "Должен иметь стаж работы в электроустановках не менее одного месяца"]}, {"n": 11, "q": "У потребителя отсутствует возможность организовать у себя комиссию для присвоения (подтверждения) группы по электробезопасности. Организовать присвоение (подтверждение) группы по электробезопасности в органе госэнергогазнадзора проблематично из-за сложностей с доставкой персонала в орган госэнергогазнадзора. Допускается ли данному потребителю организовать присвоение (подтверждение) группы по электробезопасности в комиссии другой организации, которая не является для этого потребителя вышестоящей организацией?", "ref": "Л2 п. 4.2.25", "a": ["Не допускается"], "w": ["Допускается при наличии договора с этой организацией", "Допускается по согласованию с территориальным органом госэнергогазнадзора", "Допускается, если в составе комиссии этой организации есть представитель органа госэнергогазнадзора"]}, {"n": 12, "q": "В каких помещениях, на всех штепсельных розетках должны быть надписи с указанием номинального напряжения.", "ref": "Л2 п. 5.13.13", "a": ["В помещениях, в которых используется напряжение двух и более номиналов"], "w": ["В помещениях с повышенной опасностью и особо опасных помещениях", "В помещениях, в которых применяется напряжение выше 42 В", "В помещениях с электрооборудованием напряжением выше 1000 В"]}]}, {"id": 6, "title": "Пожарная безопасность", "legend": {"Л2": "ТКП295-2011 Технический кодекс установившейся практики Пожарная техника. Огнетушители. Требования к выбору и эксплуатации. (с изменениями №1, и №2)", "Л4": "Общие требования пожарной безопасности к содержанию и эксплуатации капитальных строений (зданий, сооружений), изолированных помещений и иных объектов, принадлежащих субъектам хозяйствования (Приложение к Декрету Президента Республики Беларусь от 23.11.2017 № 7, в ред. Закона РБ от 07.03.2024 № 358-З)", "Л5": "Требования к содержанию общеобъектовой инструкции по пожарной безопасности (Приложение 1 к пост. МЧС РБ от 21.12.2021 № 82, в ред. от 12.12.2025 № 61)", "Л9": "ИНСТРУКЦИЯ о нормах оснащения объектов первичными средствами пожаротушения (Утв. пост. МЧС РБ от 21.12.2021 № 82, в ред. от 12.12.2025 № 61)"}, "qs": [{"n": 1, "q": "Огнетушители переносные при размещении на объекте должны располагаться так, чтобы нанесенные на этикетку основные надписи и пиктограммы, показывающие порядок приведения их в действие, были обращены …", "ref": "Л2 п. 4.2.3.", "a": ["... наружу или в сторону наиболее вероятного подхода к ним"], "w": ["... внутрь шкафа или ниши, в которых они размещены, для защиты от загрязнения", "... в сторону ближайшего эвакуационного выхода", "... вниз для защиты этикетки от прямых солнечных лучей"]}, {"n": 2, "q": "Что следует контролировать в ходе проведения внешнего осмотра огнетушителя перед введением его в эксплуатацию?", "ref": "Л2 п. 4.3.5.", "a": ["Наличие и целостность этикетки с нанесенными на нее надписями и пиктограммами; целостность предохранительного устройства; наличие необходимого клейма и величина давления в огнетушителе закачного типа или в газовом баллоне", "Состояние гибкого шланга (при его наличии) и распылителя ОТВ (на отсутствие механических повреждений, следов коррозии, литейного облоя или других предметов, препятствующих свободному выходу ОТВ из огнетушителя)", "Состояние ходовой части и надежность крепления корпуса огнетушителя на тележке (для передвижного огнетушителя), на стене или в пожарном шкафу (для переносного огнетушителя)"], "w": ["Массу и цвет корпуса огнетушителя, соответствие срока его службы сроку эксплуатации здания", "Наличие сертификата на огнезадерживающие свойства шкафа и отметку о прохождении пожарно-технического минимума ответственным лицом", "Наличие записи о прохождении каждым работником пожарно-технического минимума на корпусе огнетушителя"]}, {"n": 3, "q": "Куда должны заноситься результаты внешнего осмотра огнетушителей?", "ref": "Л2 п. 4.3.5.", "a": ["В журнал учета и состояния огнетушителей"], "w": ["В журнал учёта противопожарных инструктажей", "В паспорт здания (сооружения)", "В журнал учёта и проведения огневых работ"]}, {"n": 4, "q": "Какие огнетушители, установленные на объекте, должны иметь порядковый номер?", "ref": "Л2 п. 4.3.20.", "a": ["Все"], "w": ["Только передвижные", "Только установленные в производственных помещениях", "Только с массой заряда более 5 кг"]}, {"n": 5, "q": "В каких из указанных ниже случаев запрещается эксплуатация огнетушителей?", "ref": "Л2 п. 4.7.2.", "a": ["При появлении вмятин, вздутий или трещин на корпусе огнетушителя, на запорно-пусковой головке или на накидной гайке", "При нарушении герметичности соединений узлов огнетушителя", "При неисправности индикатора давления"], "w": ["При размещении огнетушителя на стене на высоте до 1,5 м", "При наличии порядкового номера на корпусе огнетушителя, нанесённого краской", "При нанесении на корпус огнетушителя дополнительной надписи о месте его установки"]}, {"n": 6, "q": "Что из указанного в вариантах ответа обязан обеспечить руководительсубъекта хозяйствования в отношении пожарной безопасности в соответствии с Декретом Президента Республики Беларусь от 23.11.2017 № 7?", "ref": "Л4 п. 3.1", "a": ["Соблюдение требований пожарной безопасности на объекте", "Контроль выполнения требований пожарной безопасности на объекте", "Работоспособность и исправность средств противопожарной защиты и пожаротушения, противопожарного водоснабжения, связи, защиты от статического электричества, наружных пожарных лестниц, ограждений крыш зданий, а также постоянную готовность к применению этих средств"], "w": ["Проведение обязательного страхования от пожара всего имущества работников субъекта", "Согласование всех инструкций по пожарной безопасности с органами государственного пожарного надзора ежегодно", "Выдачу каждому работнику индивидуального огнетушителя для использования по месту жительства"]}, {"n": 7, "q": "Что из указанного в вариантах ответа обязан организовать руководитель субъекта хозяйствования в отношении пожарной безопасности в соответствии с Декретом Президента Республики Беларусь от 23.11.2017 № 7?", "ref": "Л4 п. 3.2", "a": ["Разработку инструкций по пожарной безопасности", "Информирование работников о состоянии пожарной безопасности субъекта хозяйствования, подготовку работников по программам пожарно-технического минимума и проведение противопожарных инструктажей, а также обучение работников мерам пожарной безопасности", "Уборку территории от сухой растительности и горючих отходов"], "w": ["Проведение ежегодного капитального ремонта всех систем пожаротушения", "Круглосуточное дежурство работников в каждом производственном помещении", "Проведение пожарно-технического минимума только для руководящих работников один раз в 10 лет"]}, {"n": 8, "q": "Согласно Декрету Президента Республики Беларусь от 23.11.2017 № 7 руководитель субъекта хозяйствования, в целях обеспечения пожарной безопасности, должен организовать проведение технологических процессов в соответствии с ...", "ref": "Л4 п. 3.2", "a": ["... эксплуатационной и технологической документацией"], "w": ["... устными указаниями руководителя структурного подразделения", "... графиком производства работ, согласованным с органами госпожнадзора", "... рекомендациями специалиста по охране труда"]}, {"n": 9, "q": "Должен ли руководитель субъекта хозяйствования (кроме индивидуальных предпринимателей и руководителей микроорганизаций) организовать наличие стендов с информацией о пожарной безопасности и их своевременное обновление?", "ref": "Л4 п. 3.2", "a": ["Должен"], "w": ["Не должен, это обязанность органов государственного пожарного надзора", "Должен только при численности работающих более 100 человек", "Должен только на объектах с массовым пребыванием людей"]}, {"n": 10, "q": "Что в соответствии с Декретом Президента Республики Беларусь от 23.11.2017 № 7 обязан выполнить руководитель субъекта хозяйствования перед началом массового мероприятия?", "ref": "Л4 п. 3.3", "a": ["Назначить лиц, ответственных за пожарную безопасность на мероприятии", "Обеспечить осмотр помещений перед началом мероприятия в целях определения его готовности в части соблюдения требований пожарной безопасности", "Обеспечить дежурство ответственных лиц на сцене и в зальных помещениях"], "w": ["Получить разрешение на проведение мероприятия в районном отделе по чрезвычайным ситуациям", "Заблокировать часть эвакуационных выходов для контроля входа участников", "Закрыть на замок двери зальных помещений на всё время проведения мероприятия"]}, {"n": 11, "q": "Что из указанного в вариантах ответа должен обязательно выполнить в соответствии с Декретом Президента Республики Беларусь от 23.11.2017 № 7 руководитель (должностное лицо) субъекта хозяйствования в случае возникновения пожара, до прибытия пожарных аварийно-спасательных подразделений?", "ref": "Л4 п. 5.1", "a": ["Принять незамедлительные меры по обеспечению эвакуации людей и ограничению распространения пожара (вплоть до остановки оборудования). Организовать выполнение действий, предусмотренных инструкциями по пожарной безопасности"], "w": ["Лично приступить к тушению пожара, поручив эвакуацию людей прибывающим пожарным подразделениям; оборудование не останавливать до получения их указаний", "Сообщить о пожаре вышестоящей организации и ожидать её указаний, не предпринимая иных действий, чтобы не нарушить обстановку на месте пожара", "Составить акт о пожаре с указанием виновных лиц. Организовать вывоз материальных ценностей и документов, а эвакуацию людей начать после их вывоза"]}, {"n": 12, "q": "В случае возникновения пожара, до прибытия пожарных аварийно-спасательных подразделений, руководитель (должностное лицо) субъекта хозяйствования, должен при необходимости вызвать ...", "ref": "Л4 п. 5.1", "a": ["... скорую медицинскую помощь, а также аварийные службы"], "w": ["... представителя страховой организации и вышестоящей организации", "... специалиста по охране труда и представителя профсоюза", "... представителей средств массовой информации"]}, {"n": 13, "q": "Должен ли руководитель (должностное лицо) субъекта хозяйствования в случае возникновения пожара организовать передачу сообщения о пожаре в пожарные аварийно-спасательные подразделения?", "ref": "Л4 п. 5.1", "a": ["Должен"], "w": ["Должен только при отсутствии автоматической пожарной сигнализации", "Не должен, это обязанность работника, обнаружившего пожар", "Должен, но только если не удалось ликвидировать пожар за 10 минут"]}, {"n": 14, "q": "Согласно Декрету Президента Республики Беларусь от 23.11.2017 № 7 по прибытии на пожар пожарных аварийно-спасательных подразделений руководитель (должностное лицо) субъекта хозяйствования должен сообщить им сведения о ...", "ref": "Л4 п. 5.2", "a": ["... месте пожара и наличии (возможности наличия) людей на объекте", "... мерах, предпринятых для ликвидации пожара, и людях, занятых ликвидацией очагов горения", "... наличии взрывопожароопасных материалов, баллонов с газом, легковоспламеняющихся жидкостей, горючих жидкостей"], "w": ["... размере ожидаемых страховых выплат и балансовой стоимости имущества", "... лицах, виновных в возникновении пожара, и составленных в отношении них документах", "... сроках последней проверки знаний работников по вопросам охраны труда"]}, {"n": 15, "q": "Что из указанного в вариантах ответа согласно Декрету Президента Республики Беларусь от 23.11.2017 № 7 входит в обязанности каждого работника субъекта хозяйствования в части, касающейся пожарной безопасности?", "ref": "Л4 п. 6", "a": ["Знать требования пожарной безопасности, соблюдать противопожарный режим субъекта хозяйствования", "Не совершать действий, которые могут привести к возникновению пожара", "Незамедлительно приступить к эвакуации при срабатывании систем оповещения о пожаре и управления эвакуацией либо при поступлении иной информации о пожаре"], "w": ["Самостоятельно проводить проверку и перезарядку огнетушителей на объекте", "При срабатывании оповещения оставаться на рабочем месте до получения письменного распоряжения руководителя", "Самостоятельно отключать систему оповещения о пожаре при её срабатывании"]}, {"n": 16, "q": "Кто из работников субъекта хозяйствования должен уметь применять первичные средства пожаротушения и средства самоспасения?", "ref": "Л4 п. 6", "a": ["Все работники"], "w": ["Только лица, ответственные за пожарную безопасность", "Только работники, входящие в добровольную пожарную дружину", "Только работники пожароопасных участков"]}, {"n": 17, "q": "Какие действия необходимо предпринять гражданину при обнаружении пожара?", "ref": "Л4 п. 6а", "a": ["Немедленно сообщить по телефонам 101 или 112 или непосредственно в пожарное аварийно-спасательное подразделение адрес и место пожара", "Принять меры по оповещению людей и их эвакуации", "Принять возможные меры по тушению пожара имеющимися первичными средствами пожаротушения"], "w": ["Закрыть помещение и дождаться прибытия руководителя организации", "В первую очередь открыть окна и двери для проветривания горящего помещения", "Вернуться в горящее помещение за личными вещами до начала эвакуации людей"]}, {"n": 18, "q": "Какая общеобъектовая инструкция должна быть разработана субъектом хозяйствования для соблюдения требований ТНПА и НПА, содержащих требования пожарной безопасности, исходя из специфики пожарной опасности зданий, сооружений и помещений, наружных установок и территорий, используемых в производственном (технологическом) процессе веществ и материалов, оборудования?", "ref": "Л4 п. 7", "a": ["Общеобъектовая инструкция по пожарной безопасности"], "w": ["Инструкция о мерах пожарной безопасности при проведении огневых работ", "Инструкция по охране труда для работающих на объекте", "Цеховая инструкция о порядке действий при пожаре"]}, {"n": 19, "q": "Кто утверждает разработанную субъектом хозяйствования общеобъектовую инструкцию по пожарной безопасности?", "ref": "Л4 п. 7", "a": ["Руководитель субъекта хозяйствования"], "w": ["Специалист, ответственный за пожарную безопасность", "Начальник районного отдела по чрезвычайным ситуациям", "Специалист по охране труда"]}, {"n": 20, "q": "Допускается ли загромождать и перекрывать для движения пожарной аварийно-спасательной техники въезды (выезды), дороги, проезды и подъезды к зданиям, сооружениям, наружным установкам?", "ref": "Л4 п. 14", "a": ["Не допускается"], "w": ["Допускается на время выполнения погрузочно-разгрузочных работ", "Допускается при наличии резервного проезда с другой стороны здания", "Допускается на срок не более 2 часов с разрешения руководителя"]}, {"n": 21, "q": "Допускается ли хранение легковоспламеняющихся и горючих жидкостей, баллонов с горючим газом, а также емкостей после их применения на чердаках, подвальных, цокольных, технических этажах и в подпольях зданий, на лестничных клетках и в лифтовых холлах, на балконах и лоджиях, в заэкранном и подтрибунном пространстве, под сценой или подмостками для эстрадных выступлений?", "ref": "Л4 п. 20", "a": ["Не допускается"], "w": ["Допускается в подвальных этажах при наличии приточно-вытяжной вентиляции", "Допускается в количестве, не превышающем суточной потребности", "Допускается в специальных шкафах на лестничных клетках"]}, {"n": 22, "q": "Допускаются ли к эксплуатации теплогенерирующие аппараты и отопительные приборы (кроме теплоемких печей) не заводского изготовления?", "ref": "Л4 п. 27", "a": ["Не допускаются"], "w": ["Допускаются при наличии разрешения руководителя организации", "Допускаются при условии их установки на негорючем основании", "Допускаются в помещениях без постоянного пребывания людей"]}, {"n": 23, "q": "Разрешается ли складировать в производственных помещениях горючие вещества, горючие материалы и готовую продукцию, которая может воспламениться?", "ref": "Л4 п. 30", "a": ["Не разрешается"], "w": ["Разрешается в количестве, не превышающем сменной потребности", "Разрешается при наличии огнетушителя в помещении", "Разрешается при расстоянии от оборудования не менее 1 м"]}, {"n": 24, "q": "В чем из указанного в вариантах ответа должен убедиться руководитель подразделения организации, индивидуальный предприниматель, на объектах которых проводятся огневые работы сторонней организацией, индивидуальным предпринимателем?", "ref": "Л4 п. 34", "a": ["В наличии и действии талона о прохождении пожарно-технического минимума у лица, ответственного за проведение огневых работ"], "w": ["В наличии согласования проводимых работ с районным отделом по чрезвычайным ситуациям у каждого исполнителя огневых работ", "В наличии у лица, ответственного за проведение огневых работ, договора страхования имущества от пожара", "В наличии записи в журнале учёта инструктажей своей организации у всех работников сторонней организации"]}, {"n": 25, "q": "Что из указанного ниже относится к первичным средствам пожаротушения в соответствии с Декретом Президента Республики Беларусь от 23.11.2017 № 7?", "ref": "Л4 п. 52", "a": ["Огнетушитель"], "w": ["Автоматическая установка пожаротушения", "Пожарный автомобиль", "Спринклерная установка"]}, {"n": 26, "q": "Что из указанного ниже относится к первичным средствам пожаротушения в соответствии с Декретом Президента Республики Беларусь от 23.11.2017 № 7?", "ref": "Л4 п. 52", "a": ["Немеханизированный ручной пожарный инструмент", "Емкости с запасом воды", "Полотнище противопожарное"], "w": ["Внутренний пожарный кран с механической подачей воды", "Автоматическая установка газового пожаротушения", "Передвижная пожарная автолестница"]}, {"n": 27, "q": "Дайте определение термина \"Огневые работы\" в соответствии с Декретом Президента Республики Беларусь от 23.11.2017 № 7:", "ref": "Л4 п. 62", "a": ["Работы повышенной опасности, связанные с применением открытого огня,искрообразованием и нагреванием до температур, способных вызвать воспламенение материалов и конструкций (электро- и газосварочные работы, газо-, электро-, бензорезка, работы по разогреву битума, нагреву деталей открытым пламенем, применение факелов, горелок)"], "w": ["Любые работы, выполняемые в производственных помещениях с применением сварочного и электротехнического оборудования, независимо от наличия открытого огня, включая монтаж электропроводки", "Работы, связанные только с применением газосварочного оборудования и открытого пламени на территории предприятий, требующие обязательного присутствия пожарного расчёта", "Работы с повышенной опасностью, связанные с хранением и перемещением горючих жидкостей, баллонов с газом и легковоспламеняющихся материалов на территории субъекта хозяйствования"]}, {"n": 28, "q": "Что такое \"Противопожарный режим\" в соответствии с Декретом Президента Республики Беларусь от 23.11.2017 № 7?", "ref": "Л4 п. 62", "a": ["Комплекс противопожарных мероприятий при выполнении работ и эксплуатации объекта, предусмотренный нормативными правовыми актами и обязательными для соблюдения техническими нормативными правовыми актами, содержащими требования системы противопожарного нормирования и стандартизации"], "w": ["Перечень обязанностей специалиста по охране труда при обнаружении нарушений пожарной безопасности, предусмотренный должностной инструкцией и утверждённый руководителем организации", "Порядок действий подразделений МЧС при ликвидации пожара и проведении аварийно-спасательных работ, предусмотренный уставом пожарной службы и ведомственными нормативными актами", "График проведения противопожарных инструктажей и тренировок по эвакуации, утверждённый руководителем субъекта хозяйствования и согласованный с органами государственного пожарного надзора"]}, {"n": 29, "q": "Что из указанного ниже должно содержаться в общеобъектовой инструкции по пожарной безопасности?", "ref": "Л5", "a": ["Общая характеристика пожарной опасности объекта, оборудования, обращающихся в процессе эксплуатации веществ и материалов", "Режим курения курительных табачных изделий, а также требования к местам для курения и их размещению (при наличии)", "Порядок обеспечения пожарной безопасности сторонними юридическими лицами, индивидуальными предпринимателями при выполнении работ на объектах субъекта хозяйствования"], "w": ["Сведения о стоимости зданий, сооружений и размере страхового покрытия при пожаре", "Персональный график отпусков лиц, ответственных за пожарную безопасность", "Перечень поставщиков средств пожаротушения с указанием их стоимости"]}, {"n": 30, "q": "Что из указанного ниже должно содержаться в общеобъектовой инструкции по пожарной безопасности?", "ref": "Л5", "a": ["Порядок и периодичность уборки горючих отходов и пыли", "Порядок и периодичность очистки дымовых труб (каналов) (при наличии)", "Порядок организации тренировочных занятий по эвакуации людей при пожаре (взрыве); порядок эксплуатации средств обеспечения пожарной безопасности и пожаротушения, ведение технической документации на них; порядок сбора, хранения и удаления горючих веществ и материалов, содержания и хранения специальной одежды и обуви (при наличии)"], "w": ["Порядок начисления доплат работающим, входящим в добровольную пожарную дружину", "План закупки технологического оборудования и материалов на следующий календарный год", "Порядок прохождения работниками предварительных медицинских осмотров"]}, {"n": 31, "q": "Какому огнетушителю следует отдать предпочтение при укомплектовании объекта первичными средствами пожаротушения, если на объекте возможны комбинированные очаги пожара?", "ref": "Л9 п. 4", "a": ["Более универсальному по области применения огнетушителю"], "w": ["Огнетушителю с наибольшей массой заряда независимо от области применения", "Самому дешёвому огнетушителю из числа сертифицированных", "Газовому огнетушителю независимо от класса возможного пожара"]}]}, {"id": 7, "title": "Знаки безопасности", "legend": {"Л1": "ГОСТ 12.4.026-2015 Цвета сигнальные, знаки безопасности и разметка сигнальная (с изменением № 1, введенным в действие пост. Государственного комитета по стандартизации Республики Беларусь от 07.07.2019 № 34)"}, "qs": [{"n": 1, "q": "Что означает это знак?", "ref": "Л1 Приложение Е, знак P01", "a": ["Запрещается курить"], "w": ["Запрещается пользоваться открытым огнём", "Запрещается курить и пользоваться открытым огнём", "Запрещается оставлять тлеющие предметы"], "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAADwCAYAAAA+VemSAAAAAXNS
