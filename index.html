    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = db && user ? await user.id() : null;
    if (!uid) { syncState = 'local'; showSync(); return; }
    const ref = db.doc('data/users/' + uid + '/progress');
    let first = true;
    const timer = setTimeout(() => { if (syncState === 'wait') { syncState = 'err'; showSync(); } }, 10000);
    ref.onSnapshot(snap => {
      const remote = snap.exists ? snap.data() : null;
      const rt = (remote && remote.t) || 0;
      if (rt > stamp) { prog = JSON.parse(JSON.stringify(remote.p || {})); stamp = rt; persistLocal(); refresh(); }
      if (snap.metadata.fromCache) return;
      clearTimeout(timer);
      if (first) { first = false; cloud = ref; if (rt < stamp || !remote) { push(); return; } }
      syncState = 'ok'; showSync();
    }, () => { clearTimeout(timer); cloud = null; syncState = 'err'; showSync(); });
  } catch (err) { syncState = 'err'; showSync(); }
}

function home() {
  view = { screen: 'home' };
  const all = data.chapters.map(stats);
  const t = all.reduce((a, s) => ({ ok: a.ok + s.ok, bad: a.bad + s.bad, done: a.done + s.done, total: a.total + s.total }), { ok: 0, bad: 0, done: 0, total: 0 });
  app.innerHTML = `
    <h1>Охрана труда: руководители и специалисты</h1>
    <div class="muted">Строительные организации · ${data.chapters.length} глав · ${t.total} вопросов</div>
    <div class="card total">
      <div class="nums"><span><b>${t.done}</b> из ${t.total} пройдено (${Math.round(t.done / t.total * 100)}%)</span>
      <span class="muted">верно ${t.ok} · с ошибкой ${t.bad} · осталось ${t.total - t.done}</span></div>
      ${bar(t)}
    </div>
    ${data.chapters.map((c, i) => { const s = all[i]; return `
      <button class="card ch" data-c="${i}">
        <div class="row"><span class="t"><span class="num">${c.id}.</span>${esc(c.title)}</span><span class="c">${s.done} из ${s.total}</span></div>
        ${bar(s)}
      </button>`; }).join('')}
    <p class="sync" id="sync"></p>`;
  showSync();
  app.querySelectorAll('.ch').forEach(b => b.onclick = () => chapter(data.chapters[+b.dataset.c]));
  scrollTo(0, 0);
}

function chapter(c) {
  view = { screen: 'chapter', c };
  const s = stats(c);
  app.innerHTML = `
    <div class="top"><button class="btn" id="back">← Все главы</button><span id="resetBox"><button class="link" id="reset">Сбросить прогресс главы</button></span></div>
    <div class="card">
      <h2>${c.id}. ${esc(c.title)}</h2>
      <div class="muted" style="margin:6px 0 10px">${s.done} из ${s.total} пройдено · верно ${s.ok} · с ошибкой ${s.bad}</div>
      ${bar(s)}
      <div class="modes">
        <button class="btn primary" id="mNext" ${s.done === s.total ? 'disabled' : ''}>${s.done ? 'Продолжить' : 'Начать'}</button>
        <button class="btn" id="mBad" ${s.bad ? '' : 'disabled'}>Только ошибки (${s.bad})</button>
        <button class="btn" id="mRand">Все вопросы вперемешку</button>
      </div>
      <div class="hint">Карта вопросов: нажмите на номер, чтобы открыть вопрос</div>
      <div class="map">${c.qs.map((q, i) => { const p = prog[key(c, q.n)]; return `<button class="${p ? p.s : ''}" data-i="${i}">${q.n}</button>`; }).join('')}</div>
    </div>`;
  document.getElementById('back').onclick = home;
  // Подтверждение прямо на странице: на сайте браузерные окна confirm() не показываются.
  document.getElementById('reset').onclick = () => {
    const box = document.getElementById('resetBox');
    box.innerHTML = '<span class="confirm">Сбросить главу? <button class="btn danger" id="resetYes">Сбросить</button><button class="btn" id="resetNo">Отмена</button></span>';
    document.getElementById('resetYes').onclick = () => { c.qs.forEach(q => delete prog[key(c, q.n)]); save(); chapter(c); };
    document.getElementById('resetNo').onclick = () => chapter(c);
  };
  const idx = f => c.qs.map((q, i) => i).filter(i => f(prog[key(c, c.qs[i].n)]));
  document.getElementById('mNext').onclick = () => run(c, idx(p => !p), 'Новые вопросы');
  document.getElementById('mBad').onclick = () => run(c, shuffle(idx(p => p && p.s === 'b')), 'Работа над ошибками');
  document.getElementById('mRand').onclick = () => run(c, shuffle(c.qs.map((q, i) => i)), 'Вперемешку');
  app.querySelectorAll('.map button').forEach(b => b.onclick = () => run(c, c.qs.map((q, i) => i), 'По порядку', +b.dataset.i));
  scrollTo(0, 0);
}

function run(c, order, mode, start) {
  view = { screen: 'quiz', c, order, mode, pos: start || 0, right: 0, answered: 0 };
  question();
}

// Если верных пунктов несколько, они идут одним вариантом. Неверные варианты содержат столько же
// пунктов, включая хотя бы один ложный. Подбираем набор, где варианты близки по длине, а каждый
// пункт встречается примерно одинаково часто, чтобы верный нельзя было угадать по повторам.
function buildOptions(q) {
  if (q.a.length === 1) return shuffle([{ parts: q.a, ok: true }].concat(q.w.map(t => ({ parts: [t], ok: false }))));
  const k = q.a.length, pool = q.a.concat(q.w), size = parts => parts.join('').length;
  const target = size(q.a);
  let best = null, bestScore = Infinity;
  for (let t = 0; t < 400; t++) {
    const wrong = [], seen = new Set();
    while (wrong.length < 3) {
      const parts = shuffle(pool).slice(0, k), id = parts.slice().sort().join('|');
      if (seen.has(id) || parts.every(p => q.a.includes(p))) continue;
      seen.add(id); wrong.push(parts);
    }
    const uses = new Map(pool.map(p => [p, 0]));
    q.a.concat(...wrong).forEach(p => uses.set(p, uses.get(p) + 1));
    const mean = (k * 4) / pool.length;
    const balance = [...uses.values()].reduce((s, n) => s + (n - mean) ** 2, 0);
    const length = wrong.reduce((s, parts) => s + Math.abs(size(parts) - target) / target, 0);
    // Верный вариант не должен выделяться тем, что он самый длинный.
    const longest = wrong.every(parts => size(parts) < target) ? 10 : 0;
    const score = balance * 4 + length * 16 + longest;
    if (score < bestScore) { bestScore = score; best = wrong; }
  }
  return shuffle([{ parts: shuffle(q.a), ok: true }].concat(best.map(parts => ({ parts, ok: false }))));
}

function question() {
  const { c, order, mode, pos } = view;
  if (pos >= order.length) return finish();
  const q = c.qs[order[pos]];
  const opts = buildOptions(q);
  Object.assign(view, { q, opts, picked: new Set(), checked: false });
  const s = stats(c);
  app.innerHTML = `
    <div class="top"><button class="btn" id="back">← К главе</button><span class="muted">${esc(mode)}: ${pos + 1} из ${order.length}</span></div>
    <div class="muted" style="margin-bottom:6px">${c.id}. ${esc(c.title)} — пройдено ${s.done} из ${s.total}</div>
    <div style="margin-bottom:14px">${bar(s)}</div>
    <div class="card">
      <div class="muted">Вопрос № ${q.n}</div>
      <div class="q">${esc(q.q)}</div>
      ${q.img ? `<img class="sign" src="${q.img}" alt="Знак безопасности к вопросу ${q.n}">` : ''}
      <div class="hint">Выберите один вариант</div>
      <div id="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span>${o.parts.length > 1 ? `<ul class="parts">${o.parts.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : `<span>${esc(o.parts[0])}</span>`}</button>`).join('')}</div>
      <div id="result"></div>
      <div class="actions" id="actions">
        <button class="btn" id="skip">Пропустить</button>
        <button class="btn primary" id="check" disabled>Ответить</button>
      </div>
    </div>`;
  document.getElementById('back').onclick = () => chapter(c);
  document.getElementById('skip').onclick = next;
  document.getElementById('check').onclick = check;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => toggle(+b.dataset.i));
  scrollTo(0, 0);
}

function toggle(i) {
  if (view.checked) return;
  view.picked = new Set([i]);
  app.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', view.picked.has(+b.dataset.i)));
  document.getElementById('check').disabled = !view.picked.size;
}

function check() {
  if (view.checked || !view.picked.size) return;
  view.checked = true;
  const { c, q, opts, picked } = view;
  const good = opts.every((o, i) => o.ok === picked.has(i));
  const k = key(c, q.n);
  prog[k] = { s: good ? 'o' : 'b', n: (prog[k] ? prog[k].n : 0) + 1 };
  view.answered++; if (good) view.right++;
  save();
  app.querySelectorAll('.opt').forEach(b => {
    const i = +b.dataset.i, o = opts[i]; b.disabled = true; b.classList.remove('sel');
    if (o.ok && picked.has(i)) b.classList.add('right');
    else if (o.ok) b.classList.add('missed');
    else if (picked.has(i)) b.classList.add('wrong');
    b.querySelector('.k').textContent = o.ok && picked.has(i) ? '✓' : picked.has(i) ? '✕' : o.ok ? '✓' : i + 1;
  });
  const refs = (q.ref.match(/Л\d+/g) || []).filter((x, i, a) => a.indexOf(x) === i).map(x => c.legend[x]).filter(Boolean);
  document.getElementById('result').innerHTML = `
    <div class="res ${good ? 'o' : 'b'}">${good ? 'Верно' : 'Неверно — правильный ответ отмечен зелёным'}</div>
    ${q.ref ? `<div class="ref">Основание: ${esc(q.ref)}${refs.length ? ' — ' + esc(refs.join('; ')) : ''}</div>` : ''}`;
  document.getElementById('actions').innerHTML = `<span></span><button class="btn primary" id="nextBtn">Дальше →</button>`;
  document.getElementById('nextBtn').onclick = next;
  document.getElementById('nextBtn').focus();
}

function next() { view.pos++; question(); }

function finish() {
  const { c, right, answered } = view;
  const s = stats(c);
  app.innerHTML = `
    <div class="card done">
      <h2>Серия завершена</h2>
      <p>Верно ${right} из ${answered} ${plural(answered, 'ответа', 'ответов', 'ответов')}</p>
      <p class="muted">Глава «${esc(c.title)}»: пройдено ${s.done} из ${s.total}, с ошибкой ${s.bad}</p>
      <div style="margin:14px 0">${bar(s)}</div>
      <button class="btn primary" id="toCh">К главе</button> <button class="btn" id="toHome">Все главы</button>
    </div>`;
  document.getElementById('toCh').onclick = () => chapter(c);
  document.getElementById('toHome').onclick = home;
}

document.addEventListener('keydown', e => {
  if (view.screen !== 'quiz' || !view.opts || e.ctrlKey || e.altKey || e.metaKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= view.opts.length && !view.checked) { toggle(n - 1); return; }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (view.checked) next(); else check();
  }
});

data = window.QUESTIONS;
prog = loadProgress();
persistLocal();
home();
connectCloud();
</script>
</body>
