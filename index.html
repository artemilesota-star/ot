ение работ с повышенной опасностью согласно Закону Республики Беларусь \"Об охране труда\"?", "ref": "Л70 Ст.1", "a": ["Мероприятия по подготовке к выполнению работ, безопасному выполнению работ", "Наименование работ, место, сроки и время их выполнения", "Состав исполнителей работ, лицо (лиц), ответственное (ответственных) за подготовку работ, лицо (лиц), ответственное (ответственных) за безопасное выполнение работ"], "w": ["Размер доплаты исполнителям за работы с повышенной опасностью", "Перечень средств индивидуальной защиты, выдаваемых исполнителям сверх установленных норм", "Порядок материальной ответственности исполнителей за сохранность оборудования"]}, {"n": 2, "q": "Какие работы должны выполняться по наряду-допуску на выполнение работ с повышенной опасностью?", "ref": "Л14 п.93, Л70 Ст.36", "a": ["Работы с повышенной опасностью, требующие осуществления специальных организационных, технических мероприятий и контроля за их выполнением"], "w": ["Все работы, выполняемые на высоте и в охранных зонах, независимо от наличия специальных мероприятий", "Работы с повышенной опасностью, выполняемые работающими, имеющими стаж по профессии менее одного года", "Работы с повышенной опасностью, выполняемые только силами сторонних организаций на территории нанимателя"]}, {"n": 3, "q": "Что при необходимости может прилагаться к наряду-допуску на выполнение работ повышенной опасности?", "ref": "Л14 п.95, Л70 Ст.36", "a": ["Эскизы защитных устройств и приспособлений, схемы расстановки постов оцепления, установки знаков и плакатов безопасности, а также иные документы"], "w": ["Копии удостоверений по охране труда и медицинских справок всех исполнителей, а также журнал инструктажа", "Выписка из журнала регистрации инструктажа и письменное согласие исполнителей на выполнение работ", "Копия приказа о назначении ответственных лиц и должностная инструкция руководителя работ, а также иные документы"]}, {"n": 4, "q": "При выполнении какого условия может быть выдан наряд-допуск на выполнение работ в охранных зонах объектов газораспределительной системы, электрических и тепловых сетей, магистральных трубопроводов?", "ref": "Л14 п.96", "a": ["При наличии соответствующего разрешения на их проведение"], "w": ["При наличии письменного уведомления организации, эксплуатирующей эти объекты, направленного за сутки", "При наличии у руководителя работ группы по электробезопасности не ниже III", "При наличии согласования с территориальным органом Департамента государственной инспекции труда"]}, {"n": 5, "q": "Кто в организации имеет право выдавать наряд-допуск на выполнение работ повышенной опасности?", "ref": "Л14 п.97", "a": ["Лица, включенные в утвержденный приказом нанимателя перечень уполномоченных должностных лиц нанимателя, имеющих право выдачи наряда-допуска"], "w": ["Руководитель работ и производитель работ, прошедшие проверку знаний по вопросам охраны труда", "Специалист по охране труда либо лицо, на которое возложены его обязанности", "Руководители структурных подразделений без дополнительного оформления полномочий"]}, {"n": 6, "q": "В каком количестве экземпляров в общем случае оформляется наряд-допуск на выполнение работ с повышенной опасностью, если иное не предусмотрено нормативными правовыми актами?", "ref": "Л14 п.98", "a": ["В двух экземплярах"], "w": ["В одном экземпляре", "В трёх экземплярах", "В четырёх экземплярах"]}, {"n": 7, "q": "Где должны находиться экземпляры наряда-допуска на выполнение работ с повышенной опасностью во время работы в общем случае, если иное не предусмотрено нормативными правовыми актами?", "ref": "Л14 п.98", "a": ["Первый - у лица, выдавшего наряд-допуск, второй - у руководителя работ"], "w": ["Первый - у руководителя работ, второй - у производителя работ", "Первый - у специалиста по охране труда, второй - у руководителя работ", "Оба - у лица, выдавшего наряд-допуск, а у руководителя работ - копия"]}, {"n": 8, "q": "В каком количестве экземпляров оформляется наряд-допуск на выполнение работ повышенной опасности при производстве работ работающими одной организации на территории другой организации?", "ref": "Л14 п.99", "a": ["В трех экземплярах"], "w": ["В двух экземплярах", "В четырёх экземплярах", "В пяти экземплярах"]}, {"n": 9, "q": "На какой срок выдается наряд-допуск на производство работ с повышенной опасностью?", "ref": "Л14 п.100", "a": ["На срок, необходимый для выполнения работ"], "w": ["Не более чем на 15 календарных дней", "Только на одну рабочую смену", "Не более чем на 30 календарных дней"]}, {"n": 10, "q": "В каких случаях допускается проведение работ с повышенной опасностью без оформления наряда-допуска, если эти работы включены в утвержденный руководителем организации перечень работ, выполняемых по наряду-допуску?", "ref": "Л14 п.102", "a": ["При ликвидации аварий до устранения прямой угрозы травмирования людей"], "w": ["При выполнении работ в выходные и праздничные дни, когда лицо, выдающее наряд-допуск, отсутствует", "При работах продолжительностью менее одной смены под контролем руководителя работ", "При выполнении срочных работ по распоряжению руководителя организации до конца смены"]}, {"n": 11, "q": "Где должны находиться экземпляры нарядов-допусков на выполнение работ с повышенной опасностью при производстве работ на территории организации работающими других сторонних организаций, если иное не предусмотрено обязательными для соблюдения техническими нормативными правовыми актами?", "ref": "Л14 п.103", "a": ["Первый - у лица, выдавшего наряд-допуск, второй - у руководителя работ, третий - у уполномоченного должностного лица организации, на территории которой производятся работы"], "w": ["Первый - у производителя работ, второй - у специалиста по охране труда организации, третий - у руководителя работ", "Первый - у лица, выдавшего наряд-допуск, второй - у руководителя работ, третий - у специалиста по охране труда сторонней организации", "Первый и второй - у руководителя работ сторонней организации, третий - у руководителя организации, на территории которой производятся работы"]}, {"n": 12, "q": "Как следует поступить при обнаружении несоответствия фактического состояния условий производства работ требованиям безопасности, предусмотренным нарядом-допуском?", "ref": "Л14 п.105", "a": ["Работы прекратить, наряд-допуск изъять и возвратить лицу, его выдавшему. К прерванным работам можно приступать только после устранения недостатков и получения нового наряда-допуска"], "w": ["Работы приостановить, внести исправления в наряд-допуск и продолжить работы после устранения недостатков с разрешения руководителя работ без оформления нового наряда-допуска", "Работы продолжить, сообщив о несоответствии лицу, выдавшему наряд-допуск, и сделав запись о нём в наряде-допуске. К устранению недостатков приступить после окончания смены", "Работы прекратить, наряд-допуск оставить у руководителя работ. К прерванным работам можно приступать после устранения недостатков и повторного инструктажа исполнителей"]}]}, {"id": 9, "title": "ОТ при эксплуатации автомобилей", "legend": {"Л1": "ПРАВИЛА по охране труда при эксплуатации автомобильного и городского электрического транспорта (Утв. пост. Министерства труда и социальной защиты РБ и Министерства транспорта и коммуникаций РБ от 06.12.2022 № 78/104)"}, "qs": [{"n": 1, "q": "С чем должен быть ознакомлен водитель автомобиля перед выездом в рейс?", "ref": "Л1 п.10", "a": ["С метеорологическими условиями по маршруту его движения и особенностями перевозимого груза"], "w": ["С техническим состоянием транспортного средства по данным последнего технического обслуживания и нормами расхода топлива", "С расписанием работы контрольных пунктов и порядком оформления путевого листа по маршруту", "С графиком сменности и порядком оплаты сверхурочных работ при задержке в рейсе"]}, {"n": 2, "q": "Для осмотра транспортного средства при подготовке к выезду в темное время суток используются переносные электрические светильники напряжением не выше …", "ref": "Л1 п.11", "a": ["... 12 В"], "w": ["... 24 В", "... 42 В", "... 36 В"]}, {"n": 3, "q": "В каком случае проверку технического состояния транспортных средств и их агрегатов при выпуске на линию и возвращении с линии допускается проводить при работающем двигателе?", "ref": "Л1 п.13", "a": ["При опробовании тормозной системы"], "w": ["При проверке уровня масла и охлаждающей жидкости", "При осмотре ходовой части и рулевого управления", "При проверке натяжения приводных ремней"]}, {"n": 4, "q": "Как осуществлять запуск двигателя транспортного средства путем его буксировки другим транспортным средством?", "ref": "Л1 п.21", "a": ["Никак. Запуск двигателя таким способом не допускается"], "w": ["Только при исправной тормозной системе и на жёсткой сцепке", "С помощью гибкой сцепки на скорости не более 10 км/ч на территории организации", "Только с разрешения механика и при наличии второго водителя в буксируемом транспортном средстве"]}, {"n": 5, "q": "Какие мелкие технические неисправности (неполадки), возникшие во время работы на маршруте движения (линии), могут устраняться водителем на линии?", "ref": "Л1 п.73", "a": ["Неисправности, перечень которых установлен нанимателем"], "w": ["Любые неисправности, не требующие применения подъёмных механизмов", "Неисправности, устранение которых занимает не более 30 минут", "Только неисправности, перечень которых указан в путевом листе механиком при выпуске на линию"]}, {"n": 6, "q": "Что необходимо предпринять в случае обнаружения утечки газа при работе транспортного средства с газобаллонным оборудованием на линии?", "ref": "Л1 п.91", "a": ["Немедленно остановить транспортное средство, заглушить двигатель, закрыть все вентили, по возможности принять меры к устранению неисправности и сообщить работодателю"], "w": ["Продолжить движение на малой скорости до ближайшей станции технического обслуживания и сообщить работодателю о неисправности", "Остановить транспортное средство, не глуша двигатель, стравить газ из баллонов и сообщить в аварийную газовую службу", "Перевести двигатель на бензин, закрыв только магистральный вентиль, и продолжить рейс, сообщив работодателю после возвращения"]}, {"n": 7, "q": "В каких случаях допускается участие водителей в выполнении работ по техническому обслуживанию и ремонту транспортных средств?", "ref": "Л1 п.117", "a": ["При соответствии квалификации водителя выполняемым работам и прохождении им в установленном порядке обучения, стажировки, инструктажа и проверки знаний по вопросам охраны труда"], "w": ["При отсутствии в организации ремонтных рабочих и по письменному распоряжению механика без прохождения дополнительного обучения", "При наличии у водителя стажа управления транспортным средством не менее трёх лет и прохождении им вводного инструктажа", "В любых случаях, если ремонтируется закреплённое за водителем транспортное средство"]}, {"n": 8, "q": "При какой массе узлов и агрегатов транспортных средств для их снятия и установки необходимо пользоваться подъемно-транспортными механизмами, оборудованными специальными приспособлениями (захватами)?", "ref": "Л1 п.124", "a": ["15 кг"], "w": ["10 кг", "20 кг", "25 кг"]}, {"n": 9, "q": "Допускается ли пользоваться открытым огнем, переносными горнами, паяльными лампами в процессе выполнения работ по ТО и Р транспортных средств в помещениях, где хранятся или используются горючие и легковоспламеняющиеся материалы или жидкости?", "ref": "Л1 п.126", "a": ["Не допускается"], "w": ["Допускается при наличии разрешения на проведение огневых работ", "Допускается при наличии поблизости первичных средств пожаротушения", "Допускается при работающей вентиляции и удалении не менее 5 м от материалов"]}, {"n": 10, "q": "Как убирается рабочее место от пыли, мусора и отходов производства (опилки, стружка и др.) в организации, эксплуатирующей автомобильный или городской электрический транспорт?", "ref": "Л1 п.131", "a": ["Щеткой"], "w": ["Сжатым воздухом", "Струёй воды", "Руками в перчатках"]}, {"n": 11, "q": "Как закрепляется от случайного перемещения транспортное средство, установленное на пост технического обслуживания и ремонта?", "ref": "Л1 п.133", "a": ["Путем установки не менее двух противооткатных упоров с обеих сторон колеса"], "w": ["Путём включения стояночного тормоза и низшей передачи без установки упоров", "Путём установки одного противооткатного упора под переднее колесо", "Путём установки не менее двух противооткатных упоров с одной стороны колёс задней оси"]}, {"n": 12, "q": "Кому допускается находиться внутри транспортного средства в процессе подъема или опускания транспортного средства грузоподъемным механизмом?", "ref": "Л1 п.175", "a": ["Никому"], "w": ["Только водителю транспортного средства", "Механику, контролирующему подъём", "Водителю при наличии ремня безопасности"]}, {"n": 13, "q": "Неиспользуемые более одной рабочей смены осмотровые канавы должны ...", "ref": "Л1 п.186", "a": ["... перекрываться"], "w": ["... освещаться", "... ограждаться сигнальной лентой", "... заполняться песком"]}, {"n": 14, "q": "Требуется ли оборудовать средствами фиксации в открытом положении ворота помещений для хранения (стоянки) транспортных средств?", "ref": "Л1 п.232", "a": ["Требуется"], "w": ["Требуется только для ворот с электроприводом", "Не требуется, если ворота открываются внутрь помещения", "Не требуется при наличии в помещении охраны"]}]}, {"id": 10, "title": "ОТ при работе на высоте", "legend": {"Л1": "ПРАВИЛА по охране труда при выполнении работ на высоте (утв. Пост. Министерства труда и социальной защиты РБ 06.02.2025 № 11)"}, "qs": [{"n": 1, "q": "Работающий выполняет работы на расстоянии менее 2 м от не огражденного перепада по высоте. Начиная с какой величины этого перепада по высоте данные работы будут считаться работами на высоте?", "ref": "Л1 п. 4", "a": ["1,8 м"], "w": ["1,3 м", "2,0 м", "1,5 м"]}, {"n": 2, "q": "Работающий выполняет работу недалеко от не огражденного перепада по высоте 1,8 м и более. На каком минимальном расстоянии от этого перепада по высоте он может работать, чтобы данная работа не относилась к работам на высоте?", "ref": "Л1 п. 4", "a": ["2 м"], "w": ["1,5 м", "3 м", "1 м"]}, {"n": 3, "q": "Что из указанного ниже относится к основным причинами падения работающих с высоты?", "ref": "Л1 п. 9", "a": ["Отсутствие ограждений, средств индивидуальной защиты от падения с высоты (систем обеспечения безопасности работ на высоте), ненадежность их крепления, недостаточная прочность и устойчивость средств подмащивания, их настилов", "Недостатки в подготовке проектной и (или) технологической документации", "Нарушение технологии ведения работ"], "w": ["Наличие у работающего стажа работы на высоте менее трёх лет при пройденной проверке знаний", "Применение средств подмащивания заводского изготовления вместо изготовленных по месту работ", "Прохождение работающим обучения и проверки знаний по вопросам охраны труда в установленном порядке"]}, {"n": 4, "q": "Что из указанного ниже относится к основным причинами падения работающих с высоты?", "ref": "Л1 п. 9", "a": ["Потеря самообладания", "Нарушение координации движений, неосторожные действия, небрежное выполнение работы", "Неблагоприятные погодные условия"], "w": ["Выполнение работ в составе бригады из двух и более работающих", "Использование страховочной системы с амортизатором вместо страховочного каната", "Применение работающим исправной удерживающей системы, закреплённой к анкерному устройству"]}, {"n": 5, "q": "В каком случае работы на высоте на открытом воздухе, в том числе в безопорном пространстве, за исключением работ по предотвращению аварийных ситуаций, должны быть прекращены?", "ref": "Л1 п. 10", "a": ["При грозе или тумане, снегопаде, исключающем видимость в пределах фронта работ", "При гололеде с обледенелых конструкций", "В случаях нарастания стенки гололеда на проводах, оборудовании, инженерных конструкциях (в том числе опорах линий электропередачи), деревьях"], "w": ["При температуре воздуха ниже 0 °С независимо от видимости", "При скорости ветра более 5 м/с независимо от вида работ", "При окончании смены, если работы выполняются на открытом воздухе в дневное время"]}, {"n": 6, "q": "При каком условии допускается выполнять работы по предотвращению аварийных ситуаций на высоте на открытом воздухе при грозе или тумане, снегопаде, исключающем видимость в пределах фронта работ, а также при гололеде с обледенелых конструкций и в случаях нарастания стенки гололеда на проводах, оборудовании, инженерных конструкциях, деревьях?", "ref": "Л1 п. 10", "a": ["Если определяются меры и условия, обеспечивающие безопасное проведение работ"], "w": ["Если работы выполняются работающими со стажем работы на высоте не менее пяти лет", "Если получено письменное разрешение органа государственного надзора", "Если работы продолжаются не более одного часа с использованием страховочных систем"]}, {"n": 7, "q": "Допускаются ли к работам на высоте работающие, не использующие необходимые средства индивидуальной защиты от падения с высоты (системы обеспечения безопасности работ на высоте)?", "ref": "Л1 п. 14", "a": ["Не допускаются"], "w": ["Допускаются на высоте до 5 м при наличии ограждений", "Допускаются под контролем руководителя работ", "Допускаются при кратковременных работах длительностью до 30 минут"]}, {"n": 8, "q": "Как (на основании оценки профессиональных рисков) необходимо поступить с работами на высоте, требующими осуществления специальных организационных, технических мероприятий и контроля за их выполнением?", "ref": "Л1 п. 17", "a": ["Включить их в перечень работ, выполняемых по наряду-допуску на выполнение работ с повышенной опасностью и выполнять по наряду-допуску"], "w": ["Выполнять их по устному распоряжению руководителя работ с записью в журнале целевых инструктажей, а наряд-допуск оформлять только на перепадах свыше 5 м", "Включить их в технологическую карту и выполнять без наряда-допуска при условии проведения целевого инструктажа и применения страховочных систем", "Запретить их выполнение силами организации и передать по договору подряда сторонней организации, имеющей аттестат соответствия"]}, {"n": 9, "q": "Какие работы на высоте, требующие осуществления специальных организационных, технических мероприятий и контроля за их выполнением, допускается не включать в перечень работ, выполняемых по наряду-допуску на работы с повышенной опасностью?", "ref": "Л1 п. 17", "a": ["Периодически повторяющиеся работы на высоте, являющиеся неотъемлемой частью действующего технологического процесса и (или) характеризующиеся постоянством места, условий и характера работ, применением средств коллективной защиты, определенным и постоянным составом исполнителей"], "w": ["Разовые работы на высоте малой продолжительности (до одной смены), выполняемые на перепадах до 5 м опытными работающими со стажем не менее трёх лет при наличии страховочных систем и целевого инструктажа", "Любые работы на высоте в производственных помещениях, если они выполняются в дневное время с применением средств подмащивания заводского изготовления и определённым составом исполнителей", "Работы на высоте в охранных зонах сооружений и коммуникаций, выполняемые по согласованию с организацией, эксплуатирующей эти объекты, с применением средств индивидуальной защиты"]}, {"n": 10, "q": "Проектная и технологическая документация, разрабатываемая на этапе организации работ на высоте, должна содержать описание безопасных методов выполнения технологических операций, в том числе:", "ref": "Л1 п. 20", "a": ["Методы и описание технологической последовательности производства работ на высоте", "Пути и устройства подъема или спуска работающих к рабочим местам или местам производства работ", "Применяемые средства индивидуальной защиты от падения с высоты (системы обеспечения безопасности работ на высоте), места и способы их крепления"], "w": ["Сведения об оплате труда работающих на высоте и размере надбавок за работу в условиях повышенной опасности", "Список работающих с указанием их медицинских заключений и личных данных о состоянии здоровья", "Перечень организаций, поставляющих средства индивидуальной защиты, с указанием их стоимости"]}, {"n": 11, "q": "В проектной и (или) технологической документации на выполнение работ на высоте предусматриваются дополнительные решения по охране труда при:", "ref": "Л1 п. 21", "a": ["Совмещении работ по одной вертикали", "Работах в условиях работающего производства", "Работах вблизи сооружений, коммуникаций, работающих установок"], "w": ["Выполнении работ в первую смену при естественном освещении", "Применении средств подмащивания заводского изготовления, прошедших освидетельствование", "Наличии у всех работающих стажа работы на высоте более одного года"]}, {"n": 12, "q": "Что из указанного ниже следует определить на этапе организации работ на высоте в мероприятиях по предотвращению аварийных ситуаций, с учетом видов и способов выполнения работ на высоте?", "ref": "Л1 п. 22", "a": ["Порядок принятия решения об остановке работ", "Методы и способы экстренной связи с руководителем работ и профессиональными аварийно-спасательными службами, органами и подразделениями по чрезвычайным ситуациям", "Местоположение аптечек первой помощи универсальных и иных необходимых средств для оказания первой помощи потерпевшим"], "w": ["Размер материальной ответственности работающих за повреждённое при аварии имущество", "Порядок проведения служебной проверки и привлечения виновных к дисциплинарной ответственности", "График предоставления отпусков работникам, занятым на работах на высоте"]}, {"n": 13, "q": "Как работающие должны быть ознакомлены с разработанными мероприятиями по предотвращению аварийных ситуаций при выполнении работ на высоте, указанными в технологической и (или) проектной документации, наряде-допуске?", "ref": "Л1 п. 23", "a": ["Под подпись"], "w": ["Устно на целевом инструктаже без подписи", "Путём размещения мероприятий на информационном стенде", "Письменным уведомлением, направляемым через отдел кадров"]}, {"n": 14, "q": "Какие из указанных ниже должностных лиц должны быть назначены для организации и обеспечения безопасности труда при выполнении рабо ы от падения с высоты, систем обеспечения безопасности работ на высоте?", "ref": "Л1 п. 24", "a": ["Входит"], "w": ["Не входит, это обязанность самих работающих", "Входит только осмотр, проверку исправности проводит изготовитель", "Не входит, это обязанность специалиста по охране труда"]}, {"n": 17, "q": "Допускается ли выполнение одним и тем же должностным лицом обязанностей лица, имеющего право выдачи наряда-допуска на производство работ на высоте и руководителя работ на высоте?", "ref": "Л1 п. 24", "a": ["Не допускается"], "w": ["Допускается в организациях численностью до 15 человек", "Допускается при наличии приказа руководителя организации", "Допускается при работах на перепадах высотой менее 5 м"]}, {"n": 18, "q": "В перечень работ, выполняемых по наряду-допуску, с учетом оценки профессиональных рисков включаются работы на высоте, выполняемые на рабочих местах, расположенных на расстоянии менее 2 м от перепадов по высоте 5 м и более, неограждённых или ...", "ref": "Л1 п. 25", "a": ["... с высотой ограждения менее 1,0 м"], "w": ["... с высотой ограждения менее 1,1 м", "... с высотой ограждения менее 1,2 м", "... с высотой ограждения менее 0,8 м"]}, {"n": 19, "q": "Какие из указанных ниже работ на высоте (с учетом оценки профессиональных рисков) следует включать в перечень работ, выполняемых по наряду-допуску?", "ref": "Л1 п. 25", "a": ["Работы в охранных зонах сооружений или коммуникаций", "Работы на крыше зданий и сооружений с применением трапов, а также работ, относящихся к работам на высоте", "Работы над машинами или механизмами, поверхностью воды (жидкости) или сыпучих мелкодисперсных материалов, выступающими предметами"], "w": ["Работы на средствах подмащивания с ограждениями высотой 1,1 м на расстоянии более 2 м от перепада высоты", "Работы по очистке оборудования на полу цеха на расстоянии более 2 м от неогражденного перепада высоты", "Работы на полу помещения с ограждёнными перепадами на расстоянии более 2 м от их границы"]}, {"n": 20, "q": "Кем проводи и натяжении проводов?", "ref": "Л1 п. 66", "a": ["Не допускается"], "w": ["Допускается при условии закрепления верхней части лестницы", "Допускается при напряжении проводов до 1000 В", "Допускается, если лестницу удерживает второй работающий"]}, {"n": 53, "q": "В каком случае необходимо применять страховочную систему, прикрепляемую к конструкции сооружения или к лестнице (при условии закрепления приставной лестницы к конструкции здания или сооружения)?", "ref": "Л1 п. 68", "a": ["При работе на высоте более 1,8 м"], "w": ["При работе на высоте более 1,3 м", "При работе на высоте более 2,5 м", "При работе на высоте более 5 м"]}, {"n": 54, "q": "Применяемые средства индивидуальной защиты от падения с высоты, компоненты, элементы, подсистемы систем обеспечения безопасности работ на высоте должны быть исправны. Когда работающий должен осматривать их на предмет отсутствия неисправностей?", "ref": "Л1 п. 80", "a": ["До и после каждого их использования"], "w": ["Только до начала их использования один раз в смену", "Только в сроки периодических осмотров, установленные приказом", "Только после каждого их использования при сдаче на хранение"]}, {"n": 55, "q": "Как производится допуск работающих к выполнению работ на крышах зданий, сооружений, относящихся к работам на высоте?", "ref": "Л1 п. 130", "a": ["В соответствии с нарядом-допуском"], "w": ["В соответствии с устным распоряжением руководителя работ", "В соответствии с записью в журнале проведения целевых инструктажей", "В соответствии с графиком работ, утверждённым главным инженером"]}]}, {"id": 11, "title": "Инструмент слесарно-монтажный", "legend": {"Л1": "Типовая инструкция по охране труда при выполнении работ с применением слесарно-монтажного инструмента (утв. пост. Минтруда РБ 30.09.2016 г. № 52)"}, "qs": [{"n": 1, "q": "Кто допускается к выполнению работ с применением слесарно-монтажного инструмента?", "ref": "Л1 п. 2", "a": ["Работающие, прошедшие в случаях и порядке, установленных законодательством, медицинский осмотр, инструктаж по вопросам охраны труда"], "w": ["Работающие, имеющие стаж работы по профессии не менее одного года и прошедшие целевой инструктаж", "Только работающие, имеющие квалификационный разряд не ниже третьего и группу по электробезопасности не ниже II", "Работающие, достигшие 21 года и прошедшие в установленном порядке обучение на право работы с инструментом"]}, {"n": 2, "q": "Что необходимо проверить перед началом работы с применением слесарно-монтажного инструмента вблизи токоведущих, находящихся под напряжением или движущихся частей оборудования и механизмов?", "ref": "Л1 п. 10", "a": ["Наличие и исправность ограждений, других средств коллективной защиты"], "w": ["Наличие наряда-допуска и записи о проведённом целевом инструктаже", "Наличие бирки с датой последней проверки на каждом инструменте", "Отсутствие напряжения на всех токоведущих частях при помощи индикатора"]}, {"n": 3, "q": "Допускается ли при работе с ручным слесарно-монтажным инструментом, выполнять работу, если безопасные методы и приемы работы ее выполнения работающему неизвестны?", "ref": "Л1 п. 13.3", "a": ["Не допускается"], "w": ["Допускается под наблюдением другого работника", "Допускается, если работа не относится к работам с повышенной опасностью", "Допускается с разрешения непосредственного руководителя"]}, {"n": 4, "q": "Какой слесарно-монтажный инструмент должен применять работающий при работе вблизи токоведущих, находящихся под напряжением объектов?", "ref": "Л1 п.16", "a": ["Инструмент с изолируемыми рукоятками"], "w": ["Омеднённый искробезопасный инструмент", "Инструмент с деревянными рукоятками", "Инструмент с резиновыми накладками на рукоятках"]}, {"n": 5, "q": "Как необходимо переносить слесарно-монтажный инструмент при работе на высоте?", "ref": "Л1 п. 18", "a": ["В сумках, подсумках, закрепленных на предохранительном поясе"], "w": ["В карманах спецодежды, застёгнутых на клапан", "В руках при условии использования страховочного шнура", "В ящике, поднимаемом после подъёма работающего на верёвке"]}, {"n": 6, "q": "Какие меры безопасности необходимо предусмотреть при выполнении работ с применением инструмента ударного действия?", "ref": "Л1 п. 20", "a": ["Место работы оградить средствами коллективной защиты"], "w": ["Работать только в паре с другим работающим", "Выполнять работы только по наряду-допуску", "Работать только в диэлектрических перчатках"]}, {"n": 7, "q": "За чем необходимо следить при резке металла ручными ножовками?", "ref": "Л1 п.21", "a": ["Чтобы полотно было прочно закреплено и достаточно натянуто"], "w": ["Чтобы полотно было смазано маслом и свободно перемещалось в рамке", "Чтобы полотно имело зубья одного размера и было ослаблено перед резом", "Чтобы рез начинался у места закрепления заготовки при максимальном нажиме"]}, {"n": 8, "q": "При работе ножницами необходимо:", "ref": "Л1 п. 23", "a": ["Правильно затачивать режущие кромки"], "w": ["Удерживать нижнюю рукоятку ножниц ногой для увеличения усилия", "Использовать удлинитель рукоятки при резке толстого металла", "Придерживать разрезаемый лист руками без рукавиц"]}, {"n": 9, "q": "Как должны монтироваться и сниматься сменные элементы гаечных ключей?", "ref": "Л1 п. 27", "a": ["Усилием руки без ударов или применения дополнительных устройств"], "w": ["Лёгкими ударами молотка через деревянную подкладку", "С применением удлинительного рычага в заводском исполнении", "Усилием руки с последующим подстукиванием для плотной посадки"]}, {"n": 10, "q": "Что из указанного ниже НЕ допускается делать при работе гаечным ключом?", "ref": "Л1 п. 30", "a": ["Использовать дополнительные рычаги", "Удлинять гаечные ключи присоединением другого ключа или трубы", "Применять подкладки (металлические пластины) между гайкой (головкой болта) и зевом ключа"], "w": ["Применять ключи, размер зева которых соответствует размеру гайки", "Плавно нажимать на ключ без рывков", "Подбирать ключ по размеру гайки и осматривать его перед началом работы"]}, {"n": 11, "q": "Что необходимо делать при работе напильником?", "ref": "Л1 п.32", "a": ["Закреплять обрабатываемую деталь в тисках"], "w": ["Удерживать обрабатываемую деталь свободной рукой", "Сдувать опилки с детали и напильника ртом", "Очищать напильник от стружки голой рукой"]}]}, {"id": 12, "title": "Инструмент ручной электромеханический", "legend": {"Л5": "Типовая инструкция по охране труда при работе с ручным электромеханическим инструментом. (Утв. пост. Минтруда и соцзащиты РБ и Министерства энергетики РБ от 14.11.2017г. №70/44)", "Л3": "Инструкция о порядке обучения, стажировки, инструктажа и проверки знаний работающих по вопросам охраны труда (утв. пост. Минтруда и соцзащиты РБ от 28.11. 2008 № 175 в ред. пост. Минтруда и соцзащиты РБ от 02.09.2024 № 73)", "Л14": "Правила по охране труда (утв. пост. Минтруда и соцзащиты РБ от 01.07.2021 № 53, в ред. пост. Минтруда и соцзащиты РБ от 08.08.2025 № 75)"}, "qs": [{"n": 1, "q": "Допускается ли переносить электромеханический инструмент держа его за питающий кабель?", "ref": "Л14 п.161", "a": ["Не допускается"], "w": ["Допускается только при отключённом от сети инструменте", "Допускается для инструмента массой до 5 кг", "Допускается при наличии двойной изоляции кабеля"]}, {"n": 2, "q": "Какое требование предъявляется к спецодежде перед началом работы с электроинструментом?", "ref": "Л5 п.10.2", "a": ["Она должна быть застегнута на все пуговицы, застежки"], "w": ["Она должна быть на размер больше обычного и не стеснять движений", "Рукава должны быть закатаны выше локтя", "Она должна быть изготовлена из синтетической антистатической ткани"]}, {"n": 3, "q": "Что из перечисленного необходимо выполнить перед началом работы с электроинструментом?", "ref": "Л5 п.10.5, 10.6, 11, 12", "a": ["Убедиться в достаточном освещении рабочего места", "Проверить комплектность и надежность крепления деталей, отсутствие на них трещин, выбоин, заусенцев и прочих дефектов", "Осмотреть и проверить исправность электроинструмента и вспомогательного оборудования к нему", "Убедиться внешним осмотром в исправности кабеля (провода), его защитной трубки и штепсельной вилки, целостности изоляционных деталей корпуса, рукоятки и крышки щеткодержателей, защитных кожухов"], "w": ["Провести разборку электроинструмента и смазку щёточного узла", "Снять защитный кожух для проверки состояния рабочей части", "Отключить защитные устройства инструмента для проверки его работы под нагрузкой"]}, {"n": 4, "q": "Какие из нижеперечисленных требований безопасности предъявляются к электроинструменту?", "ref": "Л5 п.11, 13, 14", "a": ["Он должен быть исправен", "Он должен иметь исправный кабель (провод)", "Он не должен иметь трещин и других повреждений корпуса", "Он должен использоваться только по назначению", "Он должен иметь класс, который соответствует категории помещения и условиям использования в работе, с применением в отдельных случаях электрозащитных средств в зависимости от места проведения работ"], "w": ["Он должен иметь массу не более 5 кг независимо от вида выполняемых работ", "Он должен проверяться в специализированной организации перед каждым включением", "Он должен применяться независимо от категории помещения, если на нём есть заводская маркировка"]}, {"n": 5, "q": "Кто может выполнять подключение к электрической сети либо отключение от нее электроинструмента при помощи плоских втычных соединителей или штепсельных соединений, удовлетворяющих требованиям электробезопасности?", "ref": "Л5 п.16", "a": ["Работающий, допущенный к работе с этим оборудованием"], "w": ["Только электротехнический персонал с группой по электробезопасности не ниже III", "Только дежурный электромонтёр организации по заявке работающего", "Только лицо, ответственное за содержание электроинструмента в исправном состоянии"]}, {"n": 6, "q": "Что, из перечисленного, не допускается работающему с электроинструментом?", "ref": "Л5 п.18", "a": ["Подключать инструмент к распределительному устройству, если отсутствует безопасное штепсельное соединение", "Передавать электроинструмент другим работающим", "Разбирать электроинструмент, производить какой-либо ремонт", "Держаться за провод электроинструмента, касаться вращающихся частей или удалять стружку, опилки до полной остановки инструмента"], "w": ["Работать с инструментом, прошедшим периодическую проверку", "Пользоваться средствами индивидуальной защиты", "Отключать инструмент от сети при перерыве в работе"]}, {"n": 7, "q": "Какие требования безопасности, из перечисленных, необходимо соблюдать при выполнении работ с электроинструментом?", "ref": "Л5 п.20", "a": ["Предохранять от механических и других повреждений изоляцию кабеля (шнура) электроинструмента, провода от обрыва", "Не допускать натяжения и перекручивания кабеля (шнура), соприкосновение его с тросами, кабелями и рукавами для газовой сварки и резки металлов, металлическими, горячими, влажными и масляными поверхностями или предметами", "Убедиться перед включением электроинструмента, что обрабатываемая деталь, изделие надежно закреплены"], "w": ["Придерживать вращающуюся рабочую часть рукой в рукавице для точности обработки", "Прокладывать кабель через проходы, закрепляя его на горячих поверхностях", "Поддерживать кабель в натянутом состоянии для исключения его попадания под ноги"]}, {"n": 8, "q": "Что из перечисленного НЕ допускается работающему при работе с электроинструментом?", "ref": "Л5 п.18, 21", "a": ["Превышать предельно допустимую продолжительность непрерывной работы, указанную в эксплуатационных документах организации-изготовителя электроинструмента", "Касаться вращающихся частей или удалять стружку, опилки до полной остановки электроинструмента; держаться за провод электроинструмента", "Разбирать электроинструмент, производить самостоятельно какой-либо ремонт", "Переносить электроинструмент, держа его за кабель или рабочую часть", "Обрабатывать незакрепленную деталь, находящуюся на весу или свисающую с упора"], "w": ["Отключать электроинструмент от сети при внезапной остановке", "Проверять исправность инструмента перед началом работы", "Отключать электроинструмент от сети штепсельной вилкой при перерыве в работе"]}, {"n": 9, "q": "Что из перечисленного НЕ допускается работающему при работе с электроинструментом?", "ref": "Л5 п.18, 21", "a": ["Тормозить вращающуюся рабочую часть электроинструмента нажимом на нее каким-либо предметом или руками; снимать защитные ограждения", "Стоять во время работы на обрабатываемой поверхности изделия (материала)", "Пользоваться неисправным электроинструментом; удалять стружку, опилки до полной остановки электроинструмента", "Устанавливать рабочую часть в патрон электроинструмента и изымать ее из патрона, а также регулировать электроинструмент без отключения его от сети", "Работать у неогражденных или незакрытых люков и проемов"], "w": ["Отключать электроинструмент от сети штепсельной вилкой", "Надевать средства защиты органов зрения при работе с абразивным кругом", "Проверять перед работой надёжность закрепления обрабатываемой детали"]}, {"n": 10, "q": "При наличии каких неисправностей не допускается эксплуатация электроинструмента?", "ref": "Л5 п.23", "a": ["Повреждено штепсельное соединение, кабель или его защитная оболочка, крышка щеткодержателя", "Нечеткая работа выключателя, искрение щеток на коллекторе, сопровождающееся появлением кругового огня на его поверхности", "Вытекание смазки из редуктора или вентиляционных каналов", "Появление дыма или запаха, характерного для горящей изоляции", "Появление повышенного шума, стука, вибрации, поломка или появление трещин в корпусной детали, рукоятке, защитном ограждении"], "w": ["Лёгкий нагрев корпуса в пределах, указанных изготовителем", "Наличие заводской пломбы на корпусе", "Незначительное снижение оборотов при увеличении нагрузки в пределах, установленных изготовителем"]}, {"n": 11, "q": "Допускается ли выдавать и использовать для работы электромеханический инструмент и светильники с относящимся к ним вспомогательным оборудованием, не прошедшие периодической проверки?", "ref": "Л14 п.162", "a": ["Не допускается"], "w": ["Допускается в течение одного месяца после окончания срока проверки", "Допускается при положительном результате внешнего осмотра", "Допускается с письменного разрешения лица, ответственного за инструмент"]}, {"n": 12, "q": "Относятся ли работы с применением ручных электрических машин и инструмента к работам с повышенной опасностью?", "ref": "Л3 приложение 1, п.13", "a": ["Да, относятся"], "w": ["Нет, не относятся", "Относятся только при работе на высоте", "Относятся только в особо опасных помещениях"]}]}, {"id": 13, "title": "Инструмент ручной пневматический", "legend": {"Л10": "Типовая инструкции по охране труда при работе с ручными пневматическими машинами (утв. пост. Минтруда и социальной защиты РБ от 31.03.2016 № 16)", "Л14": "Правила по охране труда (утв. пост. Минтруда и соцзащиты РБ от 01.07.2021 № 53, в ред. пост. Минтруда и соцзащиты РБ от 08.08.2025 № 75)"}, "qs": [{"n": 1, "q": "Кто допускается к выполнению работ с применением пневмоинструмента?", "ref": "Л10 п.2", "a": ["Работающие, не моложе 18 лет", "Работающие, прошедшие в установленном порядке инструктаж по охране труда", "Работающие, прошедшие в установленном законодательством порядке медицинский осмотр", "Работающие, прошедшие стажировку", "Работающие, прошедшие проверку знаний по вопросам охраны труда"], "w": ["Работающие, не моложе 16 лет при наличии письменного согласия родителей", "Работающие, имеющие группу по электробезопасности не ниже III", "Работающие, имеющие стаж работы с пневмоинструментом не менее трёх лет без проверки знаний"]}, {"n": 2, "q": "Что должен выполнить работающий перед началом работы с пневмоинструментом?", "ref": "Л10 п.11", "a": ["Проверить исправность средств индивидуальной защиты на отсутствие внешних повреждений", "Осмотреть и подготовить рабочее место, убрать посторонние предметы", "Убедиться в достаточном освещении рабочего места", "Проверить наличие ограждений и других средств коллективной защиты", "Надеть исправные средства индивидуальной защиты"], "w": ["Разобрать пневмоинструмент и смазать его рабочие части", "Снять глушитель шума для проверки его состояния", "Отогреть замёрзший воздуховод открытым пламенем"]}, {"n": 3, "q": "В чем из перечисленного в вариантах ответа необходимо убедиться внешним осмотром перед началом работы с пневмоинструментом?", "ref": "Л10 п.12.7", "a": ["Шланги для подвода сжатого воздуха не повреждены"], "w": ["Манометр на воздушной магистрали опломбирован с истекшим сроком проверки", "Клапан включения поджат в открытом положении для быстрого пуска", "Шланги соединены между собой отрезком гладкой трубки с проволочной скруткой"]}, {"n": 4, "q": "Как при работе с пневмоинструментом устанавливать и снимать вставной инструмент, а также регулировать его?", "ref": "Л10 п.15.5", "a": ["Только после полной остановки и отключения пневматического инструмента от воздушной магистрали"], "w": ["Только после снижения частоты ударов до минимальной при открытом вентиле", "Только при отсоединённом шланге на работающем на холостом ходу пневмоинструменте", "После закрытия клапана включения, не отключая пневматический инструмент от воздушной магистрали"]}, {"n": 5, "q": "При эксплуатации шлангов пневмоинструмента необходимо:", "ref": "Л10 п.15.10, 15.11", "a": ["Предохранять шланги от механических повреждений и соприкосновения с горячими или масляными поверхностями или предметами", "Следить, чтобы шланги не пересекались с транспортными коммуникациями, тросами и кабелями", "Следить, чтобы шланги не пересекались с рукавами для газовой сварки и резки металлов"], "w": ["Натягивать шланги и завязывать их узлом для перекрытия подачи воздуха", "Переносить пневмоинструмент, удерживая его за шланг", "Прокладывать шланги поверх рукавов для газовой сварки для защиты от механических повреждений"]}, {"n": 6, "q": "Что необходимо сделать в случае срыва шланга с пневмоинструмента?", "ref": "Л10 п.15.12", "a": ["Немедленно выключить подачу сжатого воздуха"], "w": ["Удержать шланг руками, перегнув его для перекрытия потока воздуха", "Быстро присоединить шланг обратно к пневмоинструменту", "Продолжить работу до окончания операции и сообщить об этом руководителю"]}, {"n": 7, "q": "Какие требования по охране труда необходимо соблюдать при выполнении работ на пневматических ножницах?", "ref": "Л10 п.18", "a": ["Резать ножницами тот материал и той толщины, для которого они предназначены", "Придерживать заготовку так, чтобы пальцы рук не входили в зону резания", "Следить за тем, чтобы в зону резания не попадали посторонние предметы"], "w": ["Придерживать заготовку голыми руками вблизи ножей для точности реза", "Смазывать ножи на ходу без отключения от воздушной магистрали", "Резать ножницами материал любой толщины при условии снижения давления воздуха"]}, {"n": 8, "q": "Что, из перечисленного запрещается при работе с пневмоинструментом?", "ref": "Л10 п.19.4, 19.5, 19.15, 19.17, 19.18", "a": ["Разбирать пневмоинструмент и самостоятельно устранять неисправности", "Снимать с пневмоинструмента защитные ограждения, средства виброзащиты, управления, глушитель шума", "Отогревать замерзший воздуховод пламенем или продувать его паром", "Допускать продолжительную работу пневмоинструмента вхолостую, превышать предельно допустимую продолжительность непрерывной работы"], "w": ["Применять средства индивидуальной защиты при работе", "Подсоединять шланг к пневмоинструменту при закрытом вентиле", "Осматривать рабочее место перед началом работы"]}, {"n": 9, "q": "Работу с пневмоинструментом следует немедленно прекратить в случаях:", "ref": "Л10 п.20.1, 20.2, 20.4, 20.5", "a": ["Заедания и заклинивания рабочих частей", "Повреждения или перегрева пневмодвигателя, редуктора или рабочего органа", "Наличия большого количества масла в воздухе из пневмопровода", "Изменения давления в воздушной магистрали выше установленной нормы"], "w": ["Понижения температуры воздуха в помещении на 2-3 °С", "Окончания установленного по инструкции перерыва в работе", "Смены работающего в пределах бригады с записью в журнале"]}, {"n": 10, "q": "Работу с пневмоинструментом следует немедленно прекратить в случаях:", "ref": "Л10 п.20.3, 20.6, 20.7, 20.8", "a": ["Повреждения воздухопровода", "Повреждения включающего и отключающего клапанов", "Возникновения угрозы несчастного случая", "Изменения погодных условий, ухудшающих видимость в пределах фронта работ, а также усиления ветра"], "w": ["Появления в зоне работы других работающих, прошедших инструктаж", "Снижения шума при работе после замены глушителя", "Необходимости смены вставного инструмента при плановом его износе"]}, {"n": 11, "q": "Для присоединения шланга к пневмоинструменту на конце шланга имеется разъемный клапан с шариковым замком, перекрывающий выход воздуха из шланга при отсоединенном пневмоинструменте. В каком из указанных ниже случаев шланг правильно подключается к пневмоинструменту и отключается от него?", "ref": "Л14 п.152.", "a": ["Подключение и отключение производятся при закрытом запорном вентиле подачи воздуха в шланг"], "w": ["Подключение и отключение производятся при открытом запорном вентиле подачи воздуха в шланг", "Подключение производится при открытом вентиле, отключение - при закрытом запорном вентиле подачи воздуха", "Подключение производится при закрытом вентиле, отключение - при открытом запорном вентиле, благодаря шариковому замку"]}, {"n": 12, "q": "Допускается ли работающему выпускать пневматический инструмент из рук до полной его остановки?", "ref": "Л14 п.154.", "a": ["Не допускается"], "w": ["Допускается при наличии виброзащитных рукояток", "Допускается при закрытом запорном вентиле подачи воздуха", "Допускается только при работе на холостом ходу"]}]}, {"id": 14, "title": "ОТ при выполнении строительных работ", "legend": {"Л9": "Правила по охране труда при выполнении строительных работ (утв. пост. Минтруда РБ и Минстройархитектуры РБ от 31.05.2019 № 24/33 в ред. пост. Минтруда РБ и Минстройархитектуры РБ от 07.04.2026 № 18/26)"}, "qs": [{"n": 1, "q": "Какие устройства относятся к средствам подмащивания?", "ref": "Л9 п.3", "a": ["Конструкции, предназначенные для организации рабочих мест при производстве работ на высоте, а также иных рабочих мест, расположенных на высоте, независимо от высоты их расположения"], "w": ["Конструкции, предназначенные только для перемещения материалов на высоту и применяемые при работах на высоте более 5 м, независимо от наличия на них рабочих мест", "Приспособления, предназначенные для подъёма работающих на рабочие места, расположенные на высоте более 1,8 м, за исключением конструкций иных рабочих мест", "Грузоподъёмные механизмы и оборудование, предназначенные для организации рабочих мест при производстве работ на высоте 5 м и более от уровня земли"]}, {"n": 2, "q": "Что из указанного ниже относится к опасным производственным факторам, воздействие которых возможно на работающих при выполнении строительных работ?", "ref": "Л9 п.8", "a": ["Расположение рабочих мест на расстоянии менее 2 м от неогражденных перепадов по высоте 1,8 м и более", "Расположение рабочих мест на расстоянии менее 2 м от перепадов по высоте 1,8 м и более при высоте защитного ограждения рабочего места менее 1,0 м", "Выполнение строительных работ на высоте более 1,8 м при нахождении работающего непосредственно на элементах конструкции или оборудования"], "w": ["Расположение рабочих мест на расстоянии более 2 м от перепадов по высоте при наличии защитного ограждения высотой не менее 1,1 м", "Выполнение строительных работ на первом этаже здания на уровне пола при отсутствии рядом перепадов по высоте и незакрытых проёмов", "Выполнение работ на рабочих местах, расположенных на расстоянии более 2 м от перепадов по высоте менее 1,8 м"]}, {"n": 3, "q": "Что из указанного в вариантах ответа, относится к зонам ПОСТОЯННО ДЕЙСТВУЮЩИХ опасных производственных факторов, во время выполнения строительных работ?", "ref": "Л9 п.14", "a": ["Места, находящиеся вблизи неизолированных токоведущих частей электроустановок"], "w": ["Участки перемещения грузов кранами и зоны вблизи строящегося здания", "Места, над которыми происходит монтаж и подъём конструкций", "Этажи зданий, на которых ведутся монтажные работы"]}, {"n": 4, "q": "Начиная с какой высоты, не огражденные перепады по высоте на объекте строительства, относятся к зонам постоянно действующих опасных производственных факторов?", "ref": "Л9 п.14", "a": ["1,8 м и более"], "w": ["1,3 м и более", "1,1 м и более", "2,0 м и более"]}, {"n": 5, "q": "В каком случае рабочие места на объекте строительства, имеющие защитное ограждение перепадов по высоте 1,8 м и более, относятся к зонам постоянно действующих опасных производственных факторов?", "ref": "Л9 п.14", "a": ["При высоте защитного ограждения рабочих мест менее 1,0 м"], "w": ["При высоте защитного ограждения рабочих мест менее 1,1 м", "При высоте защитного ограждения рабочих мест менее 1,2 м", "При высоте защитного ограждения рабочих мест менее 0,8 м"]}, {"n": 6, "q": "Что должно быть установлено на объекте строительства на границах зон ПОСТОЯННО ДЕЙСТВУЮЩИХ опасных производственных факторов?", "ref": "Л9 п.15", "a": ["Защитные ограждения"], "w": ["Сигнальные ограждения и знаки безопасности", "Только знаки безопасности", "Сигнальная лента в два ряда"]}, {"n": 7, "q": "Что должно быть установлено на объекте строительства на границах зон потенциально опасных производственных факторов?", "ref": "Л9 п.15", "a": ["Сигнальные ограждения и знаки безопасности"], "w": ["Защитные ограждения высотой не менее 1,1 м", "Защитно-охранные ограждения высотой не менее 2 м", "Только дежурные сигнальщики без ограждений"]}, {"n": 8, "q": "На объекте строительства контроль за выполнением мероприятий, предусмотренных в наряде-допуске может осуществляться посредством ...", "ref": "Л9 п.18", "a": ["... применения приборов, устройств, оборудования и (или) комплексов (систем) приборов, устройств, оборудования, обеспечивающих дистанционную видео-, аудио- или иную фиксацию процессов производства работ, и осуществления периодической проверки соответствия фактического состояния условий производства работ требованиям безопасности, предусмотренным нарядом-допуском"], "w": ["... ежемесячного письменного отчёта линейного руководителя работ перед лицом, выдавшим наряд-допуск, и записи о выполненных мероприятиях в общем журнале работ с последующей проверкой соответствия фактического состояния условий производства работ требованиям безопасности", "... письменного подтверждения работающих об исполнении мероприятий, передаваемого лицу, выдавшему наряд-допуск, по окончании смены, с последующей проверкой специалистом по охране труда один раз в месяц условий производства работ на соответствие требованиям безопасности", "... телефонного опроса бригадира и работающих с записью сведений в журнал учёта нарядов-допусков, без какой-либо проверки соответствия фактического состояния условий производства работ требованиям безопасности, предусмотренным нарядом-допуском"]}, {"n": 9, "q": "При возникновении опасности для жизни и здоровья работающих линейный руководитель работ по наряду-допуску должен ...", "ref": "Л9 п.18", "a": ["... принять меры по устранению опасности, при необходимости прекратить работы и обеспечить эвакуацию работающих из опасной зоны"], "w": ["... сообщить об опасности лицу, выдавшему наряд-допуск, и продолжить работы до получения от него письменных указаний", "... записать выявленную опасность в наряд-допуск и завершить начатую операцию, после чего вывести работающих из опасной зоны", "... вызвать специалиста по охране труда и приостановить работы только на участке, на котором уже получена травма"]}, {"n": 10, "q": "Может ли линейный руководитель при производстве работ по наряду-допуску отсутствовать на объекте строительства, где производятся эти работы?", "ref": "Л9 п.18", "a": ["Не может"], "w": ["Может при наличии на объекте бригадира", "Может на срок не более 2 часов", "Может при наличии у него средств связи с бригадой"]}, {"n": 11, "q": "При каких условиях выдается наряд-допуск на выполнение строительных работ в охранных зонах сооружений или инженерных коммуникаций?", "ref": "Л9 п.19", "a": ["При наличии разрешения организации-владельца этого сооружения или инженерных коммуникаций"], "w": ["При наличии письменного уведомления организации-владельца за трое суток до начала работ этого сооружения или инженерных коммуникаций", "При наличии согласования наряда-допуска территориальным органом Департамента государственной инспекции труда", "При наличии приказа руководителя строительной организации о назначении ответственного за эти работы"]}, {"n": 12, "q": "Что необходимо сделать в процессе выполнения строительных работ по наряду-допуску, в случае возникновения опасных или вредных производственных факторов, не предусмотренных нарядом-допуском, а также в случае изменения условий производства работ?", "ref": "Л9 п.20", "a": ["Следует прекратить работы и только после выдачи нового наряда-допуска возобновить работы"], "w": ["Следует продолжить работы, внеся изменения в действующий наряд-допуск, и провести целевой инструктаж", "Следует приостановить работы на время устранения факторов и возобновить их без нового наряда-допуска", "Следует сообщить об изменениях лицу, выдавшему наряд-допуск, и завершить работы до конца смены"]}, {"n": 13, "q": "С какой периодичностью линейные руководители строительных работ должны проходить проверку знаний по вопросам охраны труда в объеме требований ТНПА, соблюдение требований которых входит в их должностные обязанности?", "ref": "Л9 п.22", "a": ["Не реже 1 раза в год"], "w": ["Не реже 1 раза в 3 года", "Не реже 1 раза в 5 лет", "Не реже 1 раза в 2 года"]}, {"n": 14, "q": "Допускается ли производство строительных работ с отступлениями от решений проекта организации строительства (ПОС) и проекта производства работ (ППР) без согласования с организациями, разработавшими и утвердившими их?", "ref": "Л9 п.23", "a": ["Не допускается"], "w": ["Допускается при наличии письменного распоряжения главного инженера", "Допускается при отступлениях, не влияющих на сроки работ", "Допускается с разрешения линейного руководителя работ"]}, {"n": 15, "q": "Какое требование предъявляется к каске защитной для всех лиц, находящихся на строительной площадке?", "ref": "Л9 п.25", "a": ["Необходимо всегда носить каску защитную, зафиксированную на голове в соответствии с эксплуатационной документацией"], "w": ["Необходимо носить каску только в зонах действия опасных производственных факторов, снимая её на участках без монтажных работ", "Необходимо носить каску только при нахождении на высоте и в зоне работы грузоподъёмных кранов, независимо от её фиксации", "Необходимо носить каску только работающим строительной организации, для посетителей площадки допускается нахождение без неё"]}, {"n": 16, "q": "Как принимается окончание подготовительных работ на строительной площадке?", "ref": "Л9 п.31", "a": ["Актом"], "w": ["Записью в журнале производства работ", "Приказом руководителя организации", "Устным разрешением заказчика"]}, {"n": 17, "q": "Чем из указанного ниже должны быть оснащены производственные территории, участки работ и рабочие места объекта строительства в соответствии с обязательными требованиями технических нормативных правовых актов?", "ref": "Л9 п.32", "a": ["Системами видеонаблюдения и необходимыми средствами коллективной защиты работающих", "Первичными средствами пожаротушения", "Средствами связи, сигнализации и другими техническими средствами обеспечения безопасных условий труда"], "w": ["Устройствами автоматической регистрации заработной платы, а также персональными компьютерами на каждом рабочем месте", "Автоматическими установками пожаротушения в каждом передвижном бытовом помещении независимо от ТНПА", "Устройствами учёта рабочего времени с передачей данных в организацию здравоохранения"]}, {"n": 18, "q": "Ограждения строительных площадок не должны иметь проемов, кроме ...", "ref": "Л9 п.35", "a": ["... пунктов пропуска, ворот и калиток, контролируемых в течение рабочего времени и запираемых после окончания работы"], "w": ["... оконных проёмов и проездов шириной до 1 м, открытых в течение рабочего времени и не контролируемых после окончания работы", "... проходов для работающих и проездов для транспорта, которые не запираются и остаются открытыми в течение суток", "... проёмов шириной не более 0,3 м, предназначенных для проветривания территории и отвода воды"]}, {"n": 19, "q": "Какая должна быть ширина защитных козырьков над входами строящихся зданий?", "ref": "Л9 п.36", "a": ["Не менее ширины входа"], "w": ["Не менее 1,5 ширины входа", "Не менее 2 м независимо от ширины входа", "Не менее 1,1 м независимо от ширины входа"]}, {"n": 20, "q": "Что должно быть у въезда на производственную территорию строительной площадки?", "ref": "Л9 п.38", "a": ["Схема внутрипостроечных дорог и проездов с указанием мест складирования материалов и конструкций, мест разворота транспортных средств, источников противопожарного водоснабжения"], "w": ["Журнал учёта посетителей с указанием времени въезда и выезда транспортных средств, перечень работников и график их работы на текущую смену, схема расположения бытовых помещений", "Схема расположения подземных коммуникаций с указанием глубин их заложения и организаций-владельцев, а также схема расстановки всех постов охраны на территории строительной площадки", "План производства работ с указанием сроков окончания строительства, сведений о заказчике и генподрядчике и схема размещения только бытовых помещений без указания мест складирования"]}, {"n": 21, "q": "Каковы требования к конструкции ограждения перилами переходных мостиков через траншеи, ямы, канавы?", "ref": "Л9 п.41", "a": ["Перила высотой не менее 1,1 м должны устанавливаться с обеих сторон переходного мостика", "Перила должны иметь внизу сплошную обшивку на высоту 0,15 м", "Перила должны иметь дополнительную ограждающую планку на высоте 0,5 м от настила"], "w": ["Перила допускается устанавливать только с одной стороны мостика при ширине более 1 м", "Перила должны иметь высоту не менее 0,9 м", "Перила допускается заменять натянутой сигнальной лентой при ширине мостика менее 1 м"]}, {"n": 22, "q": "Для работающих, занятых на открытом воздухе и в закрытых необогреваемых помещениях в холодный период, должны быть оборудованы помещения для обогрева. Какой должна быть температура воздуха в этих помещениях?", "ref": "Л9 п.44", "a": ["Не ниже плюс 22 °С"], "w": ["Не ниже плюс 16 °С", "Не ниже плюс 18 °С", "Не ниже плюс 12 °С"]}, {"n": 23, "q": "Колодцы, шурфы и другие выемки должны быть...", "ref": "Л9 п.45", "a": ["... закрыты крышками, щитами или ограждены, а в темное время суток освещены сигнальными светильниками напряжением не выше 25 В"], "w": ["... обозначены только знаками безопасности, а в темное время суток освещены сигнальными светильниками напряжением не выше 42 В", "... закрыты крышками или ограждены только на время перерывов, а в темное время суток освещены светильниками напряжением 220 В", "... засыпаны песком на глубину не менее 0,5 м и обозначены сигнальной лентой, без освещения в темное время суток"]}, {"n": 24, "q": "Какое требование предъявляется в строительстве к рабочим местам, расположенным на высоте 1,8 м и более, на перекрытиях, покрытиях, на расстоянии более 2 м от границы перепада по высоте?", "ref": "Л9 п.47", "a": ["Они должны быть ограждены сигнальными ограждениями"], "w": ["Они должны быть ограждены защитными ограждениями высотой 1,1 м", "Они не требуют какого-либо ограждения независимо от высоты", "Они должны быть ограждены сплошным дощатым забором"]}, {"n": 25, "q": "Какое требование предъявляется в строительстве к рабочим местам, расположенным на высоте 1,8 м и более, на перекрытиях, покрытиях, на расстоянии менее 2 м от границы перепада по высоте?", "ref": "Л9 п.47", "a": ["Они должны быть ограждены защитными ограждениями высотой более 1 м"], "w": ["Они должны быть ограждены сигнальными ограждениями", "Они должны быть ограждены защитными ограждениями высотой более 0,8 м", "Они должны быть обозначены только знаками безопасности"]}, {"n": 26, "q": "Допускается ли совмещать выполнение монтажных работ на нескольких ярусах по одной вертикали?", "ref": "Л9 п.51", "a": ["Допускается при условии, что вышерасположенные места оборудованы соответствующими защитными устройствами (настилами, сетками, навесами), установленными на расстоянии не более 6 м по вертикали от нижерасположенного рабочего места"], "w": ["Допускается при условии, что работающие на нижних ярусах применяют каски, а на верхних ярусах выставлены наблюдающие, без устройства защитных настилов, сеток и навесов", "Не допускается ни при каких условиях, в том числе при наличии защитных устройств (настилов, сеток, навесов) между ярусами на объекте строительства", "Допускается при условии, что вышерасположенные места оборудованы защитными устройствами (настилами, сетками, навесами), установленными на расстоянии не более 12 м по вертикали от нижерасположенного рабочего места"]}, {"n": 27, "q": "Разрешается ли на складах стройматериалов или при складировании на строительной площадке и рабочих местах, прислонять (опирать) материалы и изделия к заборам, деревьям и элементам временных и капитальных сооружений?", "ref": "Л9 п.58", "a": ["Не разрешается"], "w": ["Разрешается при условии дополнительного закрепления материалов и изделий", "Разрешается только для материалов и изделий массой до 50 кг", "Разрешается к элементам капитальных сооружений"]}, {"n": 28, "q": "На какой минимальной высоте над рабочими местами должна производиться разводка временных электросетей напряжением до 1000 В, используемых при электроснабжении объектов строительства?", "ref": "Л9 п.61", "a": ["2,5 м"], "w": ["2,0 м", "3,5 м", "1,8 м"]}, {"n": 29, "q": "Что необходимо предусмотреть при установке светильников общего освещения на объектах строительства, рабочих местах и проходах, на высоте менее 2,5 м?", "ref": "Л9 п.62", "a": ["Использование светильников специальной конструкции или напряжением не выше 25 В"], "w": ["Использование светильников напряжением не выше 42 В без специальной конструкции", "Использование светильников напряжением не выше 110 В с защитным стеклом", "Установку над светильниками только сигнального ограждения при напряжении 220 В"]}, {"n": 30, "q": "Допускается ли при производстве строительных работ использовать стационарные светильники в качестве переносных электрических светильников?", "ref": "Л9 п.62", "a": ["Не допускается"], "w": ["Допускается при наличии защитной сетки на светильнике", "Допускается при напряжении не выше 42 В", "Допускается только при кратковременных работах"]}, {"n": 31, "q": "Металлические строительные леса, металлические ограждения рабочих мест, полки и лотки для прокладки кабелей и проводов, рельсовые пути грузоподъемных кранов и транспортных средств с электрическим приводом, корпуса оборудования, машин и механизмов с электроприводом должны быть заземлены (занулены). В какой самый поздний момент времени их необходимо заземлить (занулить)?", "ref": "Л9 п.65", "a": ["Сразу после их установки на место, до начала каких-либо работ"], "w": ["После окончания всех монтажных работ на объекте", "До начала первого включения электрооборудования, но после начала работ на этих конструкциях", "В течение смены, следующей за их установкой на место"]}, {"n": 32, "q": "Что необходимо сделать перед началом выполнения строительных работ в местах, где возможно появление вредного газа, в том числе в емкостных сооружениях и траншеях?", "ref": "Л9 п.70", "a": ["Провести анализ воздушной среды, оформить наряд-допуск"], "w": ["Включить вентиляцию на 10 минут, провести целевой инструктаж, обойтись без наряда-допуска", "Выдать работающим противогазы и начать работы, сделав запись в журнале производства работ", "Провести только вводный инструктаж и назначить одного наблюдающего без анализа воздушной среды"]}, {"n": 33, "q": "Что из указанного в вариантах ответа должно находиться в санитарно-бытовых помещениях на объекте строительства?", "ref": "Л9 п.80", "a": ["Универсальная аптечка первой помощи", "Носилки", "Фиксирующие шины и другие средства для оказания д ти их применения - приставные лестницы с резиновыми башмаками на нижних концах и закреплённым верхним концом"]}, {"n": 103, "q": "Какие решения, содержащиеся в ПОС, ППР и другой технологической документации, должны быть выполнены для обеспечения безопасности монтажных работ?", "ref": "Л9 п.386", "a": ["Определение марки крана, места установки и опасных зон при его работе. Обеспечение безопасности рабочих мест на высоте и проходов к ним. Определение мест установки средств коллективной защиты от падения человека с высоты", "Определение последовательности установки конструкций. Обеспечение устойчивости конструкций и частей здания в процессе монтажа", "Определение схем и способов укрупнительной сборки элементов конструкций. Определение необходимых средств индивидуальной защиты от падения с высоты (систем обеспечения безопасности работ на высоте), мест и способов их крепления"], "w": ["Определение размера заработной платы монтажников. Определение сроков поставки конструкций заказчиком и порядка оплаты выполненных монтажных работ", "Определение порядка приёмки объекта государственной комиссией. Определение цветового решения фасада и порядка внутренней отделки смонтированного здания", "Определение порядка оформления табелей учёта рабочего времени монтажников и начисления им надбавок за работу на высоте"]}, {"n": 104, "q": "Какие из указанных ниже работ следует выполнять после подъема строительных конструкций на проектную отметку?", "ref": "Л9 п.393", "a": ["Окраску и антикоррозионную защиту в местах стыков и соединений конструкций"], "w": ["Сборку узлов строительных конструкций, требующих работ на высоте", "Основную окраску всех поверхностей конструкций", "Укрупнительную сборку элементов конструкций и навеску площадок"]}, {"n": 105, "q": "Что необходимо выполнять для безопасного перехода на высоте по установленным конструкциям и их элементам (фермам, ригелям и иным), на которых невозможно обеспечить требуемую ширину прохода при установленных ограждениях?", "ref": "Л9 п.402", "a": ["Применять страховочные системы, в составе которых используются анкерные устройства, содержащие жесткие или гибкие анкерные линии, канаты, натянутые вдоль этих конструкций"], "w": ["Проходить по конструкциям с разрешения линейного руководителя работ, держась за смежные элементы, только в защитной каске и спецобуви, без применения систем обеспечения безопасности", "Применять приставные лестницы, уложенные по конструкциям в горизонтальном положении и закреплённые проволокой, с обязательным применением защитной каски и подбородочного ремня", "Применять страховочные системы с креплением стропа непосредственно к элементу конструкции, по которому осуществляется переход, без применения анкерных устройств и анкерных линий"]}, {"n": 106, "q": "Для безопасного перехода на высоте по установленным конструкциям и их элементам (фермам, ригелям и иным) могут применяться страховочные системы. Как определяются места и способы крепления страховочной системы к анкерным устройствам, тип анкерного устройства (размеры анкерной линии, канатов)?", "ref": "Л9 п.403", "a": ["Они указываются в проектной документации и (или) наряде-допуске"], "w": ["Они определяются бригадиром монтажников непосредственно на месте работ исходя из опыта", "Они определяются самим работающим перед началом перехода по конструкциям в устной форме", "Они указываются только в журнале регистрации инструктажа на рабочем месте"]}, {"n": 107, "q": "Где должно быть указано типовое решение по применению средств индивидуальной защиты от падения с высоты (систем обеспечения безопасности работ на высоте) при выполнении монтажа ограждающих панелей?", "ref": "Л9 п.403", "a": ["В проекте производства работ"], "w": ["В журнале производства работ", "В наряде-допуске на производство работ только при монтаже на высоте свыше 10 м", "В должностной инструкции линейного руководителя работ"]}, {"n": 108, "q": "Кто может подавать сигналы машинисту крана, при выполнении монтажных работ в особо ответственных случаях (при подъеме с применением сложного такелажа, метода поворота, при надвижке крупногабаритных и тяжелых конструкций, при подъеме их двумя или более механизмами и т. п.)?", "ref": "Л9 п.414", "a": ["Только руководитель работ"], "w": ["Любой работающий, заметивший опасность", "Только аттестованный стропальщик", "Только бригадир монтажников"]}, {"n": 109, "q": "Как необходимо производить подъем грузоподъемным краном элементов строительных конструкций?", "ref": "Л9 п.418, 419", "a": ["Плавно, без рывков, раскачивания и вращения, в два приема: сначала на высоту 0,2-0,3 м, затем, после проверки надежности строповки, производить дальнейший подъем"], "w": ["Плавно, без рывков, раскачивания и вращения, в один приём на всю высоту, с проверкой надёжности строповки после установки конструкции на проектную отметку", "Быстро, без остановок, чтобы сократить время нахождения груза над рабочей зоной, в два приема: сначала на высоту 1,0 м, затем производить дальнейший подъем", "Плавно, без рывков, раскачивания и вращения, в два приема: сначала на высоту 1,0-1,5 м, затем, после проверки только устойчивости крана, производить дальнейший подъем"]}, {"n": 110, "q": "Как следует производить монтаж узлов оборудования и звеньев трубопроводов и воздухопроводов вблизи электрических проводов (в пределах расстояния, равного наибольшей длине монтируемого узла или звена) при невозможности снять напряжение с проводов?", "ref": "Л9 п.434", "a": ["По наряду-допуску"], "w": ["По устному разрешению главного инженера", "С записью в журнале целевых инструктажей", "Без дополнительных условий при наличии заземления узла"]}, {"n": 111, "q": "Кто дает письменное разрешение на установку и снятие перемычек (связей) между смонтированным и действующим оборудованием, а также на подключение временных установок к действующим системам (электрическим, паровым, технологическим и т.д.)?", "ref": "Л9 п.435", "a": ["Генеральный подрядчик и заказчик"], "w": ["Только линейный руководитель работ", "Только специалист по охране труда генерального подрядчика", "Только организация-изготовитель монтируемого оборудования"]}, {"n": 112, "q": "Какой инструмент должен применяться при монтаже оборудования в условиях взрывоопасной среды?", "ref": "Л9 п.436", "a": ["Исключающий возможность искрообразования"], "w": ["Только с диэлектрическими рукоятками", "Любой исправный инструмент с электрическим приводом", "Изготовленный из углеродистой инструментальной стали"]}, {"n": 113, "q": "Кто должен осмотреть несущие конструкции крыши и ограждений с целью разрешения допуска работников на крышу здания для выполнения кровельных и других работ?", "ref": "Л9 п.439", "a": ["Линейный руководитель работ совместно с работающим, ответственным исполнителем работ"], "w": ["Специалист по охране труда совместно с заказчиком", "Лицо, выдавшее наряд-допуск, без участия других лиц", "Бригадир кровельщиков без участия линейного руководителя работ"]}, {"n": 114, "q": "Производство кровельных работ газопламенным способом следует осуществлять...", "ref": "Л9 п.440", "a": ["... по наряду-допуску"], "w": ["... по распоряжению бригадира с записью в журнале", "... только в ночное время без наряда-допуска", "... по записи в журнале учёта целевых инструктажей"]}, {"n": 115, "q": "Каким должно быть минимальное расстояние по горизонтали от горелок до отдельных баллонов, при производстве кровельных работ газопламенным способом?", "ref": "Л9 п.440", "a": ["5 м"], "w": ["3 м", "10 м", "2 м"]}, {"n": 116, "q": "Сколько эвакуационных выходов (лестниц) необходимо обеспечить при производстве кровельных работ, выполняемых газопламенным способом?", "ref": "Л9 п.443", "a": ["Не менее двух"], "w": ["Не менее одного", "Не менее трёх", "Не менее четырёх"]}, {"n": 117, "q": "Как необходимо подниматься на кровлю и спускаться с нее при производстве кровельных работ?", "ref": "Л9 п.444", "a": ["По внутренним лестничным клеткам и оборудованным для подъема на крышу лестницам"], "w": ["По наружным приставным лестницам, используемым при выполнении кровельных работ", "По пожарным лестницам и через оконные проёмы верхнего этажа", "По любым лестницам или с помощью подъёмника для материалов"]}, {"n": 118, "q": "Как поступать при выполнении кровельных работ на крыше с покрытием, не рассчитанным на нагрузки от веса работающих?", "ref": "Л9 п.445", "a": ["Необходимо применять трапы установленной ширины с поперечными планками для упора ног. Трапы на время работы должны быть закреплены"], "w": ["Необходимо проходить только вдоль конструктивных элементов покрытия, держась за смежные элементы, а работающих не допускать в количестве более двух одновременно", "Необходимо применять трапы шириной не менее 0,2 м без поперечных планок. Трапы на время работы допускается не закреплять при уклоне до 20 °", "Необходимо применять только страховочные системы, закреплённые на покрытии, а трапы использовать только для подъёма материалов на кровлю"]}, {"n": 119, "q": "Для прохода работающих, выполняющих работы на крыше с уклоном более 20 °, а также на крыше с покрытием, не рассчитанным на нагрузки от веса работающих, необходимо применять трапы шириной не менее ...", "ref": "Л9 п.445", "a": ["... 0,3 м"], "w": ["... 0,5 м", "... 0,2 м", "... 0,6 м"]}, {"n": 120, "q": "При выполнении работ на крышах с уклоном более 20 °, а также на расстоянии менее 2 м от неогражденных либо имеющих ограждение менее 1 м перепадов по высоте 1,8 м и более независимо от уклона крыши, работающие должны применять...", "ref": "Л9 п.446", "a": ["... системы обеспечения безопасности работ на высоте (удерживающую систему, систему позиционирования)"], "w": ["... только защитные каски и спецобувь с противоскользящей подошвой", "... только сигнальные ограждения на расстоянии 2 м от перепада", "... только трапы шириной не менее 0,3 м без других средств защиты"]}, {"n": 121, "q": "Где указываются места крепления системы обеспечения безопасности работ на высоте при выполнении работ на крышах с уклоном более 20 °, а также на расстоянии менее 2 м от неогражденных либо имеющих ограждение ме
